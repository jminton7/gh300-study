nt mode's iterative cycle","back":"Find the relevant files and dependencies, make the edits, run terminal commands (install, build, test), then check the output and fix problems, repeating as needed.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/2-what-is-agent-mode"},{"id":"p2m1-c03","module":"p2m1","domain":"features","front":"Self-healing in agent mode","back":"When something fails, such as generated tests, agent mode finds the cause, applies a fix, and re-runs until the check passes.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/3-explore-the-power"},{"id":"p2m1-c04","module":"p2m1","domain":"features","front":"When to choose agent mode","back":"Complex tasks with multiple steps, iterations, and error handling, where Copilot should decide the steps itself or needs external tools such as MCP servers.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-c05","module":"p2m1","domain":"prompt","front":"Large or ambiguous task in agent mode","back":"Draft an implementation plan first, for example with plan mode, then let the agent carry it out. You can also send follow-up prompts to redirect it while it works.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-c06","module":"p2m1","domain":"responsible","front":"Agent mode limitation","back":"It can struggle with specialized domain logic, subtle business rules, or missing project context, which leads to less accurate results and more manual review. Give it clear context.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/3-explore-the-power"},{"id":"p2m1-c07","module":"p2m1","domain":"prompt","front":"Documentation files and agent mode","back":"Project docs such as README.md help agent mode understand how the project is meant to behave, which shapes how it carries out tasks.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/6-summary"},{"id":"p2m1-c08","module":"p2m1","domain":"features","front":"Extending agent mode","back":"Add MCP servers to give the agent tools for external systems and GitHub. Much of agent mode's power comes from the tools it can call.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m2-c01","module":"p2m2","domain":"features","front":"Cloud agent vs agent mode","back":"The cloud agent works in the background on GitHub in its own development environment and produces branches and pull requests. Agent mode makes edits locally in your IDE session.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-code-agent/1-understand-enable-github-copilot-code-agent"},{"id":"p2m2-c02","module":"p2m2","domain":"features","front":"Assigning an issue to Copilot: what you see","back":"Copilot adds a 👀 reaction, opens a draft pull request linked to the issue, works in a session you can watch, then requests your review when it's done.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"p2m2-c03","module":"p2m2","domain":"privacy","front":"copilot/ branches","back":"For new tasks, Copilot can push only to a copilot/ branch created for it, never directly to the default branch. Branch protections and required checks still apply.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-c04","module":"p2m2","domain":"privacy","front":"Approve and run workflows","back":"By default, Actions workflows don't run on Copilot's pushes until a user with write access reviews the changes and clicks Approve and run workflows.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"p2m2-c05","module":"p2m2","domain":"responsible","front":"Who can approve a Copilot PR?","back":"Someone other than the person who asked Copilot to make it; the requester's approval doesn't count toward required approvals. Copilot can't approve or merge its own pull requests, and PRs under Copilot's own identity need one extra approval by default.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-c06","module":"p2m2","domain":"privacy","front":"Who can steer the cloud agent?","back":"Only users with write access. Their @copilot mentions are acted on, and comments from users without write access are never passed to the agent.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-c07","module":"p2m2","domain":"features","front":"copilot-setup-steps.yml","back":"A workflow at .github/workflows/copilot-setup-steps.yml with a single copilot-setup-steps job. It must be on the default branch, runs before Copilot starts, and applies only to sessions on GitHub Actions (not cloud sandboxes, the current default).","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment"},{"id":"p2m2-c08","module":"p2m2","domain":"privacy","front":"Copilot firewall","back":"Limits the agent's internet access by default to reduce exfiltration risk. Admins can use the recommended allowlist and add custom allowlist entries at the organization or repository level.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"p2m2-c09","module":"p2m2","domain":"prompt","front":"Well-scoped cloud agent task","back":"A clear description of the problem, complete acceptance criteria (for example, whether tests are needed), and pointers to the files to change. Treat the issue as a prompt.","source":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"p2m2-c10","module":"p2m2","domain":"privacy","front":"Prompt-injection mitigation (cloud agent)","back":"Hidden characters, such as text in HTML comments in issues or PR comments, are filtered out before the input reaches the agent.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m3-c01","module":"p2m3","domain":"features","front":"Model Context Protocol (MCP)","back":"An open standard for connecting AI models to the tools and data sources they need. The Learn module likens it to a USB-C standard for AI tools.","source":"https://learn.microsoft.com/en-us/training/modules/mcp-server/2-simplify-workflow"},{"id":"p2m3-c02","module":"p2m3","domain":"features","front":"Remote GitHub MCP server","back":"Hosted by GitHub at https://api.githubcopilot.com/mcp/ and recommended for most users. One-click OAuth (or a PAT), with no Docker or local install.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/set-up-the-github-mcp-server"},{"id":"p2m3-c03","module":"p2m3","domain":"features","front":"Local GitHub MCP server","back":"Runs on your machine, for example as a Docker image. Use it when you need a customized setup, have specific security requirements, or use GitHub Enterprise Server, which can't use the remote server.","source":"https://github.com/github/github-mcp-server"},{"id":"p2m3-c04","module":"p2m3","domain":"features","front":"\"MCP servers in Copilot\" policy","back":"An organization or enterprise policy, disabled by default, that controls MCP use. It applies only to users who get Copilot Business or Enterprise from that organization or enterprise.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-c05","module":"p2m3","domain":"features","front":"GitHub MCP server toolsets","back":"Groups of tools you can turn on or off. The defaults include repos, issues, and pull_requests. Enable only what you need for better accuracy and security and fewer context tokens.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/configure-toolsets"},{"id":"p2m3-c06","module":"p2m3","domain":"privacy","front":"COPILOT_MCP_ prefix","back":"Agent secrets and variables whose names start with COPILOT_MCP_ are available only to MCP servers in the cloud agent's MCP configuration. Other agent secrets are exposed as environment variables.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"p2m3-c07","module":"p2m3","domain":"features","front":"MCP limits for cloud agent and code review","back":"Tools only (no MCP resources or prompts), and no remote servers that use OAuth in repository config. Delegated agents call configured tools without asking for approval.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-c08","module":"p2m3","domain":"features","front":"Default MCP servers for cloud agent","back":"GitHub (a read-only token scoped to the current repository) and Playwright (web pages on localhost in the agent's own environment).","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m4-c01","module":"p2m4","domain":"features","front":"Copilot code review: default review type","back":"A Comment review, not Approve or Request changes, so by default it doesn't count toward required approvals or block merging. Admins can opt in to Copilot approvals that count (off by default).","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-c02","module":"p2m4","domain":"features","front":"Automatic Copilot code review at scale","back":"Repository or organization branch rulesets with the automatic Copilot code review rule. Org rulesets can target repositories by name pattern. Users can also turn it on for their own PRs.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review"},{"id":"p2m4-c03","module":"p2m4","domain":"features","front":"\"Review new pushes\" / \"Review draft pull requests\"","back":"Optional automatic review settings. Without Review new pushes, Copilot reviews a pull request only once, so re-request it manually after new commits.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-c04","module":"p2m4","domain":"prompt","front":"Custom instructions for code review","back":".github/copilot-instructions.md for repository-wide rules. Files at .github/instructions/**/*.instructions.md with applyTo globs for path-specific rules. AGENTS.md for context shared across agents.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-c05","module":"p2m4","domain":"prompt","front":"Which branch's instructions does code review use?","back":"The head branch, the one with your changes, so you can test edits to instructions or skills in the same pull request.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-c06","module":"p2m4","domain":"features","front":"Files Copilot code review skips","back":"Dependency management files (such as package.json and Gemfile.lock), log files, and SVG files.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-c07","module":"p2m4","domain":"features","front":"Replying to Copilot review comments","back":"You can react to, resolve, or reply to them like a human's comments, but Copilot doesn't see your replies and won't respond.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-c08","module":"p2m4","domain":"productivity","front":"Copilot pull request summary","back":"Copilot can draft a summary of your changes in the PR description or a comment. It helps reviewers but is separate from reviewing the code.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent"},{"id":"p2m5-c01","module":"p2m5","domain":"prompt","front":"Comment as a prompt","back":"A natural-language comment in a code file, such as \"// Create a web API using express...\", acts as a prompt. Copilot suggests matching code that you can accept (Tab) or reject.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/2-what-is-github-copilot"},{"id":"p2m5-c02","module":"p2m5","domain":"prompt","front":"What is a prompt?","back":"Your input: a set of instructions or guidelines that tell Copilot what to generate. Output quality depends heavily on how well you write it.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m5-c03","module":"p2m5","domain":"prompt","front":"Open files as context","back":"For code completions, Copilot uses your open editor files as extra context. Open relevant files and close irrelevant ones.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m6-c01","module":"p2m6","domain":"prompt","front":"Start general, then get specific","back":"Describe the overall goal first, then list specific requirements, putting the most important ones first. Copilot gives extra weight to the start and end of a prompt.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m6-c02","module":"p2m6","domain":"prompt","front":"Break complex tasks down","back":"Split a large request into small, simple steps and ask Copilot for them one at a time instead of all at once.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m6-c03","module":"p2m6","domain":"prompt","front":"Vague vs specific Python prompt","back":"\"# Create an API endpoint\" is ambiguous. \"# Create an API endpoint using the FastAPI framework that accepts a JSON payload in a POST request\" makes the goal and scope clear.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/4-use-copilot-with-python"},{"id":"extra-c01","module":"extra","domain":"features","front":"Where are Copilot policies configured?","back":"Enterprise: the AI controls tab (Agents, Copilot, MCP pages). Organization: Settings > Copilot > Policies (features) and Models.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-enterprise/manage-enterprise-policies"},{"id":"extra-c02","module":"extra","domain":"features","front":"Enterprise policy options","back":"For most policies: explicitly enable, explicitly disable, or 'Let organizations decide'. An explicit enterprise setting can't be overridden by organization owners.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-c03","module":"extra","domain":"features","front":"Policy conflict: multiple orgs, same enterprise","back":"Usually the least restrictive applies (any org enabling a feature enables it). Exceptions are sensitive policies such as the Copilot Metrics API and suggestions matching public code, where the most restrictive applies.","source":"https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts"},{"id":"extra-c04","module":"extra","domain":"features","front":"Policy conflict: multiple enterprises","back":"The most restrictive policy almost always applies. For example, if any enterprise disables Copilot Chat on GitHub, it's disabled for the user.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-c05","module":"extra","domain":"features","front":"Who do Copilot policies apply to?","back":"Generally only users who get their Copilot Business/Enterprise license from that enterprise or organization. A few policies, such as blocking Copilot in the cloud in enterprise repositories, cover everyone.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-c06","module":"extra","domain":"features","front":"Default availability policies","back":"Two policies decide whether unconfigured GA features ('Default policy for new features and clients') and GA models ('Default availability for released models') default to on or off. Preview features and pre-GA models aren't covered.","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-c07","module":"extra","domain":"features","front":"Surfaces covered by policies","back":"Any surface where users sign in to Copilot: IDEs, GitHub.com, Copilot CLI, and more. Not every policy applies to every surface, so check the supported-surfaces reference.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-c08","module":"extra","domain":"features","front":"Personal plan + assigned Business/Enterprise seat","back":"The personal Pro/Pro+/Max plan is cancelled automatically with a prorated refund. The user then follows the company's policies.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-c09","module":"extra","domain":"features","front":"Seat billing across orgs in one enterprise","back":"A unique user is billed once per cycle even with seats from several orgs. Business + Enterprise seats means only the Enterprise seat is billed. Removing all of an org's seats cancels its Copilot plan.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-c10","module":"extra","domain":"features","front":"Copilot audit log: logged vs not logged","back":"Logged: plan changes (settings, policies, seats/licenses, content exclusions) and agent activity on GitHub. Not logged: client session data such as prompts sent locally.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-c11","module":"extra","domain":"features","front":"Audit log search terms for Copilot","back":"'action:copilot' shows all Copilot plan events (e.g. copilot.cfb_seat_assignment_created). 'actor:Copilot' shows agent activity. Retention is 180 days; stream to a SIEM for longer.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-c12","module":"extra","domain":"features","front":"Key Copilot audit log events","back":"cfb_seat_added / cfb_seat_cancelled (seats), cfb_org_settings_changed / cfb_enterprise_settings_changed (feature settings), cfb_seat_management_changed (org access setting: all members, selected, or disabled), content_exclusion_changed (excluded paths).","source":"https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise"},{"id":"extra-c13","module":"extra","domain":"features","front":"REST: Copilot user management endpoints","back":"GET /orgs/{org}/copilot/billing (summary and settings); GET .../billing/seats (list seats); POST/DELETE .../billing/selected_users and .../billing/selected_teams; GET /orgs/{org}/members/{username}/copilot.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-c14","module":"extra","domain":"features","front":"REST: removing Copilot users or teams","back":"DELETE on selected_users or selected_teams marks seats 'pending cancellation'; access ends at the end of the billing cycle unless kept through a team. A team-assigned seat can't be removed via selected_users (422). Org owners only.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-c15","module":"extra","domain":"features","front":"REST: Copilot usage metrics","back":"Report endpoints (e.g. .../copilot/metrics/reports/organization-28-day/latest) return signed download links to daily or 28-day reports. They require the enterprise's 'Copilot usage metrics' policy to be set to Enabled everywhere.","source":"https://docs.github.com/en/rest/copilot/copilot-metrics"},{"id":"extra-c16","module":"extra","domain":"prompt","front":"Custom instructions vs prompt files","back":"Custom instructions (.github/copilot-instructions.md, .github/instructions/*.instructions.md) apply automatically in their scope. Prompt files (.prompt.md, usually .github/prompts) are reusable templates you call when needed.","source":"https://docs.github.com/en/copilot/concepts/prompting-and-context/prompt-files"},{"id":"extra-c17","module":"extra","domain":"prompt","front":"AGENTS.md vs .github/agents","back":"AGENTS.md (or CLAUDE.md/GEMINI.md) holds agent instructions, similar to repository-wide instructions. Files in .github/agents (e.g. NAME.agent.md) define custom agents: a role with instructions, tools, and optionally a model.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-c18","module":"extra","domain":"prompt","front":"Instruction precedence in Copilot Chat on GitHub.com","back":"Personal > repository (path-specific > repository-wide > AGENTS.md) > organization. VS Code, Visual Studio and Copilot CLI combine instruction files without a general precedence order.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-c19","module":"extra","domain":"features","front":"Organization custom instructions: scope","back":"Copilot Business/Enterprise only. Used for GitHub-website sessions and Copilot code review, not local client sessions. Apply to all org members, whichever org licenses them.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-c20","module":"extra","domain":"features","front":"Custom agent vs subagent","back":"A custom agent is the definition of a specialist. A subagent is an agent doing delegated work in its own context window, which keeps the main conversation focused and lets independent tasks run in parallel.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-custom-agents"},{"id":"extra-c21","module":"extra","domain":"features","front":"VS Code built-in agents (Copilot harness)","back":"Ask: read-only questions and research. Plan (/plan): research plus a plan to review. Agent: implements and validates changes. Autopilot is a separate mode, not a built-in agent.","source":"https://code.visualstudio.com/docs/agents/run/agent-harnesses"},{"id":"extra-c22","module":"extra","domain":"features","front":"Copilot Memory: two scopes","back":"Repository-level facts are shared with collaborators and used only in that repository. User-level preferences follow you across repositories. Secrets are rejected and not stored.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-memory"},{"id":"extra-c23","module":"extra","domain":"features","front":"GitHub Spark status","back":"Spark on github.com stopped accepting new users and new apps on 4 Aug 2026 (export window to 31 Aug); deployed apps keep working. Older material (and possibly the exam) still presents Spark as a current feature.","source":"https://github.blog/changelog/2026-08-04-upcoming-deprecation-of-github-spark-on-github-com/"},{"id":"p1m1-c20","module":"p1m1","domain":"responsible","front":"Accountability in practice","back":"People, not the AI, answer for AI systems. AI creators and deployers take responsibility for how their systems operate, continuously monitor performance, and mitigate risks.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c21","module":"p1m1","domain":"responsible","front":"Pseudonymization vs. aggregation","back":"Pseudonymization replaces personal details with random identifiers but keeps each record separate. Aggregation groups data into summaries, which removes individual details.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c22","module":"p1m1","domain":"responsible","front":"Privacy and security: keys and access","back":"Store keys in HSMs or secure vaults, consider envelope encryption (two keys), rotate and back up keys, limit employee access to sensitive models and data, classify data by sensitivity, and run regular security audits.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c23","module":"p1m1","domain":"responsible","front":"\"Check Copilot's work\" (GitHub best practices)","back":"Understand suggested code before you use it (ask Chat to explain it). Review it for functionality, security, readability and maintainability. Use automated tests and tooling such as linting, code scanning and IP scanning.","source":"https://docs.github.com/en/copilot/get-started/best-practices"},{"id":"p1m1-c24","module":"p1m1","domain":"responsible","front":"Who owns Copilot output?","back":"GitHub does not claim ownership of your input or output. You are responsible for how you use it, including checking whether matched code needs a third-party license and complying with that license.","source":"https://docs.github.com/en/site-policy/github-terms/github-terms-of-service#j-ai-features-training-and-your-data"},{"id":"p1m1-c25","module":"p1m1","domain":"responsible","front":"Consequential decisions and sensitive domains","back":"Decisions with legal or significant impact on access to things like employment, housing, healthcare, insurance or finance. Use extra caution, and make sure affected people can understand decisions, appeal them, and update their input data.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-c26","module":"p1m1","domain":"responsible","front":"Red teaming","back":"Structured testing in which testers deliberately try to provoke unsafe, harmful or unintended behavior from an AI system, to find vulnerabilities and improve safety mitigations. GitHub red-teams its Copilot features.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-c27","module":"p1m1","domain":"responsible","front":"Content filtering in Copilot","back":"A safety system that scans prompts and responses to detect and block harmful content (and, for suggestions, insecure code). It reduces risk but doesn't replace review. Report offensive output to copilot-safety@github.com.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-c28","module":"p1m1","domain":"responsible","front":"Copilot limitations GitHub documents","back":"Limited scope (complex code, obscure languages), potential biases, security risks, possible matches with public code, inaccurate code that looks valid, weaker answers to non-coding questions, and an English-first design.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-c29","module":"p1m1","domain":"responsible","front":"GitHub's responsible use docs (application cards)","back":"Per-feature documents (Chat, inline suggestions, agents) that describe capabilities, intended uses, limitations and mitigations. GitHub presents them as transparency in practice. Older docs called them \"Responsible use of GitHub Copilot ...\" pages.","source":"https://docs.github.com/en/copilot/responsible-use"},{"id":"p1m1-c30","module":"p1m1","domain":"responsible","front":"What a \"Verified\" Copilot cloud agent commit does and doesn't tell you","back":"It shows the commit was made by Copilot and hasn't been altered. The human who started the task is the co-author, and the commit links to the session logs. It says nothing about correctness, so review and test before merging.","source":"https://docs.github.com/en/copilot/responsible-use/agents"},{"id":"p1m3-c30","module":"p1m3","domain":"data","front":"Prompt/suggestion retention defaults (Business & Enterprise, exam-era)","back":"Copilot Chat in the code editor (and IDE completions): not retained. Copilot in GitHub and GitHub Mobile: up to 28 days. Learn now also lists Copilot CLI as not retained (older material grouped it with 28 days). After the exam outline (announced 28 Aug 2026), github.com chat moves to life-of-account retention.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m3-c31","module":"p1m3","domain":"data","front":"Four categories of data Copilot processes","back":"User engagement data (pseudonymous events: accepts/dismisses, errors, usage metrics), prompts (inputs plus context), suggestions (generated code or chat answers), and feedback data (thumbs up/down, comments, support tickets).","source":"https://github.com/features/copilot#faq"},{"id":"p1m3-c32","module":"p1m3","domain":"data","front":"Retention of user engagement data and feedback data","back":"Business/Enterprise defaults (exam-era GitHub Copilot FAQ / Trust Center): user engagement data kept for two years; feedback data stored as long as needed for its intended purpose. Both apply whether Copilot is used in the IDE or elsewhere.","source":"https://web.archive.org/web/20260228173246/https://github.com/features/copilot"},{"id":"p1m3-c33","module":"p1m3","domain":"data","front":"Is Copilot data used to train AI models?","back":"Business/Enterprise: no; their data is protected under GitHub's Data Protection Agreement (the training setting isn't shown). Individual plans (Free/Pro/Pro+/Max): may be used for training (since 24 Apr 2026) unless the user disables 'Allow GitHub to use my data for AI model training'.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m3-c34","module":"p1m3","domain":"data","front":"Context gathered when building an inline-suggestion prompt","back":"Code before and after the cursor (Fill-in-the-Middle), file name and type, adjacent open tabs, project structure and file paths, and languages/frameworks. Content-excluded files are left out in the IDE.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c35","module":"p1m3","domain":"data","front":"Outbound flow (order)","back":"1) Toxicity filter removes harmful generated content. 2) Proxy applies final checks: code quality/security (e.g. XSS, SQL injection) and the optional public-code filter. 3) Failing output is truncated or discarded. 4) Passing suggestions are delivered. 5) Feedback loop from accepts, edits and rejections.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c36","module":"p1m3","domain":"data","front":"Four-stage pipeline (GitHub application card)","back":"Input processing (code and context pre-processed into a prompt) → language model analysis → response generation → output formatting (shown as a distinct suggestion, applied only if you accept it).","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-c37","module":"p1m3","domain":"data","front":"Insecure-code filtering targets","back":"Copilot's filters block or flag common vulnerable patterns such as hardcoded credentials, SQL injection and path injection. They don't replace testing, code review and security tools like code scanning.","source":"https://github.com/features/copilot#faq"},{"id":"p1m3-c38","module":"p1m3","domain":"data","front":"Training-data limits: language coverage and outdated APIs","back":"Suggestion quality depends on the volume and diversity of training data per language (JavaScript is strong; rare languages are weaker). Public training code can contain outdated APIs or idioms, so give current docs or examples as context.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-c39","module":"p1m3","domain":"data","front":"Non-determinism and hallucination","back":"LLMs generate output probabilistically, so the same prompt can give different suggestions. They can also hallucinate: produce plausible but incorrect or fabricated output. Always review and test.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-c40","module":"p1m3","domain":"data","front":"Copilot Chat web search (Bing): data sharing","back":"Optional and admin-controlled. When used, the prompt plus additional context is turned into a Bing query, governed by Microsoft's Privacy Statement. Useful for recent events and new technologies.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m2-c40","module":"p1m2","domain":"features","front":"Individual plans vs organization plans","back":"Individual plans (Free, Pro, Pro+, and now Student and Max) have no content exclusion and no organization-wide policy management. Business and Enterprise add central seat and policy control, content exclusion, and organization custom instructions, and their data isn't used for model training.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c41","module":"p1m2","domain":"features","front":"Copilot Business: why organizations choose it","back":"It gives centralized management and policy controls, public-code filtering with code referencing, and IP indemnity with enterprise-grade security and privacy. Business data is covered by the Data Protection Agreement and isn't used for training.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-to-github-copilot/2-github-copilot-your-ai-pair-programmer"},{"id":"p1m2-c42","module":"p1m2","domain":"features","front":"Premium requests vs AI credits","back":"Exam-era material measures usage allowances in premium requests. Current GitHub docs use GitHub AI Credits. Either way, Pro+ has more than Pro, and Enterprise has more per seat than Business.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m6-c40","module":"p1m6","domain":"features","front":"What is GitHub Copilot CLI?","back":"An AI agent in your terminal. It answers questions, writes and debugs code, and works with GitHub.com (issues, PRs). Run copilot for an interactive session, or copilot -p \"PROMPT\" to run one prompt and exit.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-c41","module":"p1m6","domain":"features","front":"Copilot CLI credential order","back":"COPILOT_GITHUB_TOKEN → GH_TOKEN → GITHUB_TOKEN → OAuth token stored by copilot login or /login → gh CLI token. Classic PATs (ghp_) aren't supported. A fine-grained PAT must be user-owned and have the Copilot Requests permission.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/authenticate-copilot-cli"},{"id":"p1m6-c42","module":"p1m6","domain":"features","front":"Copilot CLI interactive session tips","back":"Type @path to add a file to the prompt, and start a line with ! to run a shell command without calling the model. Press Esc twice to stop a running task. Use copilot --continue or --resume / /resume to pick a session back up.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/overview"},{"id":"p1m6-c43","module":"p1m6","domain":"features","front":"RETIRED: the gh copilot extension (older exam material)","back":"You signed in to GitHub CLI with gh auth login, then installed the extension with gh extension install github/gh-copilot. gh copilot suggest \"...\" proposed a command, and gh copilot explain \"...\" explained one. It stopped working on 25 October 2025.","source":"https://github.com/github/gh-copilot"},{"id":"p1m6-c44","module":"p1m6","domain":"features","front":"Old gh copilot vs current Copilot CLI","back":"Old gh-copilot was a GitHub CLI extension that only suggested and explained shell commands; it couldn't edit files or open PRs. Its replacement is the agentic Copilot CLI (copilot), which can edit files, run commands with approval, and create PRs.","source":"https://github.blog/changelog/2025-09-25-upcoming-deprecation-of-gh-copilot-cli-extension/"},{"id":"p1m8-c40","module":"p1m8","domain":"productivity","front":"Refactoring requests that work well (cookbook)","back":"Ask Copilot to improve variable names, replace if/else chains (for example with a lookup map), flatten nesting with guard clauses, or split large methods. Re-run your tests afterwards, because responses are non-deterministic.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/refactor-code/improve-code-readability"},{"id":"p1m8-c41","module":"p1m8","domain":"productivity","front":"Copilot for security fixes vs code scanning","back":"Copilot Chat can find common vulnerabilities (XSS, SQL injection, CSRF) and suggest fixes, but it isn't a comprehensive security analysis. Keep using code scanning (CodeQL) and Dependabot, and review every fix.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/analyze-security/find-vulnerabilities"},{"id":"p1m8-c42","module":"p1m8","domain":"productivity","front":"Modernizing legacy code with Copilot","back":"First have Copilot explain the code (/explain with #file) and diagram the data flow. Write a test plan or tests for the current behavior, then convert in small steps on branches. Review each change, then generate unit and integration tests.","source":"https://github.blog/ai-and-ml/github-copilot/modernizing-legacy-code-with-github-copilot-tips-and-examples/"},{"id":"p1m8-c43","module":"p1m8","domain":"productivity","front":"Mocks and end-to-end tests with Copilot","back":"For isolated unit tests, ask /tests to mock the service object. For E2E tests, name the framework (Playwright, Selenium, Cypress). Attaching an existing test as an example (#file) helps Copilot follow your conventions.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/testing-code/create-mock-objects"},{"id":"extra-c40","module":"extra","domain":"features","front":"Giving feedback on Copilot Chat","back":"In VS Code and Xcode, use the thumbs up/down icons next to a response. Visual Studio has a Send feedback button, JetBrains has a share feedback link, and Copilot CLI uses /feedback. Report offensive content to copilot-safety@github.com.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/chat-with-copilot/chat-in-ide"},{"id":"extra-c41","module":"extra","domain":"features","front":"Copilot Edits (edit mode)","back":"You choose the files in a working set and prompt, then Accept or Discard the proposed edits per file. Best for a defined set of files and full control over request use. Exam-era VS Code offered it; since VS Code 1.110 (Feb 2026 release) it's hidden by default but can be re-enabled, and JetBrains still offers it.","source":"https://code.visualstudio.com/updates/v1_110"}]};</script>
<script>
(() => {
"use strict";

const MODULES = {
  p1m1: "Responsible AI",
  p1m2: "Intro to Copilot",
  p1m3: "Prompt engineering",
  p1m4: "Copilot Spaces",
  p1m5: "Advanced features",
  p1m6: "Across environments",
  p1m7: "Management & customization",
  p1m8: "Developer use cases",
  p1m9: "Unit tests",
  p2m1: "Agent mode",
  p2m2: "Copilot in the cloud",
  p2m3: "MCP Server",
  p2m4: "Code review & PRs",
  p2m5: "JavaScript",
  p2m6: "Python",
  extra: "Exam-guide extras"
};
const PARTS = [
  ["Part 1", ["p1m1","p1m2","p1m3","p1m4","p1m5","p1m6","p1m7","p1m8","p1m9"]],
  ["Part 2", ["p2m1","p2m2","p2m3","p2m4","p2m5","p2m6"]],
  ["Extras", ["extra"]]
];
const DOMAINS = {
  responsible: { name: "Responsible AI", w: 17.5, label: "15–20%" },
  features: { name: "Copilot features", w: 27.5, label: "25–30%" },
  data: { name: "Data & architecture", w: 12.5, label: "10–15%" },
  prompt: { name: "Prompt engineering", w: 12.5, label: "10–15%" },
  productivity: { name: "Productivity", w: 12.5, label: "10–15%" },
  privacy: { name: "Privacy & safeguards", w: 12.5, label: "10–15%" }
};
const MODE_NAMES = { quiz: "Quiz", cards: "Flashcards", weak: "Weak spots", mock: "Mock exam", retry: "Retry" };
const MOCK_SIZE = 50;
const MOCK_MS = 100 * 60 * 1000;
const LETTERS = "ABCDE";
const isMulti = it => Array.isArray(it.answer);
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
const isRight = (it, picked) => picked != null && (isMulti(it) ? sameSet(picked, it.answer) : picked === it.answer);

const ALL = [
  ...BANK.questions.map(x => ({ ...x, type: "q" })),
  ...BANK.cards.map(x => ({ ...x, type: "c" }))
];
const QUESTIONS = ALL.filter(x => x.type === "q");

const KEY = "gh300-study-v1";
const S = load();
function load() {
  const d = { items: {}, mods: null, len: 20, hist: [] };
  try { return Object.assign(d, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { return d; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }

function rec(id, ok) {
  const r = S.items[id] || (S.items[id] = { s: 0, c: 0, w: 0, box: 0, last: 0 });
  r.s++;
  if (ok) { r.c++; r.box = Math.min(4, r.box + 1); } else { r.w++; r.box = 0; }
  r.last = Date.now();
  save();
}
function weight(x) {
  const r = S.items[x.id];
  if (!r) return 3;
  const base = [6, 3, 1.5, 0.7, 0.3][r.box];
  const days = (Date.now() - r.last) / 864e5;
  return base * (1 + Math.min(days, 3) * 0.3);
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pick(pool, n, wfn) {
  return pool
    .map(x => ({ x, k: Math.pow(Math.random(), 1 / Math.max(wfn(x), 1e-6)) }))
    .sort((a, b) => b.k - a.k)
    .slice(0, n)
    .map(o => o.x);
}
// Scale each item's weight so domains come up in proportion to the real exam, not to how many items the bank has.
function examWeighted(pool) {
  const counts = {};
  for (const x of pool) counts[x.domain] = (counts[x.domain] || 0) + 1;
  return x => weight(x) * ((DOMAINS[x.domain] || { w: 10 }).w / counts[x.domain]);
}
const pct = (c, n) => (n ? Math.round((c / n) * 100) : 0);
function srcLink(url) {
  if (!url) return null;
  let label = url;
  try { const u = new URL(url); label = u.hostname.replace(/^www\./, "") + u.pathname.replace(/\/$/, ""); } catch {}
  return h("a", { class: "src", href: url, target: "_blank", rel: "noopener" }, "Source: " + label);
}
function fmt(ms) {
  const s = Math.ceil(ms / 1000);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function activeMods() { return S.mods && S.mods.length ? S.mods : Object.keys(MODULES); }
function inScope(x) { return activeMods().includes(x.module); }
function weakPool() {
  return ALL
    .filter(x => inScope(x) && S.items[x.id] && S.items[x.id].w > 0 && S.items[x.id].box < 3)
    .sort((a, b) => weight(b) - weight(a));
}
function mockSet(n) {
  const totalW = Object.values(DOMAINS).reduce((a, d) => a + d.w, 0);
  const chosen = new Set();
  const pool = QUESTIONS.filter(q => !q.recent);
  for (const [key, d] of Object.entries(DOMAINS)) {
    const want = Math.round((n * d.w) / totalW);
    shuffle(pool.filter(q => q.domain === key)).slice(0, want).forEach(q => chosen.add(q));
  }
  const rest = shuffle(pool.filter(q => !chosen.has(q)));
  while (chosen.size < n && rest.length) chosen.add(rest.pop());
  return shuffle([...chosen].slice(0, n));
}

const view = document.getElementById("view");
let TAB = "home";
let SES = null;
let timer = null;

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === TAB && !SES));
  let v;
  if (SES) v = SES.done ? summaryView() : sessionView();
  else if (TAB === "stats") v = statsView();
  else if (TAB === "about") v = aboutView();
  else v = homeView();
  view.replaceChildren(v);
}
function go(tab) {
  TAB = tab;
  SES = null;
  stopTimer();
  document.body.classList.remove("insession");
  render();
  window.scrollTo(0, 0);
}

function homeView() {
  const seenQ = QUESTIONS.filter(x => S.items[x.id]).length;
  let s = 0, c = 0;
  for (const r of Object.values(S.items)) { s += r.s; c += r.c; }
  const scopeQ = ALL.filter(x => x.type === "q" && inScope(x)).length;
  const scopeC = ALL.filter(x => x.type === "c" && inScope(x)).length;
  const weak = weakPool().length;
  const mode = (title, desc, fn, disabled) =>
    h("button", { class: "btn mode", onclick: fn, disabled }, h("b", {}, title), h("small", {}, desc));
  return h("div", {},
    h("h1", {}, "GH-300 Study"),
    h("div", { class: "muted" }, `${seenQ}/${QUESTIONS.length} questions seen` + (s ? ` · ${pct(c, s)}% correct overall` : "")),
    h("h2", {}, "Study"),
    mode("Quiz", `${scopeQ} questions in scope · instant feedback · favours ones you miss`, () => start("quiz"), !scopeQ),
    mode("Flashcards", `${scopeC} cards in scope · tap to flip, then rate yourself`, () => start("cards"), !scopeC),
    mode("Weak spots", weak ? `${weak} items you've been missing` : "Nothing here yet. Miss a few questions first.", () => start("weak"), !weak),
    mode("Mock exam", `${MOCK_SIZE} questions weighted like the real exam · 100 min · results at the end · all topics`, () => start("mock")),
    h("h2", {}, "Session length"),
    seg([10, 20, 40], S.len, v => { S.len = v; save(); render(); }),
    h("h2", {}, "Topics"),
    topicsPicker()
  );
}
function seg(values, cur, fn) {
  return h("div", { class: "seg" }, values.map(v => h("button", { class: v === cur ? "on" : "", onclick: () => fn(v) }, v)));
}
function topicsPicker() {
  const on = new Set(activeMods());
  const all = Object.keys(MODULES);
  const setMods = arr => { S.mods = arr.length === all.length || !arr.length ? null : arr; save(); render(); };
  const toggle = m => {
    const next = new Set(on);
    if (!S.mods) { setMods([m]); return; }
    next.has(m) ? next.delete(m) : next.add(m);
    setMods([...next]);
  };
  const out = [
    h("div", { class: "chips" },
      h("button", { class: "chip link" + (!S.mods ? " on" : ""), onclick: () => setMods(all) }, "All topics"),
      PARTS.slice(0, 2).map(([name, mods]) =>
        h("button", { class: "chip link", onclick: () => setMods(mods) }, "Only " + name))
    )
  ];
  for (const [name, mods] of PARTS) {
    out.push(h("div", { class: "grp" }, name));
    out.push(h("div", { class: "chips" }, mods.map(m =>
      h("button", { class: "chip" + (S.mods && on.has(m) ? " on" : ""), onclick: () => toggle(m) }, MODULES[m]))));
  }
  out.push(h("div", { class: "muted", style: "font-size:13px" }, S.mods ? "Tap topics to add or remove them." : "Studying everything. Tap a topic to focus on it."));
  return h("div", {}, out);
}

function start(mode) {
  let items = [];
  if (mode === "quiz") items = pick(QUESTIONS.filter(inScope), S.len, examWeighted(QUESTIONS.filter(inScope)));
  else if (mode === "cards") items = pick(ALL.filter(x => x.type === "c" && inScope(x)), S.len, examWeighted(ALL.filter(x => x.type === "c" && inScope(x))));
  else if (mode === "weak") items = shuffle(weakPool().slice(0, S.len));
  else if (mode === "mock") items = mockSet(MOCK_SIZE);
  if (!items.length) return;
  begin(mode, items);
}
function begin(mode, items) {
  SES = {
    mode, items, i: 0, t0: Date.now(), done: false,
    st: items.map(x => ({ order: x.type === "q" ? shuffle(x.options.map((_, i) => i)) : null, picked: null, sel: [], checked: false, flipped: false, res: null }))
  };
  document.body.classList.add("insession");
  history.pushState({ s: 1 }, "");
  if (mode === "mock") startTimer();
  render();
  window.scrollTo(0, 0);
}
function startTimer() {
  stopTimer();
  timer = setInterval(() => {
    if (!SES) return stopTimer();
    const r = Math.max(0, SES.t0 + MOCK_MS - Date.now());
    const el = document.getElementById("timer");
    if (el) el.textContent = fmt(r);
    if (r <= 0) finish();
  }, 1000);
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }

function sessionView() {
  const s = SES, it = s.items[s.i], st = s.st[s.i];
  const remaining = Math.max(0, s.t0 + MOCK_MS - Date.now());
  return h("div", {},
    h("div", { class: "top" },
      h("button", { class: "x", onclick: () => quit(false), "aria-label": "End session" }, "×"),
      h("div", { class: "grow" }, `${MODE_NAMES[s.mode]} · ${s.i + 1} of ${s.items.length}`),
      s.mode === "mock" ? h("div", { id: "timer", class: "muted" }, fmt(remaining)) : null
    ),
    h("div", { class: "bar" }, h("i", { style: `width:${(s.i / s.items.length) * 100}%` })),
    h("div", { class: "tags" },
      h("span", { class: "tag" }, MODULES[it.module] || it.module),
      h("span", { class: "tag" }, (DOMAINS[it.domain] || {}).name || it.domain),
      it.recent ? h("span", { class: "tag", style: "color:var(--warn);border-color:var(--warn)" }, "Newer than exam") : null
    ),
    it.type === "q" ? questionBody(it, st) : cardBody(it, st)
  );
}
function questionBody(it, st) {
  const mock = SES.mode === "mock";
  const multi = isMulti(it);
  const answered = multi ? (mock ? st.sel.length > 0 : st.checked) : st.picked != null;
  const reveal = !mock && answered;
  const opts = st.order.map((oi, k) => {
    let cls = "btn opt";
    const chosen = multi ? st.sel.includes(oi) : oi === st.picked;
    const correct = multi ? it.answer.includes(oi) : oi === it.answer;
    if (reveal) cls += correct ? " right" : chosen ? " wrong" : " dim";
    else if (chosen) cls += " sel";
    return h("button", { class: cls, onclick: () => choose(oi) }, h("span", { class: "l" }, LETTERS[k]), h("span", {}, it.options[oi]));
  });
  const parts = [h("div", { class: "q" }, it.q), opts];
  if (reveal) {
    const ok = st.res;
    const letters = (multi ? it.answer : [it.answer]).map(a => LETTERS[st.order.indexOf(a)]).sort().join(" and ");
    parts.push(h("div", { class: "fb " + (ok ? "ok" : "bad") },
      h("b", {}, ok ? "✓ Correct" : `✗ Incorrect. The answer${multi ? "s are" : " is"} ${letters}.`),
      h("div", {}, it.explain),
      srcLink(it.source)));
  }
  const last = SES.i === SES.items.length - 1;
  const need = multi ? it.answer.length : 1;
  const row = h("div", { class: "row" });
  if (mock && SES.i > 0) row.append(h("button", { class: "btn", onclick: () => move(-1) }, "Back"));
  if (multi && !mock && !st.checked) {
    row.append(h("button", { class: "btn primary", disabled: st.sel.length !== need, onclick: check }, `Check answer (${st.sel.length}/${need})`));
  } else {
    row.append(h("button", { class: "btn primary", disabled: !answered && !mock, onclick: () => move(1) },
      last ? "Finish" : mock && !answered ? "Skip" : "Next"));
  }
  parts.push(row);
  return h("div", {}, parts);
}
function choose(oi) {
  const it = SES.items[SES.i], st = SES.st[SES.i];
  const mock = SES.mode === "mock";
  if (isMulti(it)) {
    if (!mock && st.checked) return;
    if (st.sel.includes(oi)) st.sel = st.sel.filter(x => x !== oi);
    else { st.sel = [...st.sel, oi]; if (st.sel.length > it.answer.length) st.sel.shift(); }
    if (mock) st.picked = st.sel.length ? st.sel.slice() : null;
    render();
    return;
  }
  if (mock) { st.picked = oi; render(); return; }
  if (st.picked != null) return;
  st.picked = oi;
  st.res = isRight(it, oi);
  rec(it.id, st.res);
  render();
  const fb = document.querySelector(".fb");
  if (fb) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function check() {
  const it = SES.items[SES.i], st = SES.st[SES.i];
  st.checked = true;
  st.picked = st.sel.slice();
  st.res = isRight(it, st.picked);
  rec(it.id, st.res);
  render();
  const fb = document.querySelector(".fb");
  if (fb) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function cardBody(it, st) {
  const parts = [h("div", { class: "flash", onclick: () => { if (!st.flipped) { st.flipped = true; render(); } } },
    h("div", { class: "f" }, it.front),
    st.flipped ? h("div", { class: "b" }, it.back) : h("div", { class: "hint" }, "Tap to reveal"))];
  if (st.flipped) {
    parts.push(srcLink(it.source));
    parts.push(h("div", { class: "row" },
      h("button", { class: "btn bad", onclick: () => grade(false) }, "Missed it"),
      h("button", { class: "btn ok", onclick: () => grade(true) }, "Knew it")));
  }
  return h("div", {}, parts);
}
function grade(ok) {
  const st = SES.st[SES.i];
  st.res = ok;
  rec(SES.items[SES.i].id, ok);
  move(1);
}
function move(d) {
  SES.i += d;
  if (SES.i >= SES.items.length) return finish();
  if (SES.i < 0) SES.i = 0;
  render();
  window.scrollTo(0, 0);
}
function quit(fromBack) {
  const progress = SES.st.some(x => x.res != null || x.picked != null);
  if (!progress) { go("home"); return; }
  const msg = SES.mode === "mock" ? "End the mock exam now? Unanswered questions count as wrong." : "End this session and see your results?";
  if (confirm(msg)) finish();
  else if (fromBack) history.pushState({ s: 1 }, "");
}
function finish() {
  stopTimer();
  const s = SES;
  if (s.mode === "mock") {
    s.items.forEach((it, i) => {
      const st = s.st[i];
      st.res = isRight(it, st.picked);
      if (st.picked != null) rec(it.id, st.res);
    });
  }
  const graded = s.mode === "mock" ? s.st : s.st.filter(x => x.res != null);
  s.score = { correct: graded.filter(x => x.res).length, total: graded.length };
  s.done = true;
  S.hist.unshift({ t: Date.now(), m: s.mode, c: s.score.correct, n: s.score.total });
  S.hist = S.hist.slice(0, 30);
  save();
  document.body.classList.remove("insession");
  render();
  window.scrollTo(0, 0);
}

function summaryView() {
  const s = SES, { correct, total } = s.score, p = pct(correct, total);
  const missed = s.items.map((it, i) => [it, s.st[i]]).filter(([, st]) => st.res === false);
  let verdict = "";
  if (s.mode === "mock") verdict = p >= 80 ? "Looking ready." : p >= 70 ? "Borderline. Aim for 80%+ before booking." : "Not there yet. Hit Weak spots.";
  return h("div", {},
    h("h1", {}, MODE_NAMES[s.mode] + " complete"),
    h("div", { class: "big" }, p + "%"),
    h("div", { class: "sub" }, `${correct} of ${total} correct` + (verdict ? ` · ${verdict}` : "")),
    s.mode === "mock" ? sessionDomains(s) : null,
    missed.length ? h("h2", {}, `Review what you missed (${missed.length})`) : total ? h("p", { class: "sub" }, "Clean sweep 🎉") : null,
    missed.map(([it, st]) => reviewItem(it, st)),
    h("div", { class: "row" },
      missed.length ? h("button", { class: "btn", onclick: () => begin("retry", shuffle(missed.map(m => m[0]))) }, "Retry missed") : null,
      h("button", { class: "btn primary", onclick: () => go("home") }, "Done"))
  );
}
function reviewItem(it, st) {
  if (it.type === "c") return h("div", { class: "rev" }, h("div", { class: "rq" }, it.front), h("div", {}, it.back), srcLink(it.source));
  const ans = Array.isArray(it.answer) ? it.answer : [it.answer];
  const wrongPicks = st.picked == null ? [] : (Array.isArray(st.picked) ? st.picked : [st.picked]).filter(i => !ans.includes(i));
  return h("div", { class: "rev" },
    h("div", { class: "rq" }, it.q),
    st.picked == null ? h("div", { class: "ry" }, "✗ Not answered") : wrongPicks.map(i => h("div", { class: "ry" }, "✗ " + it.options[i])),
    ans.map(i => h("div", { class: "ra" }, "✓ " + it.options[i])),
    h("div", { class: "muted" }, it.explain),
    srcLink(it.source));
}
function sessionDomains(s) {
  const rows = [];
  for (const [key, d] of Object.entries(DOMAINS)) {
    const idx = s.items.map((it, i) => i).filter(i => s.items[i].domain === key);
    if (!idx.length) continue;
    const c = idx.filter(i => s.st[i].res).length;
    rows.push(statRow(d.name, `${c}/${idx.length}`, pct(c, idx.length), true));
  }
  return h("div", {}, h("h2", {}, "By exam domain"), rows);
}
function statRow(label, right, p, hasData) {
  const cls = !hasData ? "n" : p >= 80 ? "g" : p >= 60 ? "w" : "r";
  return h("div", {},
    h("div", { class: "stat" }, h("div", {}, label), h("span", {}, right)),
    h("div", { class: "bar " + cls }, h("i", { style: `width:${hasData ? Math.max(p, 3) : 0}%` })));
}

function groupStats(items) {
  let s = 0, c = 0, seen = 0, mastered = 0;
  for (const x of items) {
    const r = S.items[x.id];
    if (!r) continue;
    seen++; s += r.s; c += r.c;
    if (r.box >= 2) mastered++;
  }
  return { s, c, seen, mastered, n: items.length };
}
function statsView() {
  const all = groupStats(ALL);
  const out = [
    h("h1", {}, "Progress"),
    h("div", { class: "kpis" },
      h("div", { class: "kpi" }, h("b", {}, `${all.seen}/${all.n}`), h("span", {}, "items seen")),
      h("div", { class: "kpi" }, h("b", {}, all.s ? pct(all.c, all.s) + "%" : "–"), h("span", {}, "accuracy")),
      h("div", { class: "kpi" }, h("b", {}, all.mastered), h("span", {}, "mastered"))),
    h("p", { class: "muted", style: "font-size:13px" }, "Mastered means you got it right twice in a row. Bars show accuracy."),
    h("h2", {}, "By exam domain")
  ];
  for (const [key, d] of Object.entries(DOMAINS)) {
    const g = groupStats(ALL.filter(x => x.domain === key));
    out.push(statRow(`${d.name} (${d.label} of exam)`, g.s ? `${pct(g.c, g.s)}% · ${g.mastered}/${g.n} mastered` : `${g.n} items`, pct(g.c, g.s), g.s > 0));
  }
  out.push(h("h2", {}, "By module"));
  for (const [name, mods] of PARTS) {
    out.push(h("div", { class: "grp" }, name));
    for (const m of mods) {
      const g = groupStats(ALL.filter(x => x.module === m));
      if (!g.n) continue;
      out.push(statRow(MODULES[m], g.s ? `${pct(g.c, g.s)}% · ${g.mastered}/${g.n} mastered` : `${g.n} items`, pct(g.c, g.s), g.s > 0));
    }
  }
  if (S.hist.length) {
    out.push(h("h2", {}, "Recent sessions"));
    for (const x of S.hist.slice(0, 10)) {
      const d = new Date(x.t);
      out.push(h("div", { class: "stat" }, h("div", {}, MODE_NAMES[x.m] || x.m), h("span", {}, `${x.c}/${x.n} (${pct(x.c, x.n)}%) · ${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`)));
    }
  }
  out.push(h("h2", {}, "Reset"));
  out.push(h("button", { class: "btn", style: "text-align:center;color:var(--bad)", onclick: () => {
    if (confirm("Erase all progress on this device?")) { S.items = {}; S.hist = []; save(); render(); }
  } }, "Reset all progress"));
  return h("div", {}, out);
}

function aboutView() {
  const nq = QUESTIONS.length, nc = ALL.length - nq;
  return h("div", {},
    h("h1", {}, "About"),
    h("p", {}, `${nq} questions and ${nc} flashcards covering all 15 Microsoft Learn modules, plus exam-guide topics the modules don't cover well.`),
    h("p", {}, `Checked against GitHub Docs and Microsoft Learn on ${BANK.built}, then independently audited. Every answer links to its source.`),
    h("p", {}, "Where Copilot changed after the exam outline (7 Aug 2026), questions test what's true either way, and the explanation says what changed. Items tagged \"Newer than exam\" cover features released later; they're left out of the mock exam."),
    h("h2", {}, "The exam"),
    h("ul", {},
      h("li", {}, "100 minutes. You need a scaled score of 700 out of 1000 to pass (it's not a percentage)."),
      h("li", {}, "Mostly scenario questions. Skills outline last updated 7 August 2026."),
      h("li", {}, "You can retake after 24 hours if you fail.")),
    h("h2", {}, "How the app picks questions"),
    h("ul", {},
      h("li", {}, "Questions and answer order are shuffled every time."),
      h("li", {}, "New items and ones you've missed come up more often. Items you keep getting right fade out."),
      h("li", {}, "Mock exam draws questions from each domain in proportion to the real exam's weighting.")),
    h("h2", {}, "Your data"),
    h("p", {}, "Progress is saved only in this browser on this device. Nothing is sent anywhere."),
    h("p", { class: "muted", style: "font-size:13px" }, "Unofficial study aid. Not affiliated with GitHub or Microsoft.")
  );
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
window.addEventListener("popstate", () => {
  if (SES && !SES.done) quit(true);
  else if (SES) go("home");
});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
render();
})();
</script>
</body>
</html>

"id":"p1m3-q37","module":"p1m3","domain":"data","q":"An administrator enables web search for Copilot Chat. When Chat uses Bing to help answer a question, how is data shared?","options":["The prompt and some context form a Bing query, under Microsoft's Privacy Statement","Only the user's GitHub username is sent to Bing; the prompt itself stays with GitHub","The whole repository is uploaded to Bing so the search results can be grounded in it","Nothing leaves GitHub; the Bing results come from a cached copy of the public web"],"answer":0,"explain":"When web search is used, the content of the prompt plus additional context is used to generate a Bing search query, which is governed by Microsoft's Privacy Statement. Admins can enable or disable Bing for the organization.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m3-q38","module":"p1m3","domain":"data","q":"When Copilot builds the prompt for an inline suggestion in the IDE, which context does it gather?","options":["Code before and after the cursor, the file name and type, and open editor tabs","The full Git history, CI logs, and every file in the repository's default branch","Only the current line, so suggestions stay fast and independent of other files","Recent terminal output, browser history, and the user's last chat conversation"],"answer":0,"explain":"Context gathering collects code before and after the cursor, the file name and type, information from adjacent open tabs, project structure and file paths, and languages and frameworks. It doesn't pull the whole repository history or unrelated personal data.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q39","module":"p1m3","domain":"data","q":"A developer writes a comment saying 'return active users' in both `users.sql` and `users.py`. Copilot proposes a SQL query in one file and a Python function in the other. What explains this?","options":["The file name and type are part of the context gathered to build the prompt","The proxy filter rewrites each suggestion into the language of the open file","The public code filter blocks suggestions that don't match the file extension","Copilot runs a separate fine-tuned model per language and picks one per file"],"answer":0,"explain":"Copilot collects the file name and type of the file being edited so it can tailor suggestions to that file type. The proxy filter blocks prompt-hacking attempts; it doesn't translate code between languages.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q40","module":"p1m3","domain":"data","q":"In Copilot Chat in the IDE, a developer asks for a parsing function, then follows up with 'now add retry logic to it'. Copilot correctly updates the earlier function. Which part of Chat's input processing makes this work?","options":["The conversation history is combined with the new prompt as context","Fill-in-the-Middle reads the code after the cursor in the chat window","The proxy filter caches the last answer and patches it with the change","LoRA fine-tuning updates the model with each message in the session"],"answer":0,"explain":"Chat pre-processes the prompt and combines it with context such as open files and chat history before sending it to the model. FIM is about code around the cursor in the editor, and LoRA is a training technique, not something that happens per message.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m3-q41","module":"p1m3","domain":"data","q":"An organization has configured a content exclusion for `/secrets/**`. In the life cycle of an inline suggestion in the IDE, where does this protection take effect?","options":["In the IDE, so excluded files aren't used as context in the prompt","At the proxy, which strips excluded paths from the model's response","In the LLM, which is fine-tuned to ignore the excluded file patterns","In post-processing, alongside the filter for matching public code"],"answer":0,"explain":"Content exclusions act at the start of the life cycle, in the IDE: excluded files don't get inline suggestions and their content doesn't inform suggestions or responses, so it never enters the prompt. The proxy and post-processing stages handle prompt hacking, toxicity, code quality and public-code matching instead.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m3-q42","module":"p1m3","domain":"data","q":"During outbound post-processing, part of a generated suggestion fails Copilot's code quality and security checks. What happens?","options":["The response is truncated or discarded before it reaches the developer","It's shown with a warning banner so the developer can still accept it","It's sent back to the LLM repeatedly until it passes every single check","It's delivered unchanged and recorded in the organization's audit log"],"answer":0,"explain":"If any part of the response fails the post-processing checks, it's either truncated or discarded; only responses that pass all filters are delivered. Copilot doesn't loop back to the model until it passes, and failures aren't written to the audit log.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q43","module":"p1m3","domain":"data","q":"An architect is diagramming Copilot's outbound flow. After the toxicity filter removes harmful generated content, which component applies the final checks for code quality, security and (optionally) matching public code?","options":["The proxy server in GitHub's Azure tenant","The Copilot extension running in the IDE","GitHub Actions code scanning on the repo","The LLM itself, through system prompt rules"],"answer":0,"explain":"In the outbound flow, the proxy server applies a final layer of checks for code quality, security and ethical standards, including the optional public-code filter. The IDE extension only displays what passes; code scanning is a separate GitHub feature.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q44","module":"p1m3","domain":"data","q":"Copilot has filters that block or flag common insecure coding patterns in its suggestions. Which TWO patterns does GitHub name as targets of these filters? (Choose two.)","options":["Hardcoded credentials","SQL injection","Unused import statements","Missing license headers","Inefficient nested loops"],"answer":[0,1],"explain":"GitHub says the insecure-code filters target the most common vulnerable patterns, including hardcoded credentials, SQL injections and path injections (Learn also cites XSS). They don't target style or performance issues, and you still need code review and security tools.","source":"https://github.com/features/copilot#faq"},{"id":"p1m3-q45","module":"p1m3","domain":"data","q":"According to the Microsoft Learn prompt-engineering module's process flow, which sequence correctly describes the life cycle of a Copilot code suggestion?","options":["Gather context → proxy filter → toxicity filter → LLM generates → post-processing checks → deliver","Gather context → LLM generates → proxy filter → toxicity filter → post-processing checks → deliver","Proxy filter → gather context → LLM generates → toxicity filter → deliver → post-processing checks","Gather context → toxicity filter → LLM generates → proxy filter → deliver → public code check"],"answer":0,"explain":"Inbound: the prompt is sent over HTTPS with context gathered, passes the proxy filter, then toxicity filtering, then the LLM generates code. Outbound: post-processing checks (toxicity, quality/security, optional public-code filter) run before only passing responses are delivered.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q46","module":"p1m3","domain":"data","q":"After the LLM produces a response, in what order do Copilot's outbound steps happen?","options":["Toxicity filter → proxy quality, security and public-code checks → delivery → feedback loop","Proxy public-code check → delivery → toxicity filter → quality and security checks → feedback loop","Delivery → developer accepts or rejects → proxy security checks → toxicity filter → feedback loop","Proxy quality and security checks → feedback loop → toxicity filter → public-code check → delivery"],"answer":0,"explain":"Outbound, the toxicity filter first removes harmful generated content, then the proxy applies quality, security and optional public-code checks. Only passing responses are delivered, and the feedback loop then starts from the developer's accepts, edits and rejections.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q47","module":"p1m3","domain":"data","q":"GitHub's application card for inline suggestions describes a four-stage pipeline. What is the correct order of the stages?","options":["Input processing → language model analysis → response generation → output formatting","Language model analysis → input processing → output formatting → response generation","Input processing → response generation → language model analysis → output formatting","Output formatting → input processing → language model analysis → response generation"],"answer":0,"explain":"Surrounding code and context are pre-processed into a prompt (input processing), the LLM analyzes it, generates a response, and the response is formatted and shown inline as a visually distinct suggestion. Copilot Chat's application card uses the same four stages.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-q48","module":"p1m3","domain":"data","q":"A developer pastes a 3,000-line legacy module into Copilot Chat and asks for a full refactor. The answer ignores much of the first half of the file. Which limitation is most likely at play, and what helps?","options":["Limited context window; split the work into smaller prompts with relevant snippets","The toxicity filter dropped the code; rephrase the request in more neutral terms","Training cutoff; tell Copilot which version of the language the code is written in","The public code filter blocked it; ask an admin to set public code matching to Allow"],"answer":0,"explain":"The model can only process a limited amount of surrounding code and text at once. Learn recommends breaking complex problems into smaller, focused queries and providing only the relevant code snippets.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m3-q49","module":"p1m3","domain":"data","q":"A team writing in a rarely used programming language finds Copilot's suggestions much weaker than for their JavaScript services. According to GitHub, what best explains this?","options":["Quality depends on the volume and diversity of training data for each language","Copilot only supports languages that have an official GitHub Linguist grammar","The proxy filter rejects suggestions for languages it can't scan for security","Organization policy limits the number of languages that a single seat can use"],"answer":0,"explain":"GitHub's application card says suggestion quality depends on the volume and diversity of training data for each language; JavaScript is well represented in public repositories, while less-represented languages are harder to assist with.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-q50","module":"p1m3","domain":"data","q":"Copilot keeps suggesting a deprecated method from a library that the team upgraded last month. What is the most likely cause, and a sensible mitigation?","options":["Training data includes older public code; add current docs or examples as context","The proxy filter caches old suggestions; clear the cache by restarting the IDE","Context gathering skipped the lockfile; delete and regenerate the lockfile","The public code filter prefers older code; set public code matching to Block"],"answer":0,"explain":"Public code used for training can contain outdated APIs or idioms, and the model's knowledge isn't updated when your dependencies change. Giving current examples or docs as context (or using web search where enabled) steers it toward the new API; there's no suggestion cache to clear.","source":"https://github.com/features/copilot#faq"},{"id":"p1m3-q51","module":"p1m3","domain":"data","q":"Two developers type an identical comment in identical files, with the same tabs open, yet Copilot offers each of them a different implementation. What explains this?","options":["Suggestions are generated probabilistically, so output can vary between requests","Copilot assigns each user a personal model fine-tuned on their own past commits","The public code filter randomly hides one of the two matching implementations","One of the requests failed the proxy filter and fell back to a cached answer"],"answer":0,"explain":"LLMs generate code in a probabilistic way, so the same prompt and context can produce different suggestions. That's expected behavior, not a filter or caching artifact.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-q52","module":"p1m3","domain":"data","q":"Copilot Chat confidently recommends calling `client.retryWithBackoff()`, but the SDK has no such method. What term describes this, and what is the right response?","options":["Hallucination; check the SDK's docs and test the code before relying on it","Prompt injection; report it so the proxy filter can block that pattern next time","Code referencing; open the matching public repository to find the method's source","Toxicity; rephrase the request so the content filter doesn't alter the answer"],"answer":0,"explain":"A hallucination is output that sounds plausible but is incorrect or fabricated, a known LLM risk and a key reason human review matters. Code referencing only reports matches with real public code.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-q53","module":"p1m3","domain":"data","q":"Copilot's pull request text completion gives less relevant suggestions on a very large pull request. What reason does GitHub's documentation give?","options":["Some PR content may not fit into the API call, so less context reaches the model","Text completion is turned off for PRs that change more than a few hundred lines","The public code filter blocks suggestions whenever a diff contains a lot of code","Large PRs are routed to a smaller model that doesn't read the commit messages"],"answer":0,"explain":"For very large pull requests, some of the content that text completion relies on may not fit into the API call, so suggestions may be missing or less accurate. It's a context limit, not a feature cut-off or filter.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m3-q54","module":"p1m3","domain":"data","q":"Which TWO are documented limitations of Copilot inline suggestions? (Choose two.)","options":["They may miss larger design or architecture issues beyond the code being written","Rarely, they may generate code that matches code in the training set","They can't generate unit tests, because tests require running the code","They always return the same output, so retrying never gives a new option","They only work when the comments in the file are written in English"],"answer":[0,1],"explain":"GitHub lists limited scope (suggestions are based on the code being written, so they may not spot larger design issues) and a low probability of matching training-set code. Generating unit tests is an intended use, output is probabilistic, and suggestions work across many languages.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m2-q40","module":"p1m2","domain":"features","q":"An independent consultant with no organization uses Copilot all day. They want access to the most advanced models and a bigger monthly usage allowance than Copilot Pro gives, and they don't need any admin controls. Which of these plans fits best?","options":["Copilot Business, bought for a one-person organization","Copilot Pro+","Copilot Enterprise on GitHub Enterprise Cloud","Copilot Free, upgraded with a usage add-on"],"answer":1,"explain":"Copilot Pro+ is the individual plan for power users: everything in Pro, access to premium models, and a higher monthly allowance (premium requests in exam-era material, AI credits now). Business and Enterprise are organization plans whose value is central management and policies, which this person doesn't need. Current docs also list Copilot Max, a newer individual tier above Pro+.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-q41","module":"p1m2","domain":"features","q":"Developers at a company each pay for personal Copilot Pro. Legal now requires IP indemnity from the vendor, a guarantee that company code isn't used to train models, and central control over who has access. What should the company do?","options":["Keep Pro and ask each developer to opt out of model training","Move everyone to Copilot Pro+ and enable the public code filter","Buy Copilot Business and assign seats centrally","Keep Pro and add the organization's custom instructions file"],"answer":2,"explain":"Copilot Business adds centralized management and policy control, and Learn lists IP indemnity among its key features. GitHub's docs say Business and Enterprise customer data is protected by the Data Protection Agreement and isn't used to train models. Individual opt-outs don't give central control or contractual protections.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-to-github-copilot/2-github-copilot-your-ai-pair-programmer"},{"id":"p1m2-q42","module":"p1m2","domain":"features","q":"An admin is comparing individual plans (Free, Pro, Pro+) with Copilot Business. Which two capabilities are available only on the organization plans? (Choose two.)","options":["Content exclusion for specified files and paths","Blocking suggestions that match public code","Organization-wide Copilot policy management","Using reusable prompt files in the IDE","Using agent mode and MCP servers in the IDE"],"answer":[0,2],"explain":"GitHub's plan comparison lists content exclusion and organization-wide policy management only for Business and Enterprise. Blocking public-code matches, prompt files, agent mode, and MCP are available on individual plans too, so they don't justify an organization plan on their own.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-q43","module":"p1m2","domain":"features","q":"A company on GitHub Enterprise Cloud already uses Copilot Business. The CTO asks what moving to Copilot Enterprise would add. Which answer is accurate?","options":["Content exclusion, which Copilot Business plans don't support at all","IP indemnity, which isn't included with Copilot Business seats","All of Business, plus a larger allowance and enterprise extras","A guarantee that prompts aren't used for model training, unlike Business"],"answer":2,"explain":"Copilot Enterprise includes everything in Copilot Business, a larger monthly allowance per seat (premium requests in exam-era material, AI credits now), and additional enterprise-grade capabilities. Content exclusion, IP indemnity, and no training on customer data already come with Business.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-q44","module":"p1m2","domain":"features","q":"A developer has a Copilot Business seat from their employer. For weekend side projects they want to activate Copilot Free on the same GitHub account so their personal work isn't governed by the employer's policies. What happens?","options":["Copilot Free activates and is used only in personal repositories","Copilot Free activates and its settings override the employer's policies","They can't: Copilot Free is only for users without org-provided Copilot","They can, but only after an organization owner approves the request"],"answer":2,"explain":"GitHub's plans page says Copilot Free is only available to individual developers who don't already have Copilot through an organization or enterprise. A user with an assigned Business seat uses Copilot under the company's policies.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-q45","module":"p1m2","domain":"features","q":"A developer who pays for Copilot Pro+ is assigned a Copilot Business seat by their employer's organization. Which two statements are correct? (Choose two.)","options":["The personal Pro+ plan is canceled automatically with a prorated refund","They keep both plans and choose one per repository in their IDE","From now on they use Copilot under the company's policies","Their Pro+ settings take priority whenever they conflict with org policy"],"answer":[0,2],"explain":"When a user with Pro, Pro+, or Max is assigned a Business or Enterprise seat, the personal plan is canceled automatically with a prorated refund, and the user then follows the company's Copilot policies. The two plans don't run side by side.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"p1m2-q46","module":"p1m2","domain":"features","q":"A developer with a Copilot Business seat wants to turn off the use of their data for AI model training, but can't find that setting in their personal Copilot settings. Why?","options":["The setting only appears once the developer has used Copilot Chat","An organization owner has hidden it and it must be re-enabled by policy","The setting is only offered in the IDE, not on GitHub.com","Business data isn't used for training, so the setting isn't shown"],"answer":3,"explain":"GitHub doesn't use Copilot Business or Enterprise customer data to train models; the Data Protection Agreement prohibits it. That's why the training setting isn't displayed for those plans. Individual plans (Free, Pro, Pro+, Max) have an opt-out in personal settings.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m6-q40","module":"p1m6","domain":"features","q":"A developer who works mostly in the terminal asks what GitHub Copilot CLI is for. Which description is accurate?","options":["A shell helper that only suggests a single command for you to copy and run","A terminal agent that answers questions, edits code, and works with GitHub.com","A CI service that runs a Copilot code review automatically on every push to a branch","A command-line viewer for your organization's Copilot usage metrics"],"answer":1,"explain":"Copilot CLI is an AI agent in your terminal. It can answer questions, write and debug code, and work with GitHub.com, for example by creating a pull request, so you don't have to leave the terminal. 'Only suggests a single command' describes the retired gh copilot extension.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-q41","module":"p1m6","domain":"features","q":"A Windows developer is setting up Copilot CLI for the first time and isn't logged in yet. Which sequence matches GitHub's documented flow?","options":["Run /login → winget install GitHub.Copilot → run copilot in the project folder → trust the folder → enter a prompt","winget install GitHub.Copilot → run copilot in the project folder → trust the folder → run /login → enter a prompt","winget install GitHub.Copilot → enter a prompt → run copilot in the project folder → run /login → trust the folder","Run copilot in the home folder → winget install GitHub.Copilot → run /login → trust all folders → enter a prompt"],"answer":1,"explain":"First you install the CLI (for example with WinGet). Then you go to the project folder and run copilot. Copilot asks you to confirm that you trust the folder, prompts you to use /login if you aren't signed in, and then you enter prompts. Launching from your home directory isn't recommended.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/overview"},{"id":"p1m6-q42","module":"p1m6","domain":"features","q":"A developer signs in with copilot login as their work account, but Copilot CLI keeps using a different account. They set GH_TOKEN in their shell profile months ago for another tool. What explains this?","options":["The CLI checks environment tokens before the stored OAuth token","copilot login only lasts for one session and must be repeated each time","The CLI always uses the GitHub CLI's token before any other credential","OAuth tokens from copilot login can't be used with work accounts"],"answer":0,"explain":"Copilot CLI checks credentials in this order: COPILOT_GITHUB_TOKEN, GH_TOKEN, GITHUB_TOKEN, the stored OAuth token, and finally the gh CLI token. An environment variable silently overrides the token from copilot login, so unset variables you don't want the CLI to use. The gh fallback has the lowest priority.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/authenticate-copilot-cli"},{"id":"p1m6-q43","module":"p1m6","domain":"features","q":"Yesterday a developer closed their terminal halfway through an interactive Copilot CLI session. Today they want to continue where they left off, with the earlier context. What should they run?","options":["copilot -p with yesterday's prompt pasted in again","copilot, then /compact to reload yesterday's last conversation","copilot --continue, or select the session with --resume","copilot, then /context to restore yesterday's history"],"answer":2,"explain":"copilot --continue resumes the most recently closed local session, and --resume or /resume lets you pick a session with its saved context. /compact compresses the current context, /context shows token usage, and -p runs a single prompt in a new session.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/overview"},{"id":"p1m6-q44","module":"p1m6","domain":"features","q":"In an interactive Copilot CLI session, a developer wants Copilot to fix a bug specifically in src/app.js. They also want to run git status themselves without sending anything to the model. What should they type?","options":["Fix the bug in #src/app.js, then /git status","Fix the bug in @src/app.js, then !git status","/fix src/app.js, then /shell git status","Fix the bug in src/app.js --file, then $git status"],"answer":1,"explain":"Adding @ before a relative path puts that file's contents into the prompt as context. Starting input with ! runs it directly as a shell command without calling the model.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/use-copilot-cli/overview"},{"id":"p1m6-q45","module":"p1m6","domain":"features","q":"(Older material.) A study guide shows gh copilot suggest \"Install and configure git lfs\". What did this command do, and what is used now?","options":["It installed Git LFS on its own; it was replaced by gh copilot run","It opened a pull request that adds Git LFS; it's now done by the cloud agent","It suggested a shell command for the task; it's been replaced by Copilot CLI (copilot)","It explained what a Git LFS command does; it was replaced by Copilot Chat on GitHub.com"],"answer":2,"explain":"The gh-copilot extension for GitHub CLI suggested a command (gh copilot suggest) or explained one (gh copilot explain). It didn't edit files or work agentically. It was deprecated and stopped working on 25 October 2025, and was replaced by the agentic GitHub Copilot CLI, which you run with copilot.","source":"https://github.com/github/gh-copilot"},{"id":"p1m8-q40","module":"p1m8","domain":"productivity","q":"A Java method validates an order, calculates the total, updates the status, and prints a summary, all in one place. A developer wants Copilot's help to make it easier to maintain without changing its behavior. What is the best approach?","options":["Ask Copilot to translate the class to Kotlin, which tends to be shorter","Ask Copilot to split it into smaller methods, then run existing tests","Accept the first inline suggestion that appears in the method body","Ask Copilot to optimize it for speed and then merge without review"],"answer":1,"explain":"GitHub's cookbook shows Copilot Chat splitting a large method into focused methods such as validateOrder and calculateTotalPrice. Because Copilot's responses are non-deterministic, run your tests afterwards to confirm the refactor didn't change behavior.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/refactor-code/improve-code-readability"},{"id":"p1m8-q41","module":"p1m8","domain":"productivity","q":"A Python script that finds prime numbers is slow. A developer asks Copilot Chat \"Optimize this code for performance\" and gets back a sieve-based rewrite. What should they do before adopting it?","options":["Adopt it right away, since Copilot's optimizations are deterministic","Ask Copilot to confirm it's faster, and treat that answer as the benchmark","Check the output matches the original and measure the runtime gain","Discard it, because Copilot can't suggest algorithmic changes"],"answer":2,"explain":"Copilot Chat can spot performance hotspots and suggest better algorithms, data structures, caching, or parallelism. But its responses are non-deterministic and must be validated, so confirm the output is unchanged and measure the speed-up yourself.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/refactor-code/refactor-for-optimization"},{"id":"p1m8-q42","module":"p1m8","domain":"productivity","q":"Copilot Chat finds an XSS risk in a function that assigns user input to innerHTML and suggests textContent instead. A lead proposes switching off code scanning, since \"Copilot finds vulnerabilities now\". What is the right response?","options":["Agree, because Copilot Chat now gives a comprehensive security analysis","Agree, but only for repositories that have content exclusion configured","Keep code scanning, but stop reviewing Copilot's security-related fixes","Keep code scanning; Copilot finds some common issues but isn't complete"],"answer":3,"explain":"GitHub's docs say Copilot Chat can help find and fix common vulnerabilities such as XSS and SQL injection, but you shouldn't rely on it for a comprehensive security analysis. Code scanning checks more thoroughly. Copilot's fixes still need review.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/analyze-security/find-vulnerabilities"},{"id":"p1m8-q43","module":"p1m8","domain":"productivity","q":"A team wants to use Copilot to improve the security of a web application. Which two uses match GitHub's guidance? (Choose two.)","options":["Ask Chat to analyze selected code for issues such as SQL injection and suggest fixes","Ask Chat to help set up Dependabot so that dependency updates are streamlined","Replace CodeQL with Copilot Chat reviews, since Chat analysis is comprehensive","Merge Copilot's security fixes without tests, since they follow best practices"],"answer":[0,1],"explain":"The Copilot cookbook includes recipes for finding existing vulnerabilities (for example XSS or SQL injection) and for setting up Dependabot. GitHub says Copilot isn't a substitute for comprehensive tools like code scanning, and all generated code still needs review and testing.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook"},{"id":"p1m8-q44","module":"p1m8","domain":"productivity","q":"A team inherits a module with no comments and no README. Which use of Copilot for documentation matches the Learn module?","options":["Generate function descriptions and a README draft, then check them","Have Copilot publish documentation to the wiki on every commit","Skip documentation, since Copilot Chat can explain the code later","Document only public APIs, since Copilot can't explain private code"],"answer":0,"explain":"The Learn module says Copilot can generate inline comments, function descriptions with parameters and return values, and README structure, and can help keep the documentation style consistent. Generated explanations can be inaccurate, so review them.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/2-boost-developer-productivity"},{"id":"p1m8-q45","module":"p1m8","domain":"productivity","q":"QA needs a few hundred realistic customer records, including edge-case values, to test a new signup flow. Production data must not be used. How can Copilot help most appropriately?","options":["Paste a production export into Chat and ask Copilot to anonymize it","Describe the schema and rules, then ask Copilot for synthetic data","Ask Copilot to read customer data directly from the production database","Use only random strings, since Copilot can't produce realistic records"],"answer":1,"explain":"The Learn module lists sample data creation as a use case: Copilot can generate realistic test data sets, which saves manual work. Describing the schema and constraints keeps real customer data out of prompts. Then check the generated records before you use them.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/2-boost-developer-productivity"},{"id":"p1m8-q46","module":"p1m8","domain":"productivity","q":"A team must move a small COBOL account-management program to Node.js with Copilot Chat. Which order of steps matches GitHub's modernization walkthrough?","options":["Convert all files at once → delete the COBOL source → ask Copilot to explain the new code → write tests only if bugs appear in production","Generate Node.js tests first → convert the files → ask Copilot to explain the COBOL → create a test plan last","Ask Copilot to explain the COBOL files → create a test plan of the business logic → convert file by file → generate unit and integration tests","Create a test plan → convert all files at once → ask Copilot to explain the COBOL → skip integration tests, since unit tests are enough"],"answer":2,"explain":"In GitHub's walkthrough, Copilot first explains the COBOL files and how they link together. Next it produces a test plan for the current business logic. Then the files are converted one at a time and each result is reviewed. Finally, unit and integration tests are generated from the test plan.","source":"https://github.blog/ai-and-ml/github-copilot/modernizing-legacy-code-with-github-copilot-tips-and-examples/"},{"id":"p1m8-q47","module":"p1m8","domain":"productivity","q":"A developer wants Copilot Chat to rewrite a legacy Perl script in TypeScript. Which prompt is most likely to give a usable result?","options":["\"Make this script better and more modern.\"","\"Rewrite this script in whichever newer language you think fits best, and modernize it too.\"","\"Convert this to TypeScript, keep behavior and output identical, and say how to run it with Node.\"","\"TypeScript version please.\""],"answer":2,"explain":"GitHub's translation recipe names the target language, requires the functionality and output to stay exactly the same, and asks how to run the result. The other prompts are vague, and a specific prompt gives a result you can check against the original.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/refactor-code/translate-code"},{"id":"p1m8-q48","module":"p1m8","domain":"productivity","q":"A team plans to use Copilot to upgrade a large legacy application to a modern framework in one big change, with no tests in place. What does GitHub's legacy-modernization guidance recommend instead?","options":["Start with small modules, write tests for current behavior, and use branches and PRs","Let Copilot convert everything in one pass, since it understands the entire codebase","Turn off code review during the upgrade so Copilot's suggestions merge faster","Write tests only after the upgrade, because the old behavior no longer matters"],"answer":0,"explain":"GitHub's guidance is to start small, write tests that capture current behavior before changing code, work in branches and pull requests, and always review Copilot's suggestions. A big-bang change without a safety net makes regressions hard to find.","source":"https://github.blog/ai-and-ml/github-copilot/modernizing-legacy-code-with-github-copilot-tips-and-examples/"},{"id":"p1m8-q49","module":"p1m8","domain":"productivity","q":"A SvelteKit load function calls a service that queries a database. The developer wants a unit test that checks the service is called correctly without touching the database. Which prompt fits best?","options":["/tests Create an integration test that calls the load function against the real staging database","/explain Show how the service connects to the database","/tests Create a unit test to ensure the service is called correctly. Mock the service object.","/fix Remove the database call from the load function so it becomes easier to test"],"answer":2,"explain":"Mock objects keep unit tests isolated from external services. GitHub's recipe asks /tests for a unit test and tells it to mock the service object. An integration test against a real database is the opposite of what's wanted, and /fix or /explain don't produce a test.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/testing-code/create-mock-objects"},{"id":"p1m8-q50","module":"p1m8","domain":"productivity","q":"A developer asks Copilot Chat for end-to-end tests of a React product page. The output uses a different framework from the team's existing Playwright suite. How should they adjust the prompt?","options":["Name Playwright in the prompt and add an existing test with #file","Ask for unit tests instead, since Copilot can't write end-to-end tests","Repeat the same prompt until the framework happens to change","Remove the component code from context so the result is more general"],"answer":0,"explain":"GitHub's end-to-end test recipe names the framework in the prompt (\"Using Playwright, generate an e2e test...\"). GitHub's prompt-engineering guidance also says to give examples and attach relevant files as context, so an existing test passed with #file helps the output follow the team's patterns.","source":"https://docs.github.com/en/copilot/tutorials/copilot-cookbook/testing-code/create-end-to-end-tests"},{"id":"p1m8-q51","module":"p1m8","domain":"productivity","q":"During a COBOL-to-Node.js migration, Copilot generated a test plan that describes the current business logic. The team will use it to generate the new unit and integration tests. What should happen first?","options":["Nothing: a plan generated from the code is accurate by definition","Ask Copilot to rate its own plan, then keep only the cases it rates highest","Delete the edge cases from the plan to keep the test suite small","Have business stakeholders confirm the plan reflects intended behavior"],"answer":3,"explain":"In GitHub's walkthrough the test plan is something to validate with business stakeholders before it drives the new tests. Copilot can misread intent, and legacy code may contain behavior the business no longer wants.","source":"https://github.blog/ai-and-ml/github-copilot/modernizing-legacy-code-with-github-copilot-tips-and-examples/"},{"id":"p1m8-q52","module":"p1m8","domain":"productivity","q":"A developer who has never used COBOL must understand how three COBOL files work together before changing anything. They want to stay in the IDE rather than search the web. What is the most effective use of Copilot Chat?","options":["Ask Copilot to rewrite the files in Java first, then read the Java version","Use /explain with each file attached via #file, then ask for a data-flow diagram","Ask a general question about COBOL syntax, without attaching any files","Turn on inline suggestions and wait for them to add explanatory comments to the code"],"answer":1,"explain":"GitHub's walkthrough combines /explain with #file references to get an overview of each file and how they link, then asks for a Mermaid sequence diagram of the data flow. This speeds up learning unfamiliar code and avoids switching to web searches.","source":"https://github.blog/ai-and-ml/github-copilot/modernizing-legacy-code-with-github-copilot-tips-and-examples/"},{"id":"extra-q40","module":"extra","domain":"features","q":"In VS Code, Copilot Chat gives an answer that is wrong for the developer's question. They want to tell GitHub the response wasn't helpful. What is the documented way?","options":["Email copilot-safety@github.com with the full text of the response","Click the thumbs-down icon shown next to that response","Run /feedback in the chat input box, then type a short message","Delete the response so Copilot learns the answer was incorrect"],"answer":1,"explain":"In VS Code, you show whether a response was helpful with the thumbs-up and thumbs-down icons next to it. copilot-safety@github.com is for reporting offensive content, and /feedback is a Copilot CLI command.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/chat-with-copilot/chat-in-ide"},{"id":"extra-q41","module":"extra","domain":"features","q":"Reviewers keep pasting the same REST API security checklist into Copilot Chat. They want to save it in the repository as a reusable task, which they run only when they choose to review an API. What should they create?","options":["A Copilot Memory entry that stores the checklist for the repository","Organization custom instructions that contain the checklist text","A .prompt.md prompt file in .github/prompts, run from chat on demand","A path-specific .instructions.md file targeting all API source files"],"answer":2,"explain":"Prompt files are reusable Markdown templates (.prompt.md, usually in .github/prompts) that you invoke for a specific interaction, and they can take input variables. Custom instructions and memories are applied automatically, so they don't fit an on-demand task.","source":"https://docs.github.com/en/copilot/concepts/prompting-and-context/prompt-files"},{"id":"extra-q42","module":"extra","domain":"features","q":"A developer uses Visual Studio 2022 version 17.12 and has a Copilot license. What do they need to do to start using Copilot?","options":["Download the Copilot extension from the Marketplace and restart","Install Copilot CLI, which Visual Studio then uses for completions","Add their GitHub account that has Copilot access to Visual Studio","Run :Copilot setup from the Visual Studio command window"],"answer":2,"explain":"From Visual Studio 2022 17.10, Copilot and Copilot Chat are built in, so you don't install them separately. You enable Copilot by adding a GitHub account with Copilot access to Visual Studio. :Copilot setup is the Vim/Neovim command.","source":"https://docs.github.com/en/copilot/how-tos/set-up/install-copilot-extension"},{"id":"extra-q43","module":"extra","domain":"features","q":"In an IDE whose Copilot Chat offers Ask, Edit, Plan, and Agent modes, a developer wants Copilot to change three specific files. They want to choose those files themselves, review and accept or discard the changes per file, keep full control over how many requests are used, and not have Copilot run terminal commands. Which chat mode fits best?","options":["Ask mode, then copy each code block into the files by hand","Agent mode, with automatic approval of all tool calls enabled","Plan mode, which writes the requested change directly into each file","Edit mode (Copilot Edits), with the three files in the working set"],"answer":3,"explain":"In edit mode (Copilot Edits), you choose the files in a working set, prompt, and then Accept or Discard the proposed changes per file; GitHub says it suits a defined set of files and full control over the number of LLM requests. Agent mode picks files and runs tools on its own. Exam-era VS Code offered Edit mode; since VS Code 1.110 (February 2026 release) it's hidden by default but can be re-enabled, and JetBrains still offers it.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/chat-with-copilot/chat-in-ide"},{"id":"extra-q44","module":"extra","domain":"features","q":"A team lead is writing guidance on Copilot Chat's limitations. Which two statements are documented limitations of Copilot Chat? (Choose two.)","options":["It is optimized mainly for English, so prompts in other languages may perform differently","It can never produce code that matches public code, so licensing checks aren't needed","Less common programming languages may get lower-quality results than JavaScript does","It answers general non-coding questions as reliably as it answers coding questions"],"answer":[0,2],"explain":"GitHub's application card for Copilot Chat lists these limitations: Chat is optimized primarily for English, and quality depends on training data, so less common languages may yield lower-quality results. It can occasionally match public code, and it isn't designed for non-coding questions.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"extra-q45","module":"extra","domain":"features","q":"In VS Code, a developer wants to check which files Copilot Chat used to produce an answer, including whether the repository's custom instructions file was applied. Where should they look?","options":["The Copilot status bar menu at the bottom of the window","The Used n references list at the top of the response","The Output panel's GitHub Copilot log for that request","The repository's Copilot settings page on GitHub.com"],"answer":1,"explain":"Each Copilot Chat response in VS Code has a Used n references dropdown at the top. It lists the files used as context, which can include the repository's custom instructions file.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/chat-with-copilot/chat-in-ide"}],"cards":[{"id":"p1m1-c01","module":"p1m1","domain":"responsible","front":"Microsoft/GitHub's six responsible AI principles","back":"Fairness; reliability and safety; privacy and security; inclusiveness; transparency; accountability.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-c02","module":"p1m1","domain":"responsible","front":"Fairness (responsible AI)","back":"AI should treat everyone fairly, giving consistent outcomes to similarly situated people. Ways to mitigate bias include reviewing training data, testing with balanced demographic samples, adversarial debiasing, and monitoring results across user segments.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c03","module":"p1m1","domain":"responsible","front":"Reliability and safety (responsible AI)","back":"AI should work as designed, respond safely to unexpected conditions, and resist harmful manipulation. Safety means minimizing physical, emotional, and financial harm; reliability means consistent behavior without unwanted variability.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c04","module":"p1m1","domain":"responsible","front":"Privacy and security practices from the module","back":"Get consent before collecting data, collect only what's needed, anonymize (pseudonymization or aggregation), and encrypt data in transit and at rest with protected keys (HSMs, secure vaults, envelope encryption).","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c05","module":"p1m1","domain":"responsible","front":"Inclusiveness (responsible AI)","back":"AI should empower and be accessible to everyone, regardless of disability, language, or infrastructure. Examples: screen readers, captions, voice control, regional dialect support, and offline or low-connectivity operation.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c06","module":"p1m1","domain":"responsible","front":"Transparency vs. accountability","back":"Transparency: AI should be understandable, with clear explanations, justified design choices, honesty about limitations, and logging and auditing. Accountability: people, not the AI, are responsible for how the system operates and its impact.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c07","module":"p1m1","domain":"responsible","front":"Overreliance vs. hallucination","back":"Hallucination: the model produces plausible but false or made-up output. Overreliance: a user accepts incorrect or incomplete AI output, often because mistakes are hard to spot. Human review guards against both.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-c08","module":"p1m1","domain":"responsible","front":"Why Copilot quality varies by programming language","back":"Suggestion quality depends on how much varied training data exists for each language. Well-represented languages like JavaScript do best; less common languages may get lower-quality results.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m2-c01","module":"p1m2","domain":"features","front":"Who can use Copilot Free?","back":"Individual developers who don't have Copilot access through an organization or enterprise. It offers limited monthly use of a selection of Copilot features, such as inline suggestions and chat, at no cost.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c02","module":"p1m2","domain":"features","front":"Free Copilot access for students, teachers, and OSS maintainers","back":"Verified students can get Copilot Student at no cost (older material says students get free Copilot Pro). Verified teachers and maintainers of popular open source projects may be eligible for free Copilot Pro.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c03","module":"p1m2","domain":"features","front":"Copilot Business vs. Copilot Enterprise","back":"Business: for organizations and enterprises, with centralized management, policy control, and content exclusion. Enterprise: for enterprises on GitHub Enterprise Cloud, with all Business features plus a larger monthly usage allowance (AI credits; older material: premium requests) and extra enterprise capabilities.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c04","module":"p1m2","domain":"features","front":"Inline suggestion keys (VS Code, Windows)","back":"Tab = accept, Esc = reject, Alt+] / Alt+[ = next/previous alternative (Option on macOS), Ctrl+Enter = open a tab with multiple suggestions.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m2-c05","module":"p1m2","domain":"features","front":"Common Copilot Chat slash commands (VS Code)","back":"/explain (explain code), /fix (propose a fix), /tests (generate unit tests), /fixTestFailure, /new (new project), /clear (new chat session), /help. Type / to see what's available.","source":"https://docs.github.com/en/copilot/reference/chat-cheat-sheet"},{"id":"p1m2-c06","module":"p1m2","domain":"privacy","front":"Where to find Copilot logs in VS Code","back":"View > Output, then choose GitHub Copilot in the dropdown. Or run 'Developer: Open Extension Logs Folder' to collect files for support. For more detail, set the log level to Trace with 'Developer: Set Log Level'.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/view-logs"},{"id":"p1m2-c07","module":"p1m2","domain":"privacy","front":"Copilot proxy support limits","back":"Copilot uses its own proxy code. Proxy URLs starting with https:// aren't supported. Proxy authentication works with basic auth or Kerberos. Corporate proxies may also need company-level allowlisting.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/troubleshoot-network-errors"},{"id":"p1m2-c08","module":"p1m2","domain":"privacy","front":"Code references for public-code matches (VS Code)","back":"If suggestions matching public code are allowed, accepting one adds an entry to the 'GitHub Copilot Log (Code References)' output, with the matching file URL and license (if found).","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/find-matching-code"},{"id":"p1m3-c01","module":"p1m3","domain":"prompt","front":"The 4 S's of prompt engineering","back":"Single (one well-defined task), Specific (explicit, detailed instructions), Short (concise), Surround (descriptive file names and related files open for context).","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c02","module":"p1m3","domain":"prompt","front":"Zero-shot vs. one-shot vs. few-shot","back":"Zero-shot: no examples, relies on the model's training (good for common patterns). One-shot: one example to copy conventions. Few-shot: several examples to handle multiple scenarios and edge cases.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c03","module":"p1m3","domain":"prompt","front":"Role prompting","back":"Tell Copilot to act as a specific expert (security, performance, testing) to bring domain expertise into the first draft, e.g. 'Act as a cybersecurity expert...'.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c04","module":"p1m3","domain":"prompt","front":"Managing chat history","back":"Long histories add irrelevant context and cost more to process. Start a new conversation for a new task, summarize the relevant context, and refer to earlier work briefly instead of repeating it.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c05","module":"p1m3","domain":"prompt","front":"Where to put key requirements in a prompt","back":"Start with the broad goal, then list specifics with the most important first. Copilot gives extra weight to the beginning and end of a prompt.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-c06","module":"p1m3","domain":"data","front":"Inbound prompt flow (order)","back":"1) Prompt sent securely over HTTPS and context gathered (cursor code, file name and type, open tabs, project structure, languages, FIM). 2) Proxy filter. 3) Toxicity filter. 4) LLM generates code.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c07","module":"p1m3","domain":"data","front":"Proxy filter (Copilot prompt flow)","back":"A proxy server in a GitHub-owned Microsoft Azure tenant that filters traffic and blocks attempts to hack the prompt or extract details about how the model generates suggestions.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c08","module":"p1m3","domain":"data","front":"Toxicity filter and outbound post-processing","back":"The toxicity filter blocks hate speech, inappropriate content, and personal data. On the outbound side, it removes harmful generated content, then checks look for code quality and security problems (e.g. XSS, SQL injection) and apply the optional public-code filter. Failing output is truncated or discarded.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c09","module":"p1m3","domain":"data","front":"Fill-in-the-Middle (FIM)","back":"A pre-processing technique where Copilot considers code both before and after the cursor, so suggestions fit their surroundings.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c10","module":"p1m3","domain":"data","front":"Fine-tuning vs. LoRA","back":"Fine-tuning adapts a pretrained model with a smaller task-specific dataset. LoRA (Low-Rank Adaptation) adds small trainable parts to each layer and leaves the original model unchanged, which saves time and resources.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/5-github-copilot-large-language-models"},{"id":"p1m3-c11","module":"p1m3","domain":"data","front":"Context window limits: what to do","back":"The model can only process a limited amount of code and text at once. Break complex problems into smaller, focused prompts and include only the relevant code snippets.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m4-c01","module":"p1m4","domain":"features","front":"Copilot Space","back":"A Copilot chat grounded in curated context you choose (repos, files, PRs, issues, notes, uploads, instructions). Gives more consistent answers on a tightly scoped topic than general chat.","source":"https://docs.github.com/en/copilot/concepts/context/spaces"},{"id":"p1m4-c02","module":"p1m4","domain":"features","front":"Two kinds of context in a Space","back":"Instructions (free text: focus, tasks, what to avoid) and Sources (files/folders/repos, linked PRs and issues, uploaded files, pasted text). The description doesn't affect responses.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-c03","module":"p1m4","domain":"data","front":"Space: attach a repository vs an individual file","back":"Repository: Copilot searches it and retrieves only the most relevant content (good for large docs sets). File: full contents loaded into context for every query (good for a must-use guide).","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-c04","module":"p1m4","domain":"features","front":"Organization-owned Space roles","back":"Viewer: ask questions and view content. Editor: also change sources, name, description, instructions. Admin: also change sharing and delete. 'No access' hides the Space from org members.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/collaborate-with-others"},{"id":"p1m4-c05","module":"p1m4","domain":"privacy","front":"Spaces and permissions","back":"A Space never grants new access. Viewers only see sources they already have permission for. Public personal Spaces are view-only by default.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/collaborate-with-others"},{"id":"p1m4-c06","module":"p1m4","domain":"features","front":"Using a Space from your IDE","back":"Through the remote GitHub MCP server with the copilot_spaces toolset enabled, in agent mode only. Repository context and uploaded files aren't supported there.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/use-copilot-spaces"},{"id":"p1m4-c07","module":"p1m4","domain":"features","front":"Space freshness","back":"GitHub-based sources update automatically and reflect the latest code on the main branch. For a branch-specific or historical view, narrow the files or add a text snapshot of the exact content.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/3-share-discover-govern"},{"id":"p1m4-c08","module":"p1m4","domain":"prompt","front":"Space governance best practices","back":"One job per Space, a clear purpose-driven name, a named owner, a 'How to use this Space' note, 1–3 canonical examples, and a regular review cadence. Split the Space when it sprawls.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/3-share-discover-govern"},{"id":"p1m4-c09","module":"p1m4","domain":"features","front":"Who can use Copilot Spaces, and where","back":"Anyone with a Copilot license, including Free. Use them in Copilot Chat on GitHub, or in the IDE through the GitHub MCP server. Questions count as Copilot Chat requests.","source":"https://docs.github.com/en/copilot/concepts/context/spaces"},{"id":"p1m5-c01","module":"p1m5","domain":"features","front":"Ghost text","back":"Copilot's greyed-out inline suggestion. Press Tab to accept, Esc to dismiss, or keep typing to ignore it.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/2-advanced-github-copilot-features"},{"id":"p1m5-c02","module":"p1m5","domain":"features","front":"Inline chat (VS Code)","back":"Ctrl+I (Cmd+I on macOS). Chat inside the editor, scoped to the active file or selection, with a diff you can Keep or Undo. Also works in the terminal for shell commands.","source":"https://code.visualstudio.com/docs/chat/inline-chat"},{"id":"p1m5-c03","module":"p1m5","domain":"prompt","front":"Slash commands","back":"Shortcuts that tell Copilot your intent for common tasks, so you need shorter prompts. Type / to see the commands available in your environment.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c04","module":"p1m5","domain":"productivity","front":"/explain, /fix, /tests","back":"/explain: explain how the selected or active code works. /fix: propose a fix for problems in the selection. /tests: generate unit tests for the selected code.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c05","module":"p1m5","domain":"productivity","front":"/doc and /optimize (Visual Studio)","back":"/doc adds a documentation comment for the symbol. /optimize analyzes and improves the running time of the selected code.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c06","module":"p1m5","domain":"features","front":"Chat participants (@)","back":"Domain experts invoked with @, such as @terminal (terminal shell), @vscode (VS Code features), @github (GitHub skills). Current VS Code docs mark them deprecated in the Copilot harness.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c07","module":"p1m5","domain":"prompt","front":"Chat variables / #-mentions","back":"Type # to add explicit context: #file, #selection, #codebase, terminal output, or tools such as #fetch.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m5-c08","module":"p1m5","domain":"prompt","front":"#codebase","back":"Requests a search of the workspace for relevant code. It does NOT load the whole codebase into the model context.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m5-c09","module":"p1m5","domain":"features","front":"/plan in VS Code chat","back":"Researches the task and proposes a plan before implementation. Other current VS Code slash commands include /compact (summarize context) and /fork (copy the conversation).","source":"https://code.visualstudio.com/docs/agents/reference/ai-features-cheat-sheet"},{"id":"p1m5-c10","module":"p1m5","domain":"prompt","front":"Implicit prompts","back":"Features like slash commands provide a precrafted prompt (for example, select code and use /fix in inline chat), so you get good results without writing a long prompt.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/4-applied-copilot-techniques"},{"id":"p1m6-c01","module":"p1m6","domain":"features","front":"Alternative inline suggestions (VS Code)","back":"Alt+] next, Alt+[ previous (Option/Alt on macOS). Ctrl+Enter opens multiple suggestions in a new tab. Ctrl+Right Arrow accepts the next word.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m6-c02","module":"p1m6","domain":"features","front":"Installing Copilot CLI","back":"npm install -g @github/copilot (Node.js 22+), winget install GitHub.Copilot, brew install --cask copilot-cli, or the install script. Run with `copilot`; use /login on first launch.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/install-copilot-cli"},{"id":"p1m6-c03","module":"p1m6","domain":"features","front":"Copilot CLI: interactive vs programmatic","back":"`copilot` starts an interactive session. `copilot -p \"PROMPT\"` runs one prompt and exits; add approval flags such as --allow-tool so it can modify or execute files unattended. (`copilot -i \"PROMPT\"` starts an interactive session with that prompt; it does not exit.)","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-c04","module":"p1m6","domain":"features","front":"Copilot CLI plan mode","back":"Press Shift+Tab (or start with --plan, or use /plan). Copilot asks clarifying questions and builds a structured plan before writing any code.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-c05","module":"p1m6","domain":"privacy","front":"Copilot CLI tool approval flags","back":"--allow-all-tools, --allow-tool='shell(CMD)' / 'write' / 'MCP_SERVER(tool)', and --deny-tool, which always takes precedence. --allow-all (alias --yolo) also allows all paths and URLs.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli"},{"id":"p1m6-c06","module":"p1m6","domain":"privacy","front":"Copilot CLI trusted directories","back":"On launch you confirm trust for the current folder and everything below it, for this session or permanently. Launch only from trusted project folders, typically not your home directory.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli"},{"id":"p1m6-c07","module":"p1m6","domain":"privacy","front":"Copilot CLI local vs cloud sandbox","back":"/sandbox enable restricts filesystem, network, and system access on your machine. copilot --cloud runs the whole session in an isolated GitHub-hosted environment you can steer from other clients.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli","recent":true},{"id":"p1m6-c08","module":"p1m6","domain":"features","front":"GitHub Copilot app","back":"A desktop app (macOS, Windows, Linux) built on Copilot CLI. It runs parallel agent sessions in their own worktrees and branches and handles the PR lifecycle. It has its own policy, separate from the CLI policy.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/github-copilot-app"},{"id":"p1m6-c09","module":"p1m6","domain":"features","front":"Copilot app session modes","back":"Interactive: collaborates and waits for your input. Plan: plans first, then you approve. Autopilot: works fully autonomously. Tool permissions are separate: Ask every time, Assisted, or Approve all.","source":"https://docs.github.com/en/copilot/how-tos/github-copilot-app/agent-sessions"},{"id":"p1m6-c10","module":"p1m6","domain":"productivity","front":"Explain error (GitHub Actions)","back":"On a failed check in the PR merge box or the workflow run page, click Explain error. Copilot Chat opens with the failure as context and suggests a fix.","source":"https://docs.github.com/en/actions/how-tos/troubleshoot-workflows"},{"id":"p1m6-c11","module":"p1m6","domain":"features","front":"Copilot CLI context management","back":"Copilot CLI auto-compacts history as you near the token limit. /compact compresses manually, and /context shows a token usage breakdown.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m7-c01","module":"p1m7","domain":"privacy","front":"Content exclusion: effects","back":"No inline suggestions in excluded files. Their content doesn't inform suggestions in other files or Copilot responses, and Copilot code review doesn't review them.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-c02","module":"p1m7","domain":"privacy","front":"Who can configure content exclusion?","back":"Repository administrators (their repos), organization owners (users with seats from that org), and enterprise owners (all Copilot users in the enterprise).","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-c03","module":"p1m7","domain":"privacy","front":"Content exclusion limitations","back":"It isn't a filesystem security boundary and isn't guaranteed for third-party MCP servers or clients. It doesn't apply to symlinks or remote filesystems, and the IDE may still pass semantic info such as types.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-c04","module":"p1m7","domain":"privacy","front":"Content exclusion change not taking effect in the IDE","back":"It can take up to 30 minutes. To apply it now: in VS Code run Developer: Reload Window; in JetBrains or Visual Studio, close and reopen the app. Vim/Neovim fetches exclusions each time a file opens.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-c05","module":"p1m7","domain":"privacy","front":"Content exclusion path syntax","back":"fnmatch patterns that are case insensitive. Repo settings use - \"/path\". Org/enterprise settings use REPO-REFERENCE: plus paths, or \"*\": for files anywhere, including outside Git.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-c06","module":"p1m7","domain":"privacy","front":"Auditing content exclusion changes","back":"Look for the copilot.content_exclusion_changed audit log action. The entry details show excluded_paths after the change.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/review-changes"},{"id":"p1m7-c07","module":"p1m7","domain":"privacy","front":"Public code filter (Block)","back":"Checks suggestions plus about 150 characters of surrounding code against public code on GitHub and hides matches or near matches. Org-assigned users inherit the setting.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m7-c08","module":"p1m7","domain":"privacy","front":"Code referencing","back":"When matches are allowed, Copilot shows matching public repos and licenses (in VS Code: Output > GitHub Copilot Log (Code References)). The index excludes private repos and code outside GitHub.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/copilot-in-ides"},{"id":"p1m7-c09","module":"p1m7","domain":"privacy","front":"Block mode and agents","back":"Copilot cloud agent and Copilot CLI may still generate code matching public code even when the policy is Block. The cloud agent shows matches in session logs.","source":"https://docs.github.com/en/copilot/responsible-use/agents"},{"id":"p1m7-c10","module":"p1m7","domain":"features","front":"Business/Enterprise-only management features","back":"Content exclusion, organization-wide policy management, and organization custom instructions. All plans can block suggestions matching public code.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m7-c11","module":"p1m7","domain":"features","front":"Policy conflicts across licenses","back":"Same enterprise, several orgs: the least restrictive usually applies. Several enterprises: the most restrictive almost always applies. Orgs can't override an enterprise-selected policy.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"p1m7-c12","module":"p1m7","domain":"privacy","front":"Business/Enterprise data and model training","back":"GitHub doesn't use Copilot Business or Enterprise customer data to train AI models. It's protected under GitHub's Data Protection Agreement.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m7-c13","module":"p1m7","domain":"privacy","front":"\"Could not connect to server. Extension activation failed\"","back":"No Copilot plan, or the token request to the GitHub API failed. Sign out of Copilot in the IDE and sign back in.","source":"https://docs.github.com/en/copilot/troubleshooting-github-copilot/troubleshooting-common-issues-with-github-copilot"},{"id":"p1m8-c01","module":"p1m8","domain":"productivity","front":"Three Copilot usage metrics dashboards","back":"Usage metrics (adoption and engagement), code generation (code from users and agents), and impact (adoption depth vs. PR output and time to merge).","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c02","module":"p1m8","domain":"productivity","front":"Metric categories in Copilot usage metrics","back":"Adoption, engagement, acceptance rate, lines of code, and pull request lifecycle. Look at patterns together with developer feedback, not one number.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c03","module":"p1m8","domain":"productivity","front":"Usage metrics caveats","back":"Not a complete record of all activity. Don't add org totals together (users overlap). They measure activity, not licenses; use the user management API for seats.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c04","module":"p1m8","domain":"productivity","front":"Custom reporting on Copilot usage","back":"Use the Copilot usage metrics REST APIs and NDJSON exports for enterprise and org reports with repository- and user-level detail.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c05","module":"p1m8","domain":"productivity","front":"Key Copilot limitations","back":"Possible bugs and insecure code, misread context, weaker results for niche or new technologies, bias from training data, and limited grasp of high-level architecture.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-c06","module":"p1m8","domain":"productivity","front":"Copilot across the SDLC","back":"Requirements: prototypes and API sketches. Development: boilerplate and patterns. Testing: tests, data, and edge cases. Deployment: config and scripts. Maintenance: bug fixes, refactoring, and explaining legacy code.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/4-ai-software-development-lifecycle"},{"id":"p1m8-c07","module":"p1m8","domain":"productivity","front":"Copilot developer survey: short vs long form","back":"Short-form: quick satisfaction and time-saved feedback, up to every two weeks. Long-form: deeper impact, no more than once every four weeks. Anonymize responses.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-c08","module":"p1m8","domain":"productivity","front":"Impact dashboard comparisons","back":"They show associations, not proof that adoption caused productivity changes. Team composition, complexity, and experience also affect results.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m9-c01","module":"p1m9","domain":"productivity","front":"/tests vs /fixTestFailure vs /setupTests","back":"/tests: generate unit tests for selected code. /fixTestFailure: find and fix a failing test. /setupTests: recommend and configure a test framework.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/3-generate-unit-tests-chat-view"},{"id":"p1m9-c02","module":"p1m9","domain":"productivity","front":"Ask vs Plan vs Agent for testing","back":"Ask: read-only exploration of edge cases. Plan: reviewable multi-file test strategy. Agent: writes, runs, and iterates on tests autonomously.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/4-plan-automate-tests-using-agents"},{"id":"p1m9-c03","module":"p1m9","domain":"productivity","front":"Fix Test Failure in Test Explorer","back":"Hover over a failed test and select the sparkle button. Copilot proposes a fix to test or app code; review it and rerun the test.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-c04","module":"p1m9","domain":"productivity","front":"Ghost text for tests","back":"Best for adding more cases to a test file that already shows the pattern. Start with a descriptive comment or test name, then press Tab to accept.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/5-extend-fix-tests-using-github-copilot"},{"id":"p1m9-c05","module":"p1m9","domain":"productivity","front":"Rules for reviewing AI-generated tests","back":"Keep expected values independent of the code under test. Don't weaken assertions or skip tests just to pass. Remember that coverage isn't correctness.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-c06","module":"p1m9","domain":"productivity","front":"Consistent test conventions with Copilot","back":"Put framework, naming, and Arrange-Act-Assert rules in custom instructions, such as a *.instructions.md file with applyTo scoped to test paths, committed to the repo.","source":"https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"},{"id":"p1m7-c14","module":"p1m7","domain":"privacy","front":"Exam gotcha: content exclusion and agents","back":"Exam-era material (through Aug 2026): content exclusion is NOT supported in IDE agent/edit mode, Copilot CLI, or the Copilot coding agent. If the exam asks which features ignore exclusions, pick those. Since 2 Sep 2026 the Copilot app and CLI honor exclusions, with caveats.","source":"https://github.blog/changelog/2026-09-02-content-exclusions-generally-available-in-copilot-app-and-cli/"},{"id":"p2m1-c01","module":"p2m1","domain":"features","front":"Agent mode (IDE)","back":"Copilot takes a high-level task, decides which files to change, edits them, runs commands, and keeps iterating until the task is done. You review the edits and, by default, approve commands.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-c02","module":"p2m1","domain":"features","front":"Age

s; existing permissions and enterprise rules still apply. /yolo and --allow-all-tools grant blanket permission, and /reset-allowed-tools clears approvals.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli"},{"id":"p1m7-q01","module":"p1m7","domain":"privacy","q":"A repository administrator adds an exclusion for /config/secrets/** in the repository's Copilot settings. Which effect should developers with Copilot Business seats expect?","options":["Inline suggestions stop in those files, and their content no longer informs suggestions or Copilot responses elsewhere","Inline suggestions still appear in those files, but Copilot Chat refuses to answer any question that mentions them by name","The files are encrypted before being sent to Copilot, so suggestions continue but with secret values masked out","The files are hidden from the repository for anyone who lacks admin access, including in pull requests and code search"],"answer":0,"explain":"Excluded files get no inline suggestions, and their content doesn't inform suggestions in other files or Copilot's responses. Exclusion doesn't encrypt or hide files from people; it only controls what Copilot uses.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q02","module":"p1m7","domain":"privacy","q":"Which roles can configure Copilot content exclusion?","options":["Repository administrators, organization owners, and enterprise owners","Only enterprise owners, because exclusions are an enterprise-wide policy","Any developer with a Copilot Business seat, using a file in the repository","Organization owners and billing managers, but not repository administrators"],"answer":0,"explain":"Current docs list repository administrators, organization owners, and enterprise owners. Exclusions are set in GitHub settings, not by individual developers or billing managers. The Learn module only mentions repository administrators and organization owners, so expect either wording on the exam.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q03","module":"p1m7","domain":"privacy","q":"A security team wants to treat Copilot content exclusion as the only control that stops AI tools from reading a directory of private keys. What is the main problem with this plan?","options":["Content exclusion only works for repositories hosted on GitHub Enterprise Server, not GitHub.com","Content exclusion is a guardrail for GitHub's own tools, not a filesystem security boundary","Content exclusion only applies to Copilot Chat responses and never affects inline suggestions","Content exclusion requires each developer to opt in individually from their IDE settings"],"answer":1,"explain":"GitHub states that content exclusion is not a filesystem security boundary and can't prevent every form of file access. It isn't a substitute for operating-system permissions or other access controls.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q04","module":"p1m7","domain":"privacy","q":"An organization excludes a file named internal-pricing.ts. Developers later notice that Copilot still seems to know the type signatures defined in that file when they work in other files. What is the most likely explanation?","options":["The exclusion was misconfigured, because exclusions always block every form of semantic information","Copilot cached the file during model training, so the exclusion has no effect on it","The IDE can indirectly provide semantic information, such as type information, from excluded files","Exclusions only take effect after the repository is archived and then restored"],"answer":2,"explain":"Docs say Copilot may use semantic information from an excluded file if the IDE provides it indirectly, for example type information and hover-over definitions. This is a documented limitation, not necessarily a misconfiguration.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q05","module":"p1m7","domain":"privacy","q":"Content exclusions are configured correctly, but a team still sees Copilot reading excluded content in one setup. Which situation is a documented case where content exclusions currently do NOT apply?","options":["Files opened in Visual Studio Code on Windows with WSL integration disabled","Files in repositories that use Git LFS to store large binary assets","Files reached through symbolic links or repositories on remote filesystems","Files whose names contain uppercase letters, since patterns are case sensitive"],"answer":2,"explain":"Docs say content exclusions don't currently apply to symlinks or to repositories on remote filesystems. Patterns are case insensitive, and VS Code is a supported client.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q06","module":"p1m7","domain":"privacy","q":"A team connects a third-party MCP server to Copilot and asks whether organization content exclusions will stop that server from reading excluded files. What is the accurate answer?","options":["Yes, exclusions are enforced on every MCP server that Copilot connects to, local or remote","Yes, as long as the MCP server runs on the same machine as the IDE and uses stdio","No, because MCP servers can only ever read files that are not under Git control","No: exclusion isn't guaranteed to be respected by third-party MCP servers or clients"],"answer":3,"explain":"Content exclusion is a guardrail for tools GitHub controls and is not guaranteed to be respected by third-party MCP servers or clients.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q07","module":"p1m7","domain":"privacy","q":"A security team wants to rely on content exclusions alone to stop Copilot agents (IDE agent mode, Copilot CLI) from ever reading a secrets/ directory. What is the right guidance?","options":["Don't rely on exclusions alone; also use OS permissions or keep secrets out of the repo","Exclusions fully block every Copilot agent, so no further controls are needed here","Set the public code filter to Block, which also hides sensitive files from agents","Add a rule to copilot-instructions.md, since agents are required to obey those rules"],"answer":0,"explain":"This is the safe answer under both older and current material. Exam-era docs (through Aug 2026) said content exclusion was not supported in IDE agent/edit mode, Copilot CLI, or the coding agent. Since Sept 2026 the Copilot app and CLI honor exclusions, but the docs say exclusion is not a security boundary and may miss indirect file access. Either way, use real access controls. Instructions guide the model but aren't enforced.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-q08","module":"p1m7","domain":"privacy","q":"An organization owner updates content exclusions, but a developer with VS Code already open still gets suggestions in a newly excluded file. What should the developer do to apply the change immediately?","options":["Run Developer: Reload Window from the Command Palette","Uninstall and reinstall the Copilot extension","Ask the organization owner to recreate the exclusion rule","Clear the browser cache and sign in to GitHub.com again"],"answer":0,"explain":"Changes can take up to 30 minutes to reach IDEs that already loaded the settings. In VS Code, Developer: Reload Window reloads them right away. Reinstalling or recreating the rule isn't needed.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-q09","module":"p1m7","domain":"privacy","q":"A developer wonders why Copilot offers no inline suggestions in one file. Which quick check in the IDE confirms that a content exclusion applies to that file?","options":["Look for a red underline on the file name in the Explorer view, which marks excluded files","Run git status and check whether the file is listed under an excluded section","Check for a diagonal line through the Copilot status bar icon, then hover over it","Open the file's properties to look for a read-only attribute set by the Copilot extension"],"answer":2,"explain":"When a file is excluded, the Copilot status bar icon has a diagonal line through it. Hovering shows which settings applied the restriction.","source":"https://docs.github.com/en/copilot/troubleshooting-github-copilot/troubleshooting-common-issues-with-github-copilot"},{"id":"p1m7-q10","module":"p1m7","domain":"privacy","q":"An enterprise has several organizations, each assigning its own Copilot seats. Security wants one set of exclusion rules for every Copilot user in the enterprise. Where should the rules be configured?","options":["In each repository's settings, because only repository rules affect all users","At the enterprise level, because those rules apply to all Copilot users in the enterprise","In one organization, because organization rules automatically extend to sibling organizations","In a .copilotignore file committed to every repository"],"answer":1,"explain":"Enterprise-level rules apply to all Copilot users in the enterprise. Organization rules only apply to users assigned a seat by that organization. A committed ignore file isn't how GitHub configures exclusions.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-q11","module":"p1m7","domain":"privacy","q":"An organization owner wants Copilot to ignore every .env file, including files that are not inside any Git repository. Which organization-level exclusion entry achieves this?","options":["octo-repo: [\"**/.env\"]","\"*\": [\"**/.env\"]","- \"/.env\" in each repository's settings","git@github.com:*/*: [\".env\"]"],"answer":1,"explain":"In organization settings, the \"*\" key matches files anywhere, both Git and non-Git. Repository-keyed entries only cover files within the named repositories.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-q12","module":"p1m7","domain":"privacy","q":"An auditor asks who changed an organization's Copilot content exclusion list last week and what the new rules are. Where should the organization owner look?","options":["The organization's audit log entries for the copilot.content_exclusion_changed action","The Copilot usage metrics dashboard, filtered to the content exclusion settings page","The commit history of the organization's .github repository, where the rules are stored","The organization owner's Copilot Chat history, which records every settings change"],"answer":0,"explain":"The last-changed link on the content exclusion settings page opens the audit log filtered to copilot.content_exclusion_changed. The entry details show the excluded paths after the change.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/review-changes"},{"id":"p1m7-q13","module":"p1m7","domain":"privacy","q":"With the \"Suggestions matching public code\" setting set to Block, how does Copilot decide whether to hide an inline suggestion?","options":["It compares the suggestion plus ~150 characters of context with public GitHub code and hides matches or near matches","It hides any suggestion longer than 150 characters, since long suggestions are the most likely to be copied verbatim","It scans each suggestion for license headers or copyright notices and hides any suggestion that contains one","It compares the suggestion against private repositories in your organization and hides any duplicated code"],"answer":0,"explain":"In most Copilot products, Block mode checks suggestions with about 150 characters of surrounding code against public code on GitHub and doesn't show a match or near match. It doesn't look for license headers or check private repositories.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m7-q14","module":"p1m7","domain":"privacy","q":"A developer whose Copilot seat comes from their organization on GitHub Enterprise Cloud wants to change \"Suggestions matching public code\" in their personal settings. What happens?","options":["They can change it, and their personal choice overrides the organization's policy for their account","They can change it, but only for repositories they own under their personal account","They can't change it there; the setting is inherited from the organization or enterprise","They can change it, but only after an organization owner grants them a policy exception"],"answer":2,"explain":"Members with an organization-assigned seat can't configure this setting in their personal account. It's inherited from the organization or enterprise.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m7-q15","module":"p1m7","domain":"privacy","q":"A team allows suggestions matching public code and wants to check the license of matched code after accepting an inline suggestion in VS Code. Where do they find it?","options":["In the Problems panel, which lists license conflicts for each file Copilot edited","In the Output window under the GitHub Copilot Log (Code References) channel","In a LICENSES.md file that Copilot creates and updates in the repository root","In the repository's Insights tab on GitHub.com under the Dependency graph view"],"answer":1,"explain":"In VS Code, accepted suggestions that match public code are logged in Output > GitHub Copilot Log (Code References). Each entry shows the license, if one was found, and the URL of the matching file.","source":"https://docs.github.com/en/copilot/how-tos/get-code-suggestions/find-matching-code"},{"id":"p1m7-q16","module":"p1m7","domain":"privacy","q":"An organization sets \"Suggestions matching public code\" to Block and then starts using Copilot cloud agent. What should reviewers expect?","options":["The cloud agent is disabled for the organization while the public code policy is set to Block","It applies Block exactly as inline suggestions do, so matching code never appears in its output","It may still generate matching code, and the matches are shown in the agent session logs","It automatically rewrites any matching code until no match remains, then opens the pull request"],"answer":2,"explain":"Docs say the cloud agent (formerly called Copilot coding agent) may generate code that matches public code even when the policy is Block. If that happens, Copilot shows the matches in the agent session logs with a link to details.","source":"https://docs.github.com/en/copilot/responsible-use/agents"},{"id":"p1m7-q17","module":"p1m7","domain":"privacy","q":"A developer is confused that code referencing found no match for a snippet they know exists in their company's private GitHub repository. Why?","options":["The public-code index doesn't include private repositories or code hosted outside GitHub","Code referencing only checks code that was pushed to GitHub within the last 30 days","Code referencing only runs when the organization's public code policy is set to Block","Private repositories are indexed, but matches are only shown to Copilot Enterprise customers"],"answer":0,"explain":"The public-code index doesn't include private repositories or code hosted outside GitHub. It's refreshed periodically, so it may also miss very recent code.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/copilot-in-ides"},{"id":"p1m7-q18","module":"p1m7","domain":"features","q":"A company evaluating Copilot plans needs to exclude specific files from Copilot and manage Copilot policies across the organization. Which plans meet both needs?","options":["Copilot Pro+ and Copilot Max, the highest individual tiers","Copilot Business and Copilot Enterprise","Copilot Free and Copilot Pro","Copilot Enterprise only, since Business lacks content exclusion"],"answer":1,"explain":"Content exclusion and organization-wide policy management are included in Copilot Business and Copilot Enterprise, not in individual plans. Business includes both, so the answer isn't Enterprise only.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m7-q19","module":"p1m7","domain":"features","q":"An enterprise owner sets a Copilot policy to Disabled. An organization owner in that enterprise wants to enable the feature for their organization. What happens?","options":["The organization setting wins, because the more specific scope always takes precedence","The organization owner can still enable it, but only for selected repositories","The organization can't override it; enterprise-selected policies take precedence","The feature is enabled for newly added members and stays disabled for existing ones"],"answer":2,"explain":"If an enterprise owner has chosen a specific policy setting, organization owners can't override it. Organizations decide only when the enterprise lets them.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-policies"},{"id":"p1m7-q20","module":"p1m7","domain":"features","q":"A developer gets Copilot seats from two organizations in the same enterprise. The organizations configure the same policy differently. Which setting usually applies?","options":["The most restrictive setting","The least restrictive setting","The setting from the organization that assigned the seat first","Neither; the feature is disabled until the conflict is fixed"],"answer":1,"explain":"Across organizations in the same enterprise, the least restrictive policy usually applies, with some exceptions. Across different enterprises, the most restrictive policy almost always applies.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"p1m7-q21","module":"p1m7","domain":"privacy","q":"A legal team asks which item in a Copilot rollout is a contractual protection rather than a technical setting. Which one is it?","options":["Intellectual property (IP) indemnity","Content exclusion rules for sensitive paths","The public code filter set to Block","Audit log events for Copilot policy changes"],"answer":0,"explain":"IP indemnity, like the Data Protection Agreement, is a contractual protection: legal defense against third-party IP claims about Copilot output. Content exclusion, the public code filter, and audit logs are settings or tooling.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-management-and-customizations/3-github-copilot-contractual-protections-disabling-matching-public-code"},{"id":"p1m7-q22","module":"p1m7","domain":"privacy","q":"VS Code shows \"GitHub Copilot could not connect to server. Extension activation failed.\" What is the recommended first step?","options":["Delete the workspace's .vscode folder and reopen the project to reset settings","Sign out of Copilot in the IDE and sign back in to request a new token","Disable all other extensions permanently to remove any conflict","Ask the organization owner to remove the content exclusions"],"answer":1,"explain":"This error means there's no Copilot plan or the token request to the GitHub API failed. Signing out and back in requests a new token. Content exclusions don't cause this error.","source":"https://docs.github.com/en/copilot/troubleshooting-github-copilot/troubleshooting-common-issues-with-github-copilot"},{"id":"p1m7-q23","module":"p1m7","domain":"privacy","q":"A developer on an older VS Code release can't get the latest Copilot Chat features, although inline suggestions still work. What is the fix?","options":["Update VS Code; new Copilot Chat versions only support the latest VS Code release","Switch the organization's Copilot plan from Business to Enterprise to unlock Chat features","Turn off suggestions matching public code, which blocks newer Chat features","Pin an older Copilot Chat extension version that matches the installed VS Code"],"answer":0,"explain":"Copilot Chat releases are tied to VS Code releases, and each new Chat version only works with the latest VS Code. Updating VS Code fixes it.","source":"https://docs.github.com/en/copilot/troubleshooting-github-copilot/troubleshooting-common-issues-with-github-copilot"},{"id":"p1m7-q24","module":"p1m7","domain":"privacy","q":"An admin wants to test that a new exclusion also works for Copilot Chat in the IDE. Which test is recommended?","options":["Ask Chat to list every file in the repository and confirm that the excluded file is missing from its answer list","Open only the excluded file, attach it, prompt \"explain this file\", and check it isn't listed as a reference","Commit a change to the excluded file and check whether Copilot code review leaves comments on it","Rename the excluded file to a new path and confirm that Chat can then explain its full contents"],"answer":1,"explain":"Docs say to open the excluded file with other files closed, attach it as context, and ask \"explain this file\". If it's excluded, Chat can't use it and won't list it as a reference.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m8-q01","module":"p1m8","domain":"productivity","q":"A senior Java developer joins a Go project. How does Copilot best help them get productive quickly?","options":["By converting the whole Go codebase to Java so they can keep working in a familiar language","By suggesting context-aware code in the editor and explaining unfamiliar code on request","By installing the Go toolchain and managing the project's module dependencies automatically","By providing recorded video tutorials and interactive Go lessons inside the IDE"],"answer":1,"explain":"The module says Copilot speeds up learning by suggesting context-aware snippets that show how to use unfamiliar APIs and by explaining code with options like Explain. It doesn't replace the language or deliver tutorials.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/2-boost-developer-productivity"},{"id":"p1m8-q02","module":"p1m8","domain":"productivity","q":"How does Copilot reduce context switching for developers?","options":["It offers suggestions and API usage help in the editor, so developers search outside it less","It merges project management and ticketing tools into the IDE so developers never switch apps","It schedules developer tasks and blocks notifications to reduce interruptions during focus time","It removes the need to read any external documentation, since it replaces all API references"],"answer":0,"explain":"In-editor suggestions, quick API references, and completions reduce the need to leave the IDE to search. They don't fully replace documentation or manage schedules.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/2-boost-developer-productivity"},{"id":"p1m8-q03","module":"p1m8","domain":"productivity","q":"A team is building on a newly released, niche framework. What should they expect from Copilot's suggestions?","options":["The same quality as for mainstream languages, because Copilot reads the framework's source at runtime","No suggestions at all, because Copilot only supports a fixed list of frameworks","Possibly less accurate or relevant suggestions, so extra review is needed","Suggestions are blocked until an admin enables the framework"],"answer":2,"explain":"Effectiveness varies by language and framework. For less common or newer technologies, suggestions may be less accurate, so reviewing them matters more.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-q04","module":"p1m8","domain":"productivity","q":"An architect wants Copilot to make the final decision between an event-driven and a monolithic design for a new system. Which limitation is most relevant?","options":["Copilot can't generate code for event-driven systems, so it can only assess the monolithic option","Copilot is strong at code-level tasks but may miss complex architectural trade-offs, so humans decide","Copilot always recommends a monolith because monoliths dominate the public code it was trained on","Copilot requires a Copilot Enterprise plan before it can discuss architecture or system design questions"],"answer":1,"explain":"The module lists limited high-level design as a limitation: Copilot does well with code-level tasks but may not grasp complex architectural decisions. It can help analyze options, but humans decide.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-q05","module":"p1m8","domain":"productivity","q":"A maintenance team inherits an undocumented legacy module. In which SDLC phase is Copilot's help here, and what does it offer?","options":["Requirement analysis: it gathers the original requirements from stakeholders and tickets","Deployment: it deploys the legacy module to production automatically","Maintenance: it explains unfamiliar or legacy code and suggests modern equivalents","Testing: it guarantees full test coverage of the legacy module before changes"],"answer":2,"explain":"In maintenance and support, Copilot helps developers understand unfamiliar or legacy code by explaining it and suggesting modern equivalents. It doesn't gather requirements, deploy on its own, or guarantee coverage.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/4-ai-software-development-lifecycle"},{"id":"p1m8-q06","module":"p1m8","domain":"productivity","q":"An engineering director wants to see how Copilot adoption depth relates to pull request output and time to merge. Which Copilot usage metrics dashboard fits best?","options":["The code generation dashboard","The impact dashboard","The billing usage report","The audit log"],"answer":1,"explain":"The impact dashboard connects adoption depth (cohorts) with pull request output and time to merge. The code generation dashboard breaks down code generated by users and agents.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-q07","module":"p1m8","domain":"productivity","q":"The impact dashboard shows that developers in later adoption phases merge more pull requests. How should leadership read this?","options":["As proof that Copilot caused the increase, since adoption cohorts control for other factors","As an association that can also reflect team composition, project complexity, or experience","As a billing figure that shows the exact return on the organization's Copilot spend","As invalid data, because the impact dashboard only counts accepted inline suggestions"],"answer":1,"explain":"Docs say these comparisons show associations, not proof that adoption caused a change. Team composition, complexity, and experience can also affect results.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-q08","module":"p1m8","domain":"productivity","q":"An analyst adds up active-user totals from each organization's Copilot usage metrics to get an enterprise total. Why is this a mistake?","options":["Organization metrics only cover inline suggestions and leave out Copilot Chat activity","The same user can belong to several organizations, so organization totals can overlap","Organization metrics are delayed by a full week compared with enterprise-level metrics","Organization metrics count assigned licenses, while enterprise metrics count actual activity"],"answer":1,"explain":"Organization-level metrics can overlap because one user may belong to several organizations, so docs advise against adding them up to get an enterprise total.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-q09","module":"p1m8","domain":"productivity","q":"A finance team wants to know how many Copilot seats are assigned. Is the Copilot usage metrics dashboard the right source?","options":["Yes, it lists every assigned seat, including users who have never used Copilot","Yes, but only if telemetry is enabled in every developer's IDE and Copilot CLI","No; usage metrics track activity, not licenses. Use the Copilot user management API","No, seat assignment data is only available by opening a ticket with GitHub Support"],"answer":2,"explain":"Usage metrics measure activity, not license assignments. Docs point to the Copilot user management API for seat and license information.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-q10","module":"p1m8","domain":"productivity","q":"After a training session, the code completions acceptance rate for a team drops sharply. What is a reasonable interpretation?","options":["Training made developers stricter reviewers, which proves that Copilot's suggestion quality has improved","Suggestions may not fit the team's work or there's workflow friction; check with developer feedback","The drop proves the team should stop using Copilot and return to working without AI assistance","Acceptance rate only measures agent edits in files, so a drop in it has no meaning for completions"],"answer":1,"explain":"Docs say a falling acceptance rate may point to mismatched suggestions or workflow friction. They recommend combining metric trends with developer feedback instead of reading one number as a verdict.","source":"https://docs.github.com/en/copilot/reference/copilot-usage-metrics/interpret-copilot-metrics"},{"id":"p1m8-q11","module":"p1m8","domain":"productivity","q":"Why do agent edits appear differently from inline completions in Copilot lines-of-code metrics?","options":["Agent edits aren't measured at all, because agents run outside the telemetry that IDEs send to GitHub","Agents edit files without a suggest-then-accept step, so their edits count as lines added and deleted","Agent edits are counted twice, once as lines suggested and again as lines accepted","Agent edits are only counted once the pull request containing them has been reviewed and merged"],"answer":1,"explain":"Agents edit files without explicit acceptance, so their edits are counted as lines added and deleted under the agent_edit feature and aren't included in suggested metrics.","source":"https://docs.github.com/en/copilot/reference/copilot-usage-metrics/lines-of-code-metrics"},{"id":"p1m8-q12","module":"p1m8","domain":"productivity","q":"An organization runs a Copilot developer survey alongside usage metrics. Which practice does the module recommend when analyzing the responses?","options":["Link each response to the developer's commit history to confirm that answers are accurate","Anonymize responses so they can't be traced to individuals, then track trends over time","Run the long-form survey every week so the data set grows as quickly as possible","Use survey results instead of usage metrics, because telemetry-based metrics are unreliable"],"answer":1,"explain":"The module says to anonymize responses for privacy and track results over time in BI tools or spreadsheets. It warns against survey fatigue: long-form surveys no more than once every four weeks.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-q13","module":"p1m8","domain":"productivity","q":"A team asks Copilot for an authentication helper and plans to merge the result without review because \"Copilot follows best practices\". What is the main risk?","options":["Generated code may have bugs or skip security best practices, so it still needs careful review","Copilot-generated code can't be committed to private repositories without an admin exception","Copilot output always duplicates public code, so merging it creates license compliance issues","The public code filter blocks generated authentication code, so the helper will be incomplete"],"answer":0,"explain":"The module lists bugs, security issues, and context misreading as limitations. Generated code needs careful review, especially security-sensitive code.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m9-q01","module":"p1m9","domain":"productivity","q":"In VS Code Copilot Chat, which slash command generates unit tests for the selected or active code?","options":["/tests","/setupTests","/fix","/explain"],"answer":0,"explain":"/tests generates unit tests for the selected code. /setupTests helps configure a test framework, and /fix proposes fixes for problems. These commands are what GitHub docs and the Learn module teach; VS Code's newer Copilot harness lists fewer built-in slash commands (such as /plan), so type / to see what your setup offers.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m9-q02","module":"p1m9","domain":"productivity","q":"A test fails in VS Code's Test Explorer. What's the quickest way to get a Copilot fix proposal for that specific failure?","options":["Hover over the failed test and select the Fix Test Failure (sparkle) button","Run /setupTests in the Chat view to rebuild the test configuration","Delete the failing test and regenerate it from scratch with the /tests command","Open inline chat in the test file and ask Copilot to explain the assertion"],"answer":0,"explain":"The sparkle Fix Test Failure button in Test Explorer starts a Copilot fix for that failure. You should still review the proposed change against expected behavior and rerun the test.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-q03","module":"p1m9","domain":"productivity","q":"Before changing any files, a developer wants Copilot to list edge cases worth testing for a complex method. Which agent fits best?","options":["Agent, with Bypass Approvals so it can work uninterrupted","Ask, because it answers questions without changing files","Agent, with the terminal tool enabled to run the tests","Cloud agent, assigned to the method through a GitHub issue"],"answer":1,"explain":"Ask mode is read-only Q&A, good for exploring edge cases and options before letting Agent change code. The Agent options would allow file edits.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/3-generate-unit-tests-chat-view"},{"id":"p1m9-q04","module":"p1m9","domain":"productivity","q":"A testing task spans several files, and the team's conventions for fixtures and naming are still unclear. What is the recommended approach?","options":["Use ghost text in each file and accept the suggestions one by one until coverage is complete","Use the Plan agent to agree on a reviewable plan, then hand it off to Agent to implement","Use Ask mode so it can write all the tests directly to disk without any approvals","Run /fixTestFailure first so Copilot creates the missing test files and fixtures"],"answer":1,"explain":"Use Plan first when the work is ambiguous, spans multiple files, or needs conventions confirmed. The plan can then be handed to Agent. Ask doesn't modify files.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/4-plan-automate-tests-using-agents"},{"id":"p1m9-q05","module":"p1m9","domain":"productivity","q":"A test file already has several xUnit tests in an Arrange-Act-Assert style. The developer wants to quickly add a few more edge cases while typing in the editor. Which Copilot feature fits best?","options":["Ghost text inline suggestions, started with a descriptive comment or test name","The Plan agent, to design a new test strategy for the class before writing tests","The /setupTests command, to reconfigure the xUnit framework for extra cases","Copilot cloud agent, assigned through a GitHub issue to add the edge cases"],"answer":0,"explain":"Ghost text uses the existing test patterns to suggest similar cases. It works best when the file already shows the pattern and a comment describes the scenario.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/5-extend-fix-tests-using-github-copilot"},{"id":"p1m9-q06","module":"p1m9","domain":"productivity","q":"After an agent adds new tests, two fail. The agent suggests changing the expected values so the tests pass. What should the developer do?","options":["Accept the change, because the current implementation should be treated as the source of truth for expected values","Diagnose whether it's test setup, a wrong expectation, or a real bug; don't weaken assertions to pass","Mark the failing tests as skipped and revisit them in a later sprint once the code is stable","Delete the failing tests, because generated tests are unreliable and should be rewritten by hand"],"answer":1,"explain":"VS Code guidance says to identify the cause before accepting a fix. Don't delete assertions, skip tests, or change expected values just to get a passing result, because a failure may reveal a real bug.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-q07","module":"p1m9","domain":"productivity","q":"A reviewer sees a generated test that computes its expected value by calling the function under test. Why is this a problem?","options":["It makes the test noticeably slower because the function runs twice per assertion","A bug in the function skews both the actual and expected values, so the test can still pass","Test frameworks such as xUnit and pytest don't allow calling production code from inside assertions","It stops the test from being discovered and listed in VS Code's Test Explorer view"],"answer":1,"explain":"Expected results should be independent of the function under test. Otherwise the same bug can affect both values and the test still passes.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-q08","module":"p1m9","domain":"productivity","q":"A username must be 3 to 20 characters long. Which set of lengths best covers the boundaries when asking Copilot to generate tests?","options":["3, 11, and 20","1, 10, 20, and 50","2, 3, 20, and 21","0, 3, 20, and 100"],"answer":2,"explain":"Testing at each limit and just outside it (2, 3, 20, 21) catches off-by-one errors. Testing only the limits misses values just outside them.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-q09","module":"p1m9","domain":"productivity","q":"A team wants every developer's Copilot-generated tests to use xUnit, Arrange-Act-Assert, and the same naming conventions, but only for files in the tests folder. What should they do?","options":["Commit a *.instructions.md file whose applyTo pattern targets the tests path","Ask each developer to paste the team's testing conventions into every test prompt","Configure a content exclusion for all non-test files so Copilot only sees tests","Set the public code filter to Block so Copilot only learns from the team's own code"],"answer":0,"explain":"Path-specific custom instructions (*.instructions.md with applyTo) scope guidance to matching files. Committing the file shares it with the team. Exclusions and the public code filter don't set conventions.","source":"https://docs.github.com/en/copilot/how-tos/configure-custom-instructions/add-repository-instructions"},{"id":"p1m9-q10","module":"p1m9","domain":"productivity","q":"A developer runs /tests on a file that has no tests yet, and the output uses a different framework from the rest of the project. What simple step helps next time?","options":["Open existing test files in adjacent editor tabs so Copilot sees the framework","Switch the public code filter to Allow so Copilot can match common test patterns","Disable inline suggestions while using Chat so the two don't conflict over context","Rename the source file so its name ends in _test before running /tests again"],"answer":0,"explain":"GitHub recommends opening existing test files in nearby tabs. This gives Copilot context about the framework, so generated tests match existing ones.","source":"https://docs.github.com/en/copilot/tutorials/write-tests"},{"id":"p1m9-q11","module":"p1m9","domain":"productivity","q":"A team wants Copilot to scaffold a test project, generate tests across several files, run them, and fix failures in one session. Which built-in agent is designed for this?","options":["Ask","Plan","Agent","Inline chat"],"answer":2,"explain":"Agent handles autonomous multi-step work: editing files, running terminal commands like the test runner, and iterating on failures. Plan only produces a plan, and Ask is read-only.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/4-plan-automate-tests-using-agents"},{"id":"p1m9-q12","module":"p1m9","domain":"productivity","q":"A test suite generated by Copilot passes and shows high code coverage. What should the team conclude?","options":["The implementation is proven correct, because every line was executed by at least one passing test","Coverage shows which code ran, not whether assertions are right, so the tests still need review","No further manual or code review is needed, since Copilot checked the assertions itself","Coverage tools can't measure Copilot-generated tests, so the coverage number is meaningless"],"answer":1,"explain":"Coverage shows executed code, not correct assertions. A passing suite with high coverage doesn't prove correctness. Generated tests still need review.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p2m1-q01","module":"p2m1","domain":"features","q":"A developer wants Copilot in VS Code to add a REST endpoint, install the needed package, write tests, and keep fixing problems until the tests pass. Which Copilot capability fits this best?","options":["Agent mode in Copilot Chat","Inline code completions while typing","A Copilot-generated pull request summary","Copilot code review of uncommitted changes"],"answer":0,"explain":"Agent mode takes a high-level task, picks the files to change, makes the edits, runs commands, and keeps going until the task is done. Inline completions only suggest code as you type. They don't run commands or work through a multi-step task.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q02","module":"p2m1","domain":"features","q":"Agent mode generates unit tests, but they fail because of a syntax error. What does agent mode typically do next?","options":["Stops and asks the developer to debug the failure manually","Finds the cause, applies a fix, and re-runs the tests until they pass","Deletes the failing tests so the task can be marked complete","Opens a GitHub issue describing the failure and assigns it to a human to fix"],"answer":1,"explain":"Agent mode iterates on its own output. When something fails, it finds the cause, fixes it, and checks again by re-running the tests. It doesn't immediately hand the debugging back to you.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/3-explore-the-power"},{"id":"p2m1-q03","module":"p2m1","domain":"responsible","q":"In agent mode, Copilot proposes running `npm install` and a database migration script in the terminal. What happens by default?","options":["The commands run automatically without being shown to you","The commands are sent to a GitHub Actions runner to execute","You confirm or reject each command before it runs","The commands are ignored unless you copy them into a terminal"],"answer":2,"explain":"You stay in control in agent mode. By default you approve terminal commands before they run, but admin or editor settings can let some commands run automatically. Agent mode runs commands locally in your IDE session, not on Actions runners.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q04","module":"p2m1","domain":"prompt","q":"Agent mode keeps producing code that breaks pricing rules your team never wrote down anywhere. What is the best way to improve the results?","options":["Switch to inline suggestions, which handle business rules better","Document the business rules in project files Copilot can use as context","Close all project files so agent mode relies only on its general training data","Ask agent mode to retry the same prompt until the output looks right"],"answer":1,"explain":"Agent mode can struggle with specialized domain logic or business rules that aren't documented. Giving it clear context, such as documentation in the project, improves accuracy. Retrying the same prompt doesn't give it the missing information.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/3-explore-the-power"},{"id":"p2m1-q05","module":"p2m1","domain":"prompt","q":"In the Learn module, what role do project documentation files such as README.md play when you work with agent mode?","options":["They are only for human readers and agent mode ignores them","They lock agent mode out of the files they describe","They help agent mode understand the project's intended behavior","They replace the need to write a prompt in Copilot Chat"],"answer":2,"explain":"The module teaches that documentation files guide agent mode by describing how the project is supposed to behave. That shapes how it carries out tasks. They don't restrict file access, and you still need to write a prompt.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/6-summary"},{"id":"p2m1-q06","module":"p2m1","domain":"features","q":"According to GitHub docs, which scenario is agent mode best suited to?","options":["Getting ghost-text completions for the line you are typing","Generating a one-line commit message for staged changes","A multi-step task where Copilot should decide the steps and handle errors","Searching the GitHub Marketplace for an extension and installing it for you"],"answer":2,"explain":"The docs recommend agent mode for complex tasks with multiple steps, iterations, and error handling, where Copilot works out the steps itself. It also suits tasks that need external tools such as MCP servers. Completing a single line is what inline suggestions are for.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q07","module":"p2m1","domain":"prompt","q":"A developer wants agent mode to take on a large, loosely defined feature. What do the docs recommend before letting the agent edit code?","options":["Draft an implementation plan first, for example with plan mode","Enable automatic approval for every terminal command the agent proposes","Split the work across several repositories at once","Switch to inline suggestions for the first half of the work"],"answer":0,"explain":"For large or ambiguous tasks, the docs suggest drafting an implementation plan first, for example with plan mode. Approving every command automatically gives you less oversight, not a clearer task.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q08","module":"p2m1","domain":"features","q":"Partway through a task, a developer sees agent mode heading in the wrong direction. What can they do?","options":["Nothing until it finishes, then revert every change it made","Submit a follow-up prompt to redirect the agent before it finishes","Restart the IDE, because a running agent session can't be interrupted mid-task","Open a pull request so a reviewer can stop the agent session"],"answer":1,"explain":"Agent mode is interactive. While it works, you can send a follow-up prompt to redirect it, approve or reject proposed commands, and undo edits you don't want.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q09","module":"p2m1","domain":"responsible","q":"Agent mode proposes extensive changes to authentication logic and says it has already reviewed its own draft. What should the developer do?","options":["Accept everything as is, since the agent has already reviewed its own work","Review the changes, request revisions, and undo anything that doesn't fit","Turn off the test suite so the changes can be committed faster","Merge now and wait to see whether production reports any problems"],"answer":1,"explain":"Even though agent mode reviews its own output, the developer stays in control. You can review, adjust, or revert any change, and that matters most for sensitive code like authentication. The agent's self-review doesn't replace human judgment.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/3-explore-the-power"},{"id":"p2m1-q10","module":"p2m1","domain":"features","q":"A team wants agent mode to look up tickets in its external issue tracker while it works. How do they give agent mode that ability?","options":["Paste an export of the tickets into a code comment","Add the tracker to the repository's content exclusions","Add an MCP server that provides tools for the issue tracker","Install a language server for the tracker's query language"],"answer":2,"explain":"Much of agent mode's power comes from the tools it can call. MCP servers add tools for external systems and for GitHub itself. Pasting an export only gives a static snapshot, not live tool access.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q11","module":"p2m1","domain":"features","q":"A developer whose Copilot license comes from their company can't see the Agent option in VS Code's Copilot Chat mode selector. What is the most likely reason?","options":["Agent mode only works inside GitHub Codespaces","An enterprise or organization admin has disabled agent mode for the IDE","Agent mode requires Docker to be installed on the machine","Agent mode is only available in Copilot Chat on GitHub.com, not in any IDE"],"answer":1,"explain":"The docs note that if Agent is missing from the mode selector, an enterprise or organization admin may have disabled agent mode for your IDE. Agent mode also runs in local VS Code, not only in Codespaces.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/use-copilot-agents/use-agent-mode"},{"id":"p2m1-q12","module":"p2m1","domain":"productivity","q":"You ask agent mode to migrate a legacy JavaScript app to a modern framework. What is it most likely to do on its own?","options":["Give inline completions for the current file only, leaving dependencies and project structure alone","Find the relevant files, update dependencies, refactor across files, and run tests to check","Write a document explaining why to migrate and leave all coding to you","Ask you for manual input at every step and never run any tests"],"answer":1,"explain":"Agent mode looks at the whole project, finds the relevant files and dependencies, makes changes across several files, and runs commands such as tests to check its work. Migrating legacy code is one of the uses the module highlights.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-agent-mode/2-what-is-agent-mode"},{"id":"p2m2-q01","module":"p2m2","domain":"features","q":"A team wants to hand a well-scoped bug fix to Copilot so the work happens in the background on GitHub and ends with a pull request they review. What should they do?","options":["Use agent mode in a local IDE session","Request a Copilot code review on the default branch","Assign the GitHub issue to Copilot","Generate a pull request summary with Copilot"],"answer":2,"explain":"When you assign an issue to Copilot, the cloud agent works in its own development environment, opens a pull request, and requests your review when it finishes. Agent mode makes edits locally in your IDE session instead.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github"},{"id":"p2m2-q02","module":"p2m2","domain":"responsible","q":"Which task is the best one to assign to Copilot cloud agent?","options":["Responding to a live production incident","A small bug fix with clear acceptance criteria","An open-ended redesign with no defined outcome","A task a junior developer wants to do to learn the codebase"],"answer":1,"explain":"Copilot does best with clear, well-scoped tasks that have acceptance criteria. GitHub suggests keeping production-critical work, ambiguous tasks, and tasks people want to learn from for humans.","source":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"p2m2-q03","module":"p2m2","domain":"features","q":"After an issue is assigned to Copilot, the product manager adds a comment on that issue with a changed requirement. What happens?","options":["Copilot picks up the comment and restarts the task","Copilot reads the comment the next time it pushes a commit to its branch","Copilot opens a second pull request to cover the new requirement","Copilot doesn't see it; post the change on Copilot's PR instead"],"answer":3,"explain":"Copilot gets the issue title, description, and the comments that exist when it's assigned. It won't see or react to later comments on the issue. Add new information as a comment on the pull request that Copilot opens.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-on-github"},{"id":"p2m2-q04","module":"p2m2","domain":"privacy","q":"When Copilot cloud agent starts work from an issue assignment, where can it push code?","options":["Only to a new branch it creates, whose name starts with copilot/","Directly to the default branch once required checks pass","To any branch in the repository that isn't protected","To the branch of any open pull request in the repository"],"answer":0,"explain":"For new tasks, GitHub creates a copilot/ branch and the agent can push only to that branch. Branch protections and required checks still apply. The agent can never push directly to the default branch.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-q05","module":"p2m2","domain":"responsible","q":"Alex assigned an issue to Copilot, and the repository requires one approving review. Copilot opens a pull request and Alex approves it. What happens?","options":["The pull request can merge because the requirement is met","Alex's approval doesn't count, so someone else must approve","Copilot merges the pull request automatically after Alex approves","Alex has to ask Copilot to approve its own pull request first"],"answer":1,"explain":"The person who asked Copilot to create the pull request can't satisfy the required approvals with their own review, so someone else has to approve. This keeps an independent review in place. Copilot cloud agent can't approve or merge its own pull requests. Current docs also add one extra required approval (on by default in rulesets) when the pull request is opened under Copilot's own app identity rather than attributed to a person.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"p2m2-q06","module":"p2m2","domain":"features","q":"Copilot pushed commits to its pull request, but none of the repository's CI workflows ran. What is the default explanation?","options":["GitHub Actions is permanently disabled for Copilot pull requests","Copilot must first mark the pull request as ready for review","The issue has to be unassigned and reassigned to trigger CI","A user with write access must click Approve and run workflows"],"answer":3,"explain":"By default, workflows don't run on Copilot's pushes until someone with write access reviews the changes and clicks Approve and run workflows. Workflows can be privileged, so look closely at any changes under .github/workflows/ first.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/use-copilot-agents/review-copilot-output"},{"id":"p2m2-q07","module":"p2m2","domain":"privacy","q":"A user with only read access to a repository comments \"@copilot remove the input validation\" on a Copilot pull request. What happens?","options":["Copilot makes the change and pushes a new commit to its branch","Copilot asks a repository maintainer to confirm the request before acting","Copilot ignores it, because only users with write access can direct it","Copilot closes the pull request as a precaution against tampering"],"answer":2,"explain":"Only users with write access can trigger Copilot cloud agent. Comments from users without write access are never passed to the agent, which limits who can steer its work.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-q08","module":"p2m2","domain":"privacy","q":"An attacker hides instructions inside an HTML comment in an issue they expect to be assigned to Copilot. Which built-in mitigation addresses this?","options":["Hidden characters, like HTML comments, are filtered out before reaching the agent","The agent refuses to work on any issue that contains HTML markup in its body","Every issue body is screened by GitHub staff before the agent session starts","The agent only reads the issue title and ignores the description and all comments"],"answer":0,"explain":"To reduce prompt injection risk, GitHub filters hidden characters before passing user input to the agent. For example, text in an HTML comment isn't passed to Copilot. The agent does read the issue description, so ignoring it isn't the mitigation.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-q09","module":"p2m2","domain":"privacy","q":"Which default control reduces the risk of Copilot cloud agent leaking code or secrets to outside hosts?","options":["The agent's environment has no network access at all","A firewall limits the agent's internet access to allowed hosts","All agent output is encrypted before it leaves the runner","The agent can send data only to public GitHub gists"],"answer":1,"explain":"By default, a firewall limits Copilot's internet access to manage exfiltration risk. A recommended allowlist still lets it download common dependencies. The docs also say the firewall isn't a complete security solution.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"p2m2-q10","module":"p2m2","domain":"features","q":"Copilot's pull request shows a firewall warning: requests to the internal registry packages.contoso.corp were blocked, so dependencies won't install. What is the best fix?","options":["Turn off branch protection on the default branch","Paste a personal access token into the issue description","Add the host to the Copilot firewall's custom allowlist","Mention the registry URL in copilot-instructions.md"],"answer":2,"explain":"Organization owners and repository admins can add domains or URLs to the Copilot firewall's custom allowlist, unless an organization setting blocks repository-level rules. Mentioning the host in an instructions file doesn't change the network rules.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-the-firewall"},{"id":"p2m2-q11","module":"p2m2","domain":"features","q":"In sessions that run on GitHub Actions, Copilot wastes time installing project dependencies by trial and error. How can the team install them reliably before Copilot starts?","options":["Add npm install commands to the README for Copilot to read and follow","Add copilot-setup-steps.yml with a single copilot-setup-steps job","List every dependency and version in each issue assigned to Copilot","Add a setup.yml workflow that runs on every pull request Copilot opens"],"answer":1,"explain":"A .github/workflows/copilot-setup-steps.yml file with a single job named copilot-setup-steps runs before Copilot starts. It installs tools and dependencies in a predictable way. Current docs: this only applies to sessions that run on GitHub Actions, not cloud sandbox sessions (now the default). Older material (and possibly the exam) assumes every cloud agent session runs on GitHub Actions.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment"},{"id":"p2m2-q12","module":"p2m2","domain":"features","q":"A developer adds a correct copilot-setup-steps.yml on a feature branch, but Copilot sessions on GitHub Actions still don't run the setup steps. Why?","options":["The file must be named copilot-setup-steps.yaml","Setup steps only run on self-hosted runners","The workflow must be present on the default branch","The job must be named setup instead of copilot-setup-steps"],"answer":2,"explain":"The copilot-setup-steps.yml workflow won't trigger unless it's on the repository's default branch. The job must also be named copilot-setup-steps.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/customize-the-agent-environment"},{"id":"p2m2-q13","module":"p2m2","domain":"privacy","q":"Copilot cloud agent needs an API key to reach a private package registry. The key already exists as a GitHub Actions repository secret, but the agent can't use it. Why?","options":["Actions secrets only become available to the agent after the PR is merged","The secret has to be pasted into copilot-instructions.md","Secrets are only available to agents on self-hosted runners","The agent doesn't get Actions secrets, only its own dedicated secrets"],"answer":3,"explain":"Copilot cloud agent doesn't get the repository's or organization's GitHub Actions secrets. Only secrets set up specifically for the agent are passed to it. Current docs call these Agents secrets (repository or organization level). Older material describes them as secrets in the repository's `copilot` Actions environment, which have since been migrated. Never put secrets in instruction files or issue text.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/customize-cloud-agent/configure-secrets-and-variables"},{"id":"p2m2-q14","module":"p2m2","domain":"prompt","q":"Copilot cloud agent keeps pushing changes that fail the repository's lint and test checks. What is the recommended fix?","options":["Document build, test, and lint steps in .github/copilot-instructions.md","Disable the failing CI checks for pull requests opened by Copilot","Redo the task with inline suggestions so a human writes each line","Increase the agent session timeout in the repository's Copilot settings"],"answer":0,"explain":"Copilot validates its work in its own environment most reliably when it has clear instructions. A .github/copilot-instructions.md file that explains how to build, test, and lint is the recommended way to provide them.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"p2m2-q15","module":"p2m2","domain":"features","q":"An auditor wants to know who started a piece of work that Copilot cloud agent committed. Where can they find out?","options":["Nowhere, because agent commits carry no information about who requested them","Only in the GitHub Actions billing report for that month","In the commit (requester listed as co-author) and in session and audit logs","Only in the requester's local IDE chat history, which admins can't access"],"answer":2,"explain":"Agent commits are authored by Copilot, and the developer who started the task is listed as co-author. Commit messages link to the session logs, and admins can also see session logs and audit log events.","source":"https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"},{"id":"p2m2-q16","module":"p2m2","domain":"features","q":"A reviewer has six separate comments for Copilot on its pull request. How should they submit them so Copilot works on all of them together?","options":["Post each one with Add single comment, one after another","Use Start a review, then submit all the comments at once","Add the comments to the original issue instead of the PR","Edit the pull request description to list all six changes"],"answer":1,"explain":"Copilot starts acting on comments as soon as they're submitted. Batching them with Start a review means Copilot works on the whole review at once instead of handling each comment separately.","source":"https://docs.github.com/en/copilot/tutorials/cloud-agent/get-the-best-results"},{"id":"p2m2-q17","module":"p2m2","domain":"features","q":"A developer with an Enterprise Managed User account tries to assign an issue in their personal repository to Copilot, and it doesn't work. What should they do?","options":["Use a repository owned by their organization instead","Install Docker locally so Copilot can run the task","Enable the MCP servers in Copilot policy for their account","Switch the repository's visibility from private to public"],"answer":0,"explain":"Copilot cloud agent isn't available in personal repositories owned by managed user accounts, because GitHub-hosted runners aren't available there. Use repositories owned by the organization instead.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/troubleshoot-cloud-agent"},{"id":"p2m3-q01","module":"p2m3","domain":"features","q":"A team wants Copilot's agent to query their internal ticketing system during tasks, and they don't want to build a separate integration for every editor. Which approach fits?","options":["Paste ticket exports into each chat session","Expose the ticketing system through an MCP server","Add the ticketing system to content exclusions","List open tickets in copilot-instructions.md"],"answer":1,"explain":"MCP is an open standard for connecting AI models to tools and data, and it works across the major Copilot surfaces. Static exports or instruction files can't give the agent live access to the tickets.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q02","module":"p2m3","domain":"features","q":"Developers on a Copilot Business plan configured an MCP server in their IDE, but Copilot can't use it. What should the organization admin check first?","options":["That Docker Desktop is installed on every developer machine","That each developer has also bought a Copilot Pro plan","That the MCP servers in Copilot policy is enabled","That the repository is public rather than private"],"answer":2,"explain":"For Copilot Business and Copilot Enterprise users, the MCP servers in Copilot policy must be enabled before they can use MCP with Copilot, and it's disabled by default. Docker is only needed for some local server setups.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q03","module":"p2m3","domain":"features","q":"Which users are governed by an organization's MCP servers in Copilot policy?","options":["Every Copilot user in the organization, including people on Copilot Free and Pro","Users with a Copilot Business or Enterprise license from that org or enterprise","Only enterprise owners who use MCP servers from the GitHub Copilot CLI","Only outside collaborators who access the organization's repositories"],"answer":1,"explain":"The policy only applies to users who get Copilot Business or Copilot Enterprise from an organization or enterprise that configures it. MCP access on individual plans such as Free, Pro, Pro+, or Max isn't controlled by this policy.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q04","module":"p2m3","domain":"features","q":"A developer on GitHub.com wants the fastest way to use the GitHub MCP server in VS Code, without installing Docker or managing a token. What should they use?","options":["The local server image from ghcr.io run in Docker","A GitHub MCP server binary built from source","The remote GitHub-hosted server with OAuth sign-in","Copilot code review's built-in MCP configuration"],"answer":2,"explain":"The remote GitHub MCP server is hosted by GitHub and recommended for most users. You sign in with OAuth, so there's no PAT to create or software to install. The local server is better if you need to customize the setup or have specific security requirements.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/set-up-the-github-mcp-server"},{"id":"p2m3-q05","module":"p2m3","domain":"features","q":"A company runs GitHub Enterprise Server and wants developers to use the GitHub MCP server. Which option applies?","options":["Run the GitHub MCP server locally, configured for the GHES host","Point clients at the remote hosted server at api.githubcopilot.com","Use MCP only through Copilot code review on GitHub.com","MCP can't be used with GitHub Enterprise Server at all"],"answer":0,"explain":"GitHub Enterprise Server doesn't support the remote hosted MCP server, so you run the local server and point it at your GHES host (for example with GITHUB_HOST). The remote server at api.githubcopilot.com is for GitHub.com; GitHub Enterprise Cloud with data residency uses its own remote URL.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/enterprise-configuration"},{"id":"p2m3-q06","module":"p2m3","domain":"privacy","q":"A developer is setting up the GitHub MCP server in VS Code with a personal access token. Which option is the most secure way to supply the token?","options":["Hardcode the token in the workspace mcp.json and commit it","Use an input variable that prompts for the token as a password","Store the token in a plain-text file in the repository root","Put the token in the server URL as a query parameter"],"answer":1,"explain":"The module recommends a promptString input with password set to true, referenced as ${input:github_token}, so the token is entered securely and never committed. Hardcoding the token or keeping it in a plain-text file risks leaking it.","source":"https://learn.microsoft.com/en-us/training/modules/mcp-server/3-configure-connect"},{"id":"p2m3-q07","module":"p2m3","domain":"features","q":"Why do the docs recommend enabling only the GitHub MCP server toolsets you actually need?","options":["Each toolset adds a separate monthly subscription fee","Fewer tools improve tool selection and security and save context tokens","Only one toolset can be active at a time per MCP client","Unused toolsets automatically get write access to every repository you own"],"answer":1,"explain":"With fewer tools, the model picks the right tool more accurately and makes fewer errors, security improves, and less of the context window is used up. You can enable several toolsets at once.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q08","module":"p2m3","domain":"privacy","q":"Copilot cloud agent uses the default GitHub MCP server, but it can't read issues from a different repository. Why?","options":["The GitHub MCP server has no tools for reading issues","The Playwright MCP server intercepts and blocks calls to other repositories","By default its token is read-only and scoped to the current repository","The firewall blocks all traffic to github.com from the agent"],"answer":2,"explain":"By default, the cloud agent's GitHub MCP server uses a specially scoped token with read-only access to the current repository. To reach other repositories, you have to configure credentials with broader access.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q09","module":"p2m3","domain":"features","q":"A repository admin adds a remote MCP server that requires OAuth to the repository's MCP configuration for Copilot cloud agent. What should they expect?","options":["It works, and each user approves the OAuth prompt during the agent session","It works only after the agent is switched to agent mode","It isn't supported, so they need a server using a key or token in secrets","It's converted to a read-only Playwright server automatically"],"answer":2,"explain":"For MCP servers configured in repository settings, Copilot cloud agent and Copilot code review don't currently support remote servers that use OAuth. Credentials are passed with COPILOT_MCP_-prefixed secrets instead. They also only support MCP tools, not resources or prompts.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q10","module":"p2m3","domain":"responsible","q":"When you assign an issue to Copilot cloud agent, it uses configured MCP tools without asking for approval. Which practice best manages this risk?","options":["Allow only the tools the task needs, preferably read-only ones","Turn on every tool so the agent never gets stuck","Share your personal credentials with every MCP server so tools always work","Rely on the firewall to block any harmful MCP tool calls"],"answer":0,"explain":"Delegated agents call MCP tools on their own without asking, so review each server and allowlist only the tools the task needs, preferably read-only. The firewall doesn't apply directly to MCP servers you configure.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/mcp-and-cloud-agent"},{"id":"p2m3-q11","module":"p2m3","domain":"features","q":"A developer set up the GitHub MCP server in VS Code, but its tools don't appear in Copilot Chat. What should they check?","options":["That Copilot Chat is set to Agent so MCP tools can be used","That inline completions are turned on in VS Code settings","That the repository has a copilot-setup-steps.yml workflow","That Copilot code review is enabled for the repository"],"answer":0,"explain":"To use GitHub MCP server tools in VS Code, select Agent in Copilot Chat, then open Configure tools to see them. copilot-setup-steps.yml only configures the cloud agent's environment.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/use-the-github-mcp-server"},{"id":"p2m3-q12","module":"p2m3","domain":"features","q":"GitHub MCP server tools suddenly stop working in VS Code. Which troubleshooting step do both the docs and the Learn module list?","options":["Delete your personal access token and run without one","Make sure you're signed in to your GitHub account in the IDE","Remove every MCP server configuration and start over","Reinstall the Copilot extension on every machine in the team"],"answer":1,"explain":"Both sources say to check that you're signed in to GitHub in the IDE. If you use a PAT, check that it's valid and has the right scopes. Restarting the MCP server or IDE is another listed step.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/use-the-github-mcp-server"},{"id":"p2m4-q01","module":"p2m4","domain":"features","q":"By default, what type of review does Copilot code review submit on a pull request?","options":["An Approve review that counts toward required approvals","A Request changes review that blocks merging","A Comment review that doesn't count toward required approvals","An automatic merge once all of its suggestions are applied"],"answer":2,"explain":"By default, Copilot leaves a Comment review, not Approve or Request changes, so it doesn't count toward required approvals or block merging. Current docs: admins can turn on Copilot approvals (off by default) at enterprise, organization, and repository level, and then Copilot's approving reviews can count. Older material (and possibly the exam) says Copilot never approves.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q02","module":"p2m4","domain":"features","q":"A repository admin wants Copilot to review every pull request that targets main, whether or not each author has turned on automatic review for themselves. What should they set up?","options":["A branch ruleset with the automatic Copilot code review rule","A CODEOWNERS file that lists Copilot as owner of every path","An Actions workflow that runs a chat prompt on each PR","A request to every developer to enable it in personal settings"],"answer":0,"explain":"A branch ruleset that automatically requests Copilot code review covers pull requests to the targeted branches, whatever the author's personal settings (for authors with Copilot access, or all members if review for unlicensed members is enabled). Personal settings only cover the pull requests that user creates.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review"},{"id":"p2m4-q03","module":"p2m4","domain":"features","q":"An organization owner wants automatic Copilot reviews in every repository whose name ends in \"service\", without configuring each repository. What should they do?","options":["Create a repository ruleset in each matching repository by hand","Create an organization ruleset that targets repositories by name pattern","Add the name pattern to the organization's custom instructions for Copilot","Enable automatic review in their own personal Copilot settings"],"answer":1,"explain":"Organization owners can create branch rulesets that target repositories with include or exclude patterns, such as *service. Custom instructions change what Copilot looks for in a review, not which pull requests it reviews.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/set-up-copilot/configure-code-review"},{"id":"p2m4-q04","module":"p2m4","domain":"features","q":"Copilot automatically reviewed a pull request. The author then pushed three more commits, and Copilot didn't review again. Why?","options":["Copilot only reviews pull requests that are still drafts","Each pull request can only be reviewed once by Copilot","Review new pushes isn't enabled, so re-request a review manually","The new commits must be squashed into one before Copilot can see them"],"answer":2,"explain":"Unless Review new pushes is turned on, Copilot reviews a pull request only once. You can ask it to review again with the re-request button next to Copilot in the Reviewers menu.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q05","module":"p2m4","domain":"prompt","q":"A team wants every Copilot review in a repository to check for unsafe string interpolation and missing docstrings. Where should they put this guidance?","options":["In each pull request description","In .github/copilot-instructions.md","In the repository's CONTRIBUTING.md","In each developer's IDE settings"],"answer":1,"explain":".github/copilot-instructions.md holds repository-wide custom instructions that Copilot code review applies to every review. Copilot doesn't treat CONTRIBUTING.md as a custom instructions file.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q06","module":"p2m4","domain":"prompt","q":"A team wants extra review rules to apply

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GH-300">

<link rel="apple-touch-icon" href="icon-180.png">
<title>GH-300 Study</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--mut:#8b949e;--ac:#2f81f7;--acbg:rgba(47,129,247,.16);--ok:#2ea043;--okbg:rgba(46,160,67,.15);--bad:#f85149;--badbg:rgba(248,81,73,.14);--warn:#d29922}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom));min-height:100vh}
body.insession{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
body.insession .tabs{display:none}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 2px}
h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 10px}
a{color:var(--ac)}
.muted{color:var(--mut)}
.btn{display:block;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff;text-align:center;font-weight:600}
.btn.ok{background:var(--okbg);border-color:var(--ok);text-align:center;font-weight:600}
.btn.bad{background:var(--badbg);border-color:var(--bad);text-align:center;font-weight:600}
.btn:disabled{opacity:.4}
.mode{margin:10px 0}
.mode b{display:block;font-size:17px;margin-bottom:2px}
.mode small{color:var(--mut);font-size:14px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px;background:var(--card);color:var(--mut);border:0;font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acbg);border-color:var(--ac);color:var(--tx)}
.chip.link{border-style:dashed}
.grp{font-size:13px;color:var(--mut);margin-top:6px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.top .x{background:none;border:0;color:var(--mut);font-size:28px;line-height:1;padding:0 6px 0 0;cursor:pointer}
.top .grow{flex:1;color:var(--mut);font-size:14px}
.bar{height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ac);transition:width .2s}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
.tag{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--card);border:1px solid var(--bd);color:var(--mut)}
.q{font-size:18px;font-weight:600;margin:8px 0 16px;white-space:pre-wrap}
.opt{display:flex;gap:12px;margin:10px 0;align-items:flex-start}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;color:var(--mut)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.opt.dim{opacity:.5}
.fb{border-radius:12px;padding:14px;margin:14px 0;border:1px solid var(--bd);background:var(--card)}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb b{display:block;margin-bottom:6px}
.src{display:inline-block;margin-top:8px;font-size:13px;word-break:break-all}
.row{display:flex;gap:10px;margin-top:16px}
.row .btn{text-align:center}
.flash{min-height:280px;border-radius:16px;border:1px solid var(--bd);background:var(--card);padding:24px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;margin-top:14px}
.flash .f{font-size:20px;font-weight:600;text-align:center}
.flash .b{font-size:17px;margin-top:16px;border-top:1px solid var(--bd);padding-top:16px;white-space:pre-wrap}
.flash .hint{color:var(--mut);font-size:13px;text-align:center;margin-top:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(13,17,23,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;padding:15px 0;background:none;border:0;color:var(--mut);font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{color:var(--tx);font-weight:600}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:14px 0 5px;font-size:15px}
.stat span{color:var(--mut);font-size:13px;white-space:nowrap}
.bar.g>i{background:var(--ok)}.bar.w>i{background:var(--warn)}.bar.r>i{background:var(--bad)}.bar.n>i{background:var(--bd)}
.big{font-size:52px;font-weight:700;text-align:center;margin:24px 0 0}
.sub{text-align:center;color:var(--mut)}
.rev{border-left:3px solid var(--bad);padding:10px 12px;margin:12px 0;background:var(--card);border-radius:0 10px 10px 0;font-size:15px}
.rev .rq{font-weight:600;margin-bottom:6px}
.rev .ra{color:var(--ok);margin:4px 0}
.rev .ry{color:var(--bad);margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:22px}
.kpi span{font-size:12px;color:var(--mut)}
p{margin:10px 0}
ul{padding-left:20px}
li{margin:4px 0}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="home">Study</button>
  <button data-tab="stats">Progress</button>
  <button data-tab="about">About</button>
</nav>
<script>const BANK = {"built":"15 Nov 2026","questions":[{"id":"p1m1-q01","module":"p1m1","domain":"responsible","q":"A lender uses an AI model to pre-screen loan applications. An audit finds that applicants with near-identical financial situations get different recommendations depending on their ethnicity. Which responsible AI principle is most directly at stake?","options":["Fairness","Inclusiveness","Transparency","Reliability and safety"],"answer":0,"explain":"Fairness means similarly situated people get consistent outcomes, with no differing impact on comparable groups (the module uses loan applications as its example). Inclusiveness is about making AI accessible to everyone and letting everyone benefit, not about consistent decisions.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q02","module":"p1m1","domain":"responsible","q":"A team adds screen-reader support, translation for small regional dialects, and an offline mode for users with poor connectivity to its AI product. Which responsible AI principle are they mainly addressing?","options":["Inclusiveness","Fairness","Accountability","Transparency"],"answer":0,"explain":"Inclusiveness means AI systems work for and empower everyone, whatever their disability, language, or infrastructure. The module lists screen readers, regional dialects, and offline or low-connectivity operation as examples. Fairness is about consistent treatment in decisions, not access.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q03","module":"p1m1","domain":"responsible","q":"An AI vendor publishes documentation that explains how its system works, justifies key design choices, states its known limitations, and enables logging and auditing. Which principle does this primarily put into practice?","options":["Transparency","Accountability","Privacy and security","Reliability and safety"],"answer":0,"explain":"Transparency means AI systems are understandable: explain how they work, justify design choices, be honest about limitations, and support auditability. Accountability is related, but it is about people taking responsibility for how the system operates.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q04","module":"p1m1","domain":"responsible","q":"Before training a model, a data team replaces customer names and account numbers with random identifiers but keeps each record separate. Which privacy technique are they using?","options":["Pseudonymization","Aggregation","Envelope encryption","Data minimization"],"answer":0,"explain":"Pseudonymization replaces personal details with random identifiers. Aggregation would instead group records into summaries and remove individual-level detail. Data minimization means not collecting unnecessary data in the first place.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q05","module":"p1m1","domain":"responsible","q":"A developer accepted a Copilot suggestion that later caused a security vulnerability in production. According to GitHub's responsible use guidance, who bears responsibility for that code?","options":["The developer and team who accepted and shipped the code","GitHub, because its own service generated the suggestion","The provider of the model that produced the suggestion","Nobody, since AI output is probabilistic by nature"],"answer":0,"explain":"GitHub's application card says users take on all risks of generated code, including security vulnerabilities, bugs, and IP infringement. That matches the accountability principle: people are accountable for AI systems and their output.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m1-q06","module":"p1m1","domain":"responsible","q":"Under deadline pressure, a developer starts accepting Copilot's proposed fixes without reading or testing them because they 'usually look right'. Which risk does GitHub's guidance describe here?","options":["Overreliance on AI output","Hallucination in the model's output","Prompt injection","Training data bias"],"answer":0,"explain":"Overreliance is when users accept incorrect or incomplete AI output, often because mistakes are hard to spot. Hallucination describes the model producing plausible but false output. Here the risk lies in the user's behavior, not in the model's output.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-q07","module":"p1m1","domain":"responsible","q":"Copilot Chat confidently tells a developer to call a library method that does not exist in any version of that library. What is this behavior called?","options":["Hallucination","Overreliance","Public code matching","Content filtering"],"answer":0,"explain":"A hallucination is output that sounds plausible but is factually wrong or made up. This is a known LLM risk and the reason human review matters. Overreliance describes the user accepting such output, not the model producing it.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-q08","module":"p1m1","domain":"responsible","q":"An organization wants to reduce the risk of unintended, harmful outcomes from the AI tools its developers use. Which approach does the module recommend?","options":["Robust governance, transparent AI processes, and human oversight","Rely only on the vendor's built-in content filters for safety","Limit AI tool access to the most senior engineers on each product team","Allow AI completions but block every chat-based AI interaction"],"answer":0,"explain":"The module's mitigation advice is to put robust governance frameworks in place, make AI processes transparent, and include human oversight. Vendor filters help, but they don't replace governance and human review.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/2-manage-ai-risks"},{"id":"p1m1-q09","module":"p1m1","domain":"responsible","q":"Copilot produces a block of code that turns out to match code in a public repository. What does GitHub recommend before using it?","options":["Treat it like any code you didn't write: test it, scan for IP issues, check security","Accept it as is, because public code on GitHub is free to reuse without restrictions","Rename the variables and functions so the code no longer counts as a match","Ignore the match, because Copilot only reproduces code under permissive licenses"],"answer":0,"explain":"GitHub says to take the same precautions as with any material you didn't independently originate: rigorous testing, IP scanning, and checking for security vulnerabilities. Public code can still carry license obligations, and renaming identifiers doesn't remove them.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-q10","module":"p1m1","domain":"responsible","q":"A team is using Copilot to help build a system that decides people's eligibility for health insurance. Which practice best follows GitHub's responsible AI guidance?","options":["Add extra caution and human oversight; let affected people understand and appeal decisions","Let the AI-generated logic run unattended so that human bias is kept out of all the decisions","Turn off content filtering so the model has full freedom to reason about each applicant","Rely on Copilot's training data to guarantee fairness across every applicant group"],"answer":0,"explain":"Insurance and healthcare are consequential decisions in sensitive domains. GitHub advises caution, human oversight, and making sure affected people can understand decisions, appeal them, and update input data. Training data can contain bias, so it can't guarantee fairness.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-q11","module":"p1m1","domain":"responsible","q":"An AI system must keep behaving as designed when it meets unexpected inputs, and it must resist attempts to manipulate it into harmful behavior. Which principle does this describe?","options":["Reliability and safety","Privacy and security","Transparency","Fairness"],"answer":0,"explain":"Reliability and safety means systems work as designed, respond safely to unexpected conditions, resist harmful manipulation, and minimize unintended harm. Privacy and security is about protecting data and access, not consistent behavior.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q12","module":"p1m1","domain":"responsible","q":"A developer asks Copilot Chat in their IDE for advice on the tax implications of a contract clause and gets an odd answer. Based on GitHub's guidance, what is the best explanation?","options":["Copilot Chat is designed for coding questions, so off-topic answers may be unreliable","Copilot Chat needs the Bing web search policy turned on before it will answer such questions","Copilot Chat must be told to act as a lawyer before it can answer legal questions","Copilot Chat only answers questions about files that are open in the editor"],"answer":0,"explain":"GitHub says Copilot Chat isn't designed for non-coding questions, and answers in those areas may be irrelevant or nonsensical. Its advice is to keep prompts on coding topics. A role prompt doesn't change what the tool is intended for.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m2-q01","module":"p1m2","domain":"features","q":"An organization on the GitHub Team plan wants to roll out Copilot with central seat management, organization-wide policies, and the ability to exclude sensitive files from Copilot. Which plan should the owner buy?","options":["Copilot Business","Copilot Pro for each developer","Copilot Pro+ for each developer","Copilot Free with organization policies"],"answer":0,"explain":"Copilot Business is made for organizations and includes centralized management, policy control, and content exclusion. Owners of organizations on GitHub Free or GitHub Team can buy it. Individual plans (Free, Pro, Pro+) don't include content exclusion or organization-wide policy management.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-q02","module":"p1m2","domain":"features","q":"A company is considering Copilot Enterprise. Which platform requirement does GitHub list for this plan?","options":["The enterprise uses GitHub Enterprise Cloud","Every organization is on the GitHub Team plan","An Azure subscription is linked to the enterprise","Each developer has an individual Copilot Pro plan"],"answer":0,"explain":"GitHub describes Copilot Enterprise as designed for enterprises using GitHub Enterprise Cloud, with all Copilot Business features plus more. Copilot Business is the plan that organizations on GitHub Free or GitHub Team can buy directly.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-q03","module":"p1m2","domain":"features","q":"A developer's company has a GitHub Enterprise license that includes the right to use Copilot, but the developer gets no Copilot access when they sign in to their IDE. What is the most likely missing step?","options":["An administrator hasn't assigned them a Copilot seat","They haven't installed the Copilot CLI with npm","They need to first activate Copilot Free personally","Their repository hasn't been indexed by Copilot yet"],"answer":0,"explain":"To use Copilot at an organization's or enterprise's expense, an administrator must assign you a seat, even when the enterprise license includes Copilot. Copilot Free is only for individuals who don't get Copilot through an organization or enterprise.","source":"https://docs.github.com/en/copilot/get-started/what-is-github-copilot"},{"id":"p1m2-q04","module":"p1m2","domain":"features","q":"In VS Code on Windows, Copilot shows a gray inline suggestion. You'd like to compare it with other options without leaving the editor. What should you do?","options":["Press Alt+] to cycle to the next suggestion","Press Ctrl+I to open inline chat and ask again","Press Esc, then retype the line more slowly","Run Copilot: Explain This from the context menu"],"answer":0,"explain":"Alt+] (Option+] on macOS) shows the next alternative suggestion, and Alt+[ shows the previous one. Tab accepts and Esc rejects. Ctrl+I opens inline chat, which is a different interaction.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m2-q05","module":"p1m2","domain":"features","q":"A developer wants to ask Copilot to refactor the function under the cursor and see the change right there in the editor, without switching to the Chat panel. Which feature fits best?","options":["Inline chat, opened with Ctrl+I / Cmd+I","Copilot Spaces, opened from GitHub.com","Pull request summaries on GitHub.com","The command palette's Collect Diagnostics"],"answer":0,"explain":"Inline chat (Ctrl+I or Cmd+I) gives you a conversation tied to a specific code location, so you can request changes without switching context. Spaces is for curating project context for chat, not for in-place edits in the editor.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-to-github-copilot/3-interacting-with-copilot"},{"id":"p1m2-q06","module":"p1m2","domain":"privacy","q":"A developer notices that Copilot gives few or no inline suggestions when they type well-known algorithms such as FizzBuzz, while it works fine on their own business logic. What is the most likely cause?","options":["Suggestions matching public code are blocked by a policy","The editor's context window is full from other open tabs","The repository is private, so Copilot skips its files","Inline chat was disabled in the extension's settings"],"answer":0,"explain":"GitHub's docs note that limited or missing suggestions may mean duplication detection is on. When suggestions matching public code are blocked, common textbook implementations are the most likely to be suppressed. Private repositories still get suggestions.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m2-q07","module":"p1m2","domain":"privacy","q":"On a corporate network, Copilot fails with 'read ETIMEDOUT'. You want a quick test from the command line to see whether the machine can reach Copilot's servers. What should you run?","options":["curl --verbose https://copilot-proxy.githubusercontent.com/_ping","git ls-remote https://github.com/github/copilot-docs.git HEAD","ping github.com and confirm that there is no packet loss","nslookup api.github.com to confirm the DNS resolution"],"answer":0,"explain":"GitHub's troubleshooting guide suggests a verbose curl to the _ping endpoint and expects an HTTP 200. You can add -x to route the request through your proxy. For Copilot Chat issues, test https://api.githubcopilot.com/_ping. A plain ICMP ping or DNS lookup doesn't test the HTTPS path Copilot uses.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/troubleshoot-network-errors"},{"id":"p1m2-q08","module":"p1m2","domain":"privacy","q":"A developer's browser works through the corporate proxy, configured as https://proxy.corp.example:8443, but Copilot can't connect. Which explanation does GitHub's documentation support?","options":["Copilot doesn't currently support proxy URLs that start with https://","Copilot needs a VPN instead of an HTTP proxy to reach its servers","Copilot supports proxy authentication only through OAuth tokens","Copilot always bypasses the proxy and connects to GitHub servers directly"],"answer":0,"explain":"Copilot connects to proxies with its own code, so a proxy setup your editor supports may not work for Copilot. GitHub specifically says proxy URLs starting with https:// aren't currently supported. Proxy authentication is supported with basic auth or Kerberos, not OAuth.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/troubleshoot-network-errors"},{"id":"p1m2-q09","module":"p1m2","domain":"privacy","q":"Copilot reports 'unable to verify the first certificate' because the corporate proxy inspects TLS traffic. Which fix does GitHub recommend over the others?","options":["Install the corporate CA in the OS trust store or have IT stop intercepting","Turn off Proxy Strict SSL permanently so all certificate errors are always ignored","Reinstall the Copilot extension to regenerate its bundled certificates","Switch to Copilot Free, which skips certificate validation by default"],"answer":0,"explain":"Recommended fixes are: install the custom certificates in the OS trust store, use a proxy that doesn't intercept secure connections, or ask IT to stop intercepting. Ignoring certificate errors (turning off Proxy Strict SSL) is possible, but GitHub warns it causes security issues and doesn't recommend it.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/troubleshoot-network-errors"},{"id":"p1m2-q10","module":"p1m2","domain":"privacy","q":"Copilot in VS Code is misbehaving, but the GitHub Copilot output logs show no errors. Where should you look next?","options":["Electron logs, via Developer: Toggle Developer Tools > Console","The repository's GitHub Actions logs for recent Copilot workflow runs","The organization audit log for Copilot seat assignment events","The Copilot usage metrics dashboard for the organization"],"answer":0,"explain":"In rare cases errors aren't logged in the usual places. Both GitHub and the module suggest viewing the Electron logs from the process running VS Code and the extension, using Toggle Developer Tools. Audit logs and metrics don't capture client-side extension errors.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/view-logs"},{"id":"p1m2-q11","module":"p1m2","domain":"features","q":"A team lead wants to gather the relevant repositories, specs, issues, and design notes in one place so that everyone's Copilot conversations about a new feature draw on the same curated context. Which feature fits?","options":["Copilot Spaces","Copilot pull request summaries","Inline chat in the IDE","Copilot code review"],"answer":0,"explain":"Spaces let you organize repositories, code, issues, pull requests, notes, and files into a curated set of context. Copilot then uses that context to answer questions, and teams can share it. Pull request summaries only describe the changes in a single pull request.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m2-q12","module":"p1m2","domain":"features","q":"A developer finds Copilot's inline suggestions distracting when writing Markdown documentation, but wants to keep them for code. What is the simplest option in VS Code?","options":["Use the Copilot status menu to disable completions for Markdown only","Uninstall the Copilot extension and reinstall it only for code workspaces","Ask an organization owner to add all Markdown files to content exclusion","Switch the account to a different plan that excludes Markdown files"],"answer":0,"explain":"When you disable completions from the Copilot status icon, VS Code asks whether to disable them globally or only for the current file's language. Content exclusion is an admin control for hiding sensitive files, not a way to set editor preferences.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-to-github-copilot/4-setup-configure-troubleshoot"},{"id":"p1m3-q01","module":"p1m3","domain":"prompt","q":"A developer prompts: 'Build the login page, set up the payment API, and also refactor the reporting module.' Results are vague and incomplete. Which of the 4 S's does this prompt break most clearly?","options":["Single","Short","Surround","Specific"],"answer":0,"explain":"Single means each prompt should focus on one well-defined task or question. This prompt mixes three unrelated tasks. It also lacks detail, but the main problem is bundling several tasks into one request.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-q02","module":"p1m3","domain":"prompt","q":"Copilot's inline suggestions in 'helpers2.js' keep ignoring the project's existing data models, which are defined in other files that aren't open. Which change best follows the 'Surround' principle?","options":["Open the related model files and use descriptive file names","Make each comment shorter so Copilot focuses on fewer words","Close every other tab so Copilot only sees the current file","Repeat the same comment several times to reinforce intent"],"answer":0,"explain":"Surround means giving Copilot rich context through descriptive file names and keeping related files open, because open tabs feed into suggestions. GitHub's docs also say to open relevant files and close only irrelevant ones.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-q03","module":"p1m3","domain":"prompt","q":"You paste one existing Celsius-to-Fahrenheit function into the prompt and ask Copilot to write a matching Fahrenheit-to-Kelvin function in the same style. Which approach is this?","options":["One-shot prompting","Zero-shot prompting","Few-shot prompting","Role prompting"],"answer":0,"explain":"One-shot prompting gives exactly one example so Copilot follows your patterns and conventions. Zero-shot gives no examples, and few-shot gives several.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-q04","module":"p1m3","domain":"prompt","q":"A developer needs a greeting function that handles morning, afternoon, evening, and edge cases at boundary times. They include several input/output examples in the prompt. What is the main benefit of this few-shot approach?","options":["Several examples help Copilot handle multiple scenarios and edge cases","It turns off the model's foundational training in favor of the examples","It retrains the model so future prompts follow the same pattern","It skips content filtering because the examples are developer-written"],"answer":0,"explain":"Few-shot prompting gives several examples. It sits between zero-shot unpredictability and the precision of fine-tuning, and it is good for implementations that must handle multiple scenarios and edge cases. Examples guide this one response; they don't retrain the model.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-q05","module":"p1m3","domain":"prompt","q":"A developer wants a password validation function that follows OWASP guidance and guards against common attacks on the first try. Which prompting technique from the module fits best?","options":["Role prompting, e.g. 'Act as a cybersecurity expert...'","Zero-shot prompting with just the function name typed","Chain prompting that repeats the full chat history each turn","Leaving the prompt vague so Copilot can pick the approach"],"answer":0,"explain":"Role prompting tells Copilot to act as a specific expert, such as a security, performance, or testing specialist. This brings domain expertise into the first draft, for example input sanitization and protection against common attacks, so fewer revisions are needed.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-q06","module":"p1m3","domain":"prompt","q":"After a long Copilot Chat session building an authentication module, a developer moves on to an unrelated caching feature. Answers start drifting and requests get more expensive. What is the best practice?","options":["Start a new conversation and give a short, focused summary of the context","Keep the same thread so Copilot remembers everything discussed so far","Paste the full authentication code again in every new prompt to be safe","Switch to inline suggestions only, since they don't use any context"],"answer":0,"explain":"The module warns that long histories become inefficient and costly to process, and recommends resetting with focused context, summarizing what matters, and referring to earlier work briefly instead of repeating it. GitHub's docs likewise say to start a new conversation when you begin a new task.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-q07","module":"p1m3","domain":"prompt","q":"You're writing a multi-line Copilot Chat prompt with a goal and several requirements. According to GitHub's guidance, how should you structure it?","options":["State the broad goal first, then list requirements with the most important first","List edge cases first and put the overall goal at the very end of the prompt","Put every requirement into one long sentence so that Copilot weighs them all equally","Write the requirements as meta-rules such as 'Remember to always do X'"],"answer":0,"explain":"GitHub advises starting general and then getting specific, with the most important requirements first, because Copilot gives extra weight to the beginning and end of a prompt. It also advises stating rules directly instead of as meta-instructions.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-q08","module":"p1m3","domain":"prompt","q":"With a file open and its last response still on screen, a developer asks Copilot Chat 'What does this do?' and gets an explanation of the wrong thing. Which rewrite best fixes the issue?","options":["What does the `createUser` function do?","Explain this again, but in much more detail.","Act as an expert and tell me what this does.","What does this do? Please answer carefully."],"answer":0,"explain":"'This' could mean the current file, the last response, or a specific block. GitHub advises avoiding ambiguity by naming exactly what you mean, such as a specific function or 'the code in your last response'.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-q09","module":"p1m3","domain":"prompt","q":"A developer asks Copilot in one prompt to 'generate a complete word-search puzzle game' and gets brittle, incomplete code. What should they do next?","options":["Break it into small steps: build the grid first, then find words in it","Repeat the same prompt several times until a complete version appears","Make the prompt shorter, for example 'make word search', to cut ambiguity","Resubmit it with 'be thorough and complete' added to the end of the prompt"],"answer":0,"explain":"GitHub uses this exact example: break a complex task into simple steps (generate a grid, find words in it, combine them, print results) and ask for them one at a time. Repeating the same prompt doesn't add any information.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-q10","module":"p1m3","domain":"prompt","q":"Copilot's first inline suggestion from a comment prompt is close but misses a requirement. Per the 'assert and iterate' practice, what is the most effective next step?","options":["Remove the suggestion, add details and examples to the comment, then prompt again","Accept it as is and fix the remaining code by hand without involving Copilot","Delete the comment completely and start over with an unrelated new prompt","Keep pressing Tab repeatedly until Copilot eventually works out the missing requirement"],"answer":0,"explain":"The module recommends not starting from scratch. Instead, remove the suggestion, enrich your original comment with more detail and examples, and prompt again. GitHub's docs agree: iterate by refining the prompt, or keep the suggestion and ask for changes.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-q11","module":"p1m3","domain":"prompt","q":"A developer needs a date-parsing function with tricky format rules. Which approach from GitHub's prompt engineering guidance gives Copilot the clearest examples of expected behavior?","options":["Have Copilot write unit tests first, then ask for a function that passes them","Ask for the function first and then let Copilot decide which tests are needed","Describe the format rules vaguely so Copilot can generalize more on its own","Ask Copilot to act as a date expert and skip giving any concrete examples"],"answer":0,"explain":"GitHub notes that unit tests can serve as examples: write tests for the function first, then ask Copilot to write a function those tests describe. Concrete examples (inputs, outputs, tests) reduce ambiguity far more than a role alone.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-q12","module":"p1m3","domain":"data","q":"In Copilot's prompt processing flow, which component blocks attempts to hack the prompt or trick the system into revealing how the model generates suggestions?","options":["The proxy filter on a server in a GitHub-owned Azure tenant","The toxicity filter that screens out hate speech and personal data","The public code matching filter enabled by administrators","The Fill-in-the-Middle step that gathers code around the cursor"],"answer":0,"explain":"After context is gathered and the prompt is built, it goes to a proxy server in a GitHub-owned Microsoft Azure tenant. The proxy filters traffic and blocks prompt-hacking attempts. The toxicity filter targets harmful content and personal data, not prompt manipulation.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q13","module":"p1m3","domain":"data","q":"A developer's prompt includes a customer's name, home address, and ID number. In the module's prompt flow, which step is responsible for filtering out this kind of data?","options":["Toxicity filtering","The proxy filter","Fill-in-the-Middle pre-processing","Post-processing code quality checks"],"answer":0,"explain":"The toxicity filtering step blocks hate speech and inappropriate content, and also filters personal data such as names, addresses, and ID numbers. The proxy filter targets attempts to hack or manipulate the system.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q14","module":"p1m3","domain":"data","q":"Copilot suggests code in the middle of a function that fits well with code both above and below the cursor. Which pre-processing technique makes this possible?","options":["Fill-in-the-Middle (FIM)","LoRA fine-tuning","Few-shot prompting","Retrieval from the public code index"],"answer":0,"explain":"During context gathering, Copilot uses Fill-in-the-Middle to consider both the code before and the code after the cursor, which widens the model's view of the context. LoRA is a method for fine-tuning models, not a step that processes each prompt.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q15","module":"p1m3","domain":"data","q":"Which of these happens in Copilot's outbound flow, after the LLM has generated a response but before the developer sees it?","options":["Checks for issues like XSS or SQL injection and the optional public-code filter","Gathering filenames, open tabs, and code from before and after the cursor","Sending the developer's prompt and gathered context to GitHub's servers securely over HTTPS","Applying Fill-in-the-Middle to widen the context the model receives"],"answer":0,"explain":"In post-processing, the toxicity filter removes harmful content, then checks look for code quality and security problems such as XSS or SQL injection, plus the optional public-code filter. A response that fails is truncated or discarded. The other options are inbound steps.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-q16","module":"p1m3","domain":"data","q":"A security officer at a Copilot Business customer asks what happens to code context sent from the IDE to produce inline suggestions. Which statement is accurate?","options":["The prompt is discarded once the suggestion is returned and isn't used to train models","The prompt is kept for 90 days and then used to fine-tune a customer-specific private model","The prompt is stored indefinitely in the repository's audit log for later review","The prompt is shared with the public code index to improve future suggestions"],"answer":0,"explain":"For code suggestions in the editor, Copilot doesn't keep prompts to train the foundational models and discards them once a suggestion is returned. For Business and Enterprise, IDE prompts and suggestions aren't retained by default.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m3-q17","module":"p1m3","domain":"data","q":"GitHub chose LoRA (Low-Rank Adaptation) over full fine-tuning to adapt LLMs. What is LoRA's main advantage?","options":["It adds small trainable parts to each layer and leaves the original model unchanged","It retrains all of the model's parameters on the target dataset for best accuracy","It removes the need for any task-specific training data by relying on prompts alone","It replaces the pretrained model with a smaller one built from scratch"],"answer":0,"explain":"Full fine-tuning trains every part of the network, which is slow and resource-heavy. LoRA adds smaller trainable components to each layer and keeps the original pretrained model as is, which saves time and compute.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/5-github-copilot-large-language-models"},{"id":"p1m4-q01","module":"p1m4","domain":"features","q":"An SRE team keeps asking Copilot the same questions about one payments service and gets inconsistent answers from general chat. They want repeatable, grounded answers based on that service's runbook, config files, and open incidents. What should they do?","options":["Create a Copilot Space with the service's files, issues, and focused instructions","Use repo-wide chat across every organization repository for broader discovery","Paste the full runbook into a brand-new chat conversation each time they ask","Ask Copilot to automatically discover all related content across the organization"],"answer":0,"explain":"Spaces trade breadth for depth: curating a focused set of sources and instructions gives more consistent, reproducible answers on a tightly scoped topic. Broad or org-wide chat favors discovery over precision, and pasting content each time isn't reusable or kept current.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/1-introduction"},{"id":"p1m4-q02","module":"p1m4","domain":"features","q":"The owner of a Space wants Copilot to answer only as a SQL generator that uses the attached schemas, and to avoid unrelated topics. Which part of the Space should they edit?","options":["The Space description shown under the name","The Space instructions","The Space name and its naming prefix","The Space sharing and visibility settings"],"answer":1,"explain":"Instructions are free text describing what Copilot should focus on, which tasks to help with, and what to avoid. The description does not affect Copilot's responses; it only helps people understand the Space's purpose.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-q03","module":"p1m4","domain":"privacy","q":"An organization-owned Space includes files from a private repository. A colleague who has viewer access to the Space but no access to that repository asks a question in the Space. What happens?","options":["The Space grants the colleague temporary read access to the private repository","The colleague sees a cached copy of the private files stored inside the Space","The colleague can only see sources they already have permission to access","A repository admin must approve the colleague before the Space will answer"],"answer":2,"explain":"Spaces follow GitHub's existing permissions and never grant new access; viewers only see sources they are already entitled to. This lets you share a Space widely without exposing private content.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/collaborate-with-others"},{"id":"p1m4-q04","module":"p1m4","domain":"features","q":"A team lead worries that code files attached to a Space will become outdated as developers keep merging changes. What is the correct expectation?","options":["Attached files are snapshots and must be re-attached after every release","GitHub-based sources stay in sync and reflect the latest code on the main branch","Attached files track whichever feature branch the asking user has checked out","Spaces refresh attached files only when the Space owner edits the description"],"answer":1,"explain":"GitHub files and other GitHub-based sources in a Space are updated automatically as they change, and Spaces refer to the latest version of the code on the repository's main (default) branch. They are not static snapshots or branch-aware per user.","source":"https://docs.github.com/en/copilot/concepts/context/spaces"},{"id":"p1m4-q05","module":"p1m4","domain":"prompt","q":"A team wants Copilot to always consider its short API style guide when answering every question in their Space. How should they add the guide?","options":["Attach the whole repository that contains the style guide document","Mention the style guide's filename in the Space description field","Attach the style guide as an individual file in the Space sources","Link the pull request that most recently changed the style guide"],"answer":2,"explain":"When you attach an individual file, its full contents are loaded into the context window and considered for every query. Attaching a whole repository makes Copilot search and retrieve only the content it judges relevant, so the guide might not always be used.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-q06","module":"p1m4","domain":"data","q":"A documentation team attaches an entire large docs repository to a Space so people can ask questions across all of it. How does Copilot use that repository when answering?","options":["It searches the repository and retrieves only the most relevant content","It loads the entire repository into the model context for every question","It reads only the README file at the root of the attached repository","It indexes only files that were changed in the most recent pull request"],"answer":0,"explain":"Attaching a repository doesn't load the whole project into memory; Copilot searches it and retrieves the most relevant content, which suits large-scale use cases such as questions across all documentation. Only individually attached files have their full contents loaded for every query.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-q07","module":"p1m4","domain":"features","q":"In an organization-owned Space, a lead wants several teammates to be able to update the attachments, name, and instructions, but not change who has access or delete the Space. Which role should they assign?","options":["Viewer","Editor","Admin","Owner"],"answer":1,"explain":"Editors can update attachments, description, name, and instructions but can't change sharing settings or delete the Space. Admins can also change sharing and delete; viewers can only ask questions and view content.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/collaborate-with-others"},{"id":"p1m4-q08","module":"p1m4","domain":"features","q":"A developer wants to use the context from a Copilot Space while coding in their IDE. What is required?","options":["Install the separate Copilot Spaces extension from the marketplace and use inline chat","Download the Space as a ZIP file and open it as a workspace folder","Use the GitHub MCP server with the Spaces toolset enabled, in agent mode","Add the Space URL to the repository's custom instructions file"],"answer":2,"explain":"Spaces are accessed in the IDE through the remote GitHub MCP server, and the copilot_spaces toolset must be explicitly enabled because it isn't in the default configuration. Because access is via MCP tools, Spaces can only be used in agent mode.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/use-copilot-spaces"},{"id":"p1m4-q09","module":"p1m4","domain":"features","q":"A developer uses a Space from their IDE through the GitHub MCP server. Copilot uses the Space's instructions and linked issues, but ignores a spreadsheet that was uploaded to the Space. What is the most likely reason?","options":["Spreadsheets must be converted to Markdown before any Space can use them","Uploaded files and repository context aren't supported when using Spaces in the IDE","The developer needs editor rights on the Space to read uploaded files","Uploaded files are only visible to the person who uploaded them, not to other Space members"],"answer":1,"explain":"When using Spaces in your IDE, repository context and uploaded files are not supported; text content, GitHub files, issues, pull requests, and instructions are available. Uploads work in Copilot Chat on GitHub.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/use-copilot-spaces"},{"id":"p1m4-q10","module":"p1m4","domain":"prompt","q":"A Space that started as an onboarding helper now covers onboarding, release management, and incident response. Users see size warnings and increasingly vague answers. What is the best next step?","options":["Add more examples and documents so the model has more material to use","Remove the instructions so Copilot can decide the focus on its own","Reduce sources or split it into smaller Spaces that each do one job","Switch from linked repository files to pasted copies of their content"],"answer":2,"explain":"Model context limits apply, so Spaces should stay small with one job per Space; pruning sources or splitting restores precision. Adding more material makes the context problem worse.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/6-working-guide-space"},{"id":"p1m4-q11","module":"p1m4","domain":"privacy","q":"A Space owner wants Copilot to know the connection details for a staging database, including credentials, so it can write accurate scripts. What is the recommended approach?","options":["Paste the credentials into the Space's free-text notes for convenience","Put the credentials in the Space description so only owners can see them","Keep secrets out of the Space and link reviewed, version-controlled files","Upload the credentials file and set the Space to public view-only"],"answer":2,"explain":"Best practice is not to paste sensitive data into free-text notes; link version-controlled files so normal review and permissions apply. Descriptions and public sharing don't protect secrets.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/3-share-discover-govern"},{"id":"p1m4-q12","module":"p1m4","domain":"features","q":"Who can create and use Copilot Spaces?","options":["Only users on a Copilot Enterprise plan","Only Copilot Business and Enterprise users","Anyone with a Copilot license, including Free","Only organization owners with a paid Copilot plan"],"answer":2,"explain":"Anyone with a Copilot license, including Copilot Free, can create and use Spaces. Questions asked in a Space count as Copilot Chat requests.","source":"https://docs.github.com/en/copilot/concepts/context/spaces"},{"id":"p1m4-q13","module":"p1m4","domain":"prompt","q":"A Space's answers keep drifting away from the format the team wants for incident summaries. Which change is most likely to fix this?","options":["Tighten the instructions and add a few canonical examples of good output","Attach every repository the team owns so Copilot can find more past incident summaries","Make the Space public so more people can give thumbs-up feedback","Rename the Space so its title clearly mentions incident summaries"],"answer":0,"explain":"When responses drift, tighten instructions, add a few high-quality examples of 'good' output, and prune noisy sources. Adding lots of sources adds noise, and the name doesn't change responses.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/6-working-guide-space"},{"id":"p1m5-q01","module":"p1m5","domain":"features","q":"While typing in VS Code, a developer sees greyed-out code appear after the cursor. What is this, and how do they accept it?","options":["A Copilot ghost text suggestion, accepted by pressing Tab","A linter warning preview, accepted by pressing Enter twice","An inline chat response, accepted by pressing Ctrl+I again","A snippet template, accepted by typing a slash command"],"answer":0,"explain":"Ghost text is Copilot's inline suggestion; you can ignore it or press Tab to accept it. It doesn't need a prompt because Copilot uses the code around your cursor as context.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/2-advanced-github-copilot-features"},{"id":"p1m5-q02","module":"p1m5","domain":"features","q":"A developer wants to ask Copilot to rewrite a selected function without switching to the Chat view, and review the change as a diff in place. What should they use?","options":["Quick Chat opened from the title bar menu","Editor inline chat with Ctrl+I (Cmd+I on macOS)","A @workspace mention in the Chat view","The multiple suggestions pane with Ctrl+Enter"],"answer":1,"explain":"Editor inline chat (Ctrl+I / Cmd+I) works inside the editor, scoped to the active file or selection, and shows a diff you can Keep or Undo. It avoids switching context to a separate pane.","source":"https://code.visualstudio.com/docs/chat/inline-chat"},{"id":"p1m5-q03","module":"p1m5","domain":"productivity","q":"A developer selects a newly added API route handler and wants Copilot Chat to generate unit tests for it with the least prompt writing. Which slash command fits?","options":["/explain","/fix","/tests","/help"],"answer":2,"explain":"/tests generates unit tests for the selected code. /explain describes code, /fix proposes fixes for problems, and /help explains how to use Copilot Chat.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-q04","module":"p1m5","domain":"productivity","q":"A developer highlights `contents = file.read` (missing parentheses) and wants Copilot to propose a correction using a built-in intent instead of writing a long prompt. What should they do?","options":["Open inline chat and use /fix on the selection","Open inline chat and use /explain on the selection","Use /tests so the failing test reveals the bug","Type a TODO comment and wait for ghost text"],"answer":0,"explain":"/fix proposes a fix for problems in the selected code; it acts as an implicit, precrafted prompt. /explain only describes the code, and /tests generates tests rather than fixing the bug.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/4-applied-copilot-techniques"},{"id":"p1m5-q05","module":"p1m5","domain":"prompt","q":"What is the main benefit of using slash commands such as /fix, /explain, or /tests in Copilot Chat?","options":["They enforce the team's formatting rules across the entire codebase","They state the intent so you get better results with shorter prompts","They run a security scan before any suggestion is shown to the user","They switch Copilot to a larger model for that single request only"],"answer":1,"explain":"Slash commands give Copilot a specific intent for common tasks, so you get better responses without writing long prompts. They don't change models, format code, or run security scans.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/4-applied-copilot-techniques"},{"id":"p1m5-q06","module":"p1m5","domain":"productivity","q":"A developer using Copilot Chat in Visual Studio wants a built-in command that analyzes the selected method and improves its running time. Which slash command should they use?","options":["/doc","/optimize","/explain","/fix"],"answer":1,"explain":"In Visual Studio, /optimize analyzes and improves the running time of selected code. /doc adds a documentation comment, /explain explains code, and /fix addresses problems rather than performance.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-q07","module":"p1m5","domain":"productivity","q":"In Copilot Chat in Visual Studio, a developer wants to add a documentation comment to the symbol under the cursor. Which slash command is designed for this?","options":["/tests","/optimize","/doc","/help"],"answer":2,"explain":"/doc adds a documentation comment for the symbol. Available slash commands vary by environment; type / in the chat box to see what your IDE supports.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-q08","module":"p1m5","domain":"features","q":"In Copilot Chat in VS Code, which chat participant has context about the integrated terminal shell and its contents, and is used to create or debug terminal commands?","options":["@vscode","@github","@terminal","@workspace"],"answer":2,"explain":"@terminal has context about the terminal shell and its contents. @vscode answers questions about VS Code features and settings and @github gives GitHub-specific skills; neither, nor @workspace, is the terminal participant. Current VS Code docs: @-participants are deprecated and unsupported in the Copilot harness (kept only for the deprecated Local harness). Older material (and possibly the exam): @terminal, @vscode, and @workspace are standard participants.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-q09","module":"p1m5","domain":"features","q":"A developer wants to ask Copilot how to change an editor setting and which VS Code command enables a feature. Which chat participant is intended for this?","options":["@terminal","@vscode","@github","@workspace"],"answer":1,"explain":"@vscode has context about Visual Studio Code commands and features. @terminal focuses on the terminal shell, and @github on GitHub-specific skills. Current VS Code docs mark @-participants deprecated in the Copilot harness (you just ask directly); older material (and possibly the exam) still teaches @vscode for this.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-q10","module":"p1m5","domain":"prompt","q":"In Copilot Chat in VS Code, what does typing `#` in the chat input do?","options":["Starts a slash command, such as a request to generate tests or fix code","Mentions a person on the team so they get a notification","Adds context such as a file, symbol, folder, or tool to the prompt","Changes the model that will be used for the next response"],"answer":2,"explain":"#-mentions explicitly add context items, such as files (#file), the codebase (#codebase), terminal output, or tools like #fetch. Slash commands start with /, and the model picker changes models.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m5-q11","module":"p1m5","domain":"prompt","q":"A developer asks a VS Code agent where authentication is validated in a large repository and adds `#codebase` to the prompt. What does `#codebase` do?","options":["Uploads every file in the workspace into the model's context window","Requests a search across the workspace for the most relevant code","Restricts the answer to the file currently open in the active editor","Fetches the latest version of the repository from GitHub.com first"],"answer":1,"explain":"#codebase asks for a search of relevant code across the workspace; it doesn't add the entire codebase to the model context. For a known file, add it explicitly with a #-mention.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m5-q12","module":"p1m5","domain":"prompt","q":"A developer wants Copilot Chat to explain only the logic in controller.js, even though several other files are open. How should they write the prompt?","options":["Ask a general question and rely on the open tabs for context","Reference the file explicitly, for example #file:controller.js","Start the prompt with @terminal so Copilot reads the file from disk","Add the file name to the repository's README before asking"],"answer":1,"explain":"Scoping the question with a file reference (#file:controller.js) tells Copilot Chat to focus on that file's contents. Attaching important files explicitly is more reliable than relying on which tabs are open.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-across-environments/3-git-hub-copilot-chat"},{"id":"p1m5-q13","module":"p1m5","domain":"prompt","q":"Copilot Chat generated a Dockerfile for a Python project, but it doesn't use a virtual environment as the team requires. What is the best next step?","options":["Accept it and fix the Dockerfile by hand, since Copilot can't adjust it","Rephrase the request, adding the constraint to use a virtual environment","Run /tests on the Dockerfile so Copilot detects the missing environment","Resend the identical question unchanged until a different answer eventually appears"],"answer":1,"explain":"If a suggestion isn't what you want, reword the prompt and be more specific, for example asking for a Dockerfile that uses a Python virtual environment. Adding the constraint is more reliable than retrying the same prompt.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/4-applied-copilot-techniques"},{"id":"p1m5-q14","module":"p1m5","domain":"features","q":"In VS Code chat, a developer wants the agent to research a feature request and propose an implementation plan before it changes any files. Which slash command fits?","options":["/plan","/fork","/compact","/clear"],"answer":0,"explain":"/plan researches the task and proposes a plan before implementation. /fork copies the conversation to explore another approach, /compact summarizes earlier context, and /clear starts a new session.","source":"https://code.visualstudio.com/docs/agents/reference/ai-features-cheat-sheet"},{"id":"p1m5-q15","module":"p1m5","domain":"prompt","q":"A developer wants a VS Code agent to update their app using the latest migration guide published online. How can they bring that web content into the request?","options":["Include the URL or use the #fetch tool in the prompt","Add the URL to the Space description in GitHub","Use @terminal and run curl to download the page","Paste the URL into a code comment and wait for ghost text"],"answer":0,"explain":"You can include a URL directly in the prompt or use #fetch to retrieve web content; VS Code asks for confirmation before accessing external URLs. The other options don't add the page to chat context.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m6-q01","module":"p1m6","domain":"features","q":"In VS Code on Windows, a developer wants to cycle through alternative inline suggestions for the same spot without leaving the editor. Which shortcuts do this?","options":["Alt+] for next and Alt+[ for previous","Ctrl+] for next and Ctrl+[ for previous","Tab for next and Shift+Tab for previous","Ctrl+I for next and Ctrl+Shift+I for previous"],"answer":0,"explain":"On Windows and Linux, Alt+] shows the next suggestion and Alt+[ the previous one (Option/Alt on macOS). Tab accepts a suggestion, and Ctrl+I opens inline chat.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m6-q02","module":"p1m6","domain":"features","q":"None of the first few inline suggestions fit. In VS Code, the developer wants to compare several additional suggestions side by side in a separate tab. What should they press?","options":["Ctrl+Enter","Ctrl+Space","Alt+Enter","Ctrl+Shift+P"],"answer":0,"explain":"Pressing Ctrl+Enter opens a new tab with multiple additional suggestions; you accept one with 'Accept suggestion NUMBER' or close the tab to reject them all.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m6-q03","module":"p1m6","domain":"features","q":"A Copilot suggestion starts correctly but goes wrong halfway through. In VS Code on Windows, how can the developer accept only the next word?","options":["Press Tab, then delete the unwanted part","Press Ctrl+Right Arrow to accept the next word","Press Alt+] until a shorter suggestion appears","Press Esc, then retype the first word manually"],"answer":1,"explain":"Ctrl+Right Arrow (Command+Right Arrow on macOS) accepts the next word of a suggestion. Accepting the next line needs a custom keybinding for editor.action.inlineSuggest.acceptNextLine.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m6-q04","module":"p1m6","domain":"prompt","q":"A developer wants Copilot code completion to produce a sorting function that follows a specific sequence of steps, not just any sort. What is the most effective approach in the editor?","options":["Write comments that describe the algorithm's steps above the function","Name the file sort.py and wait for Copilot to pick an algorithm","Turn off other extensions so Copilot has fewer distractions","Accept the first suggestion and rely on code review to catch changes"],"answer":0,"explain":"Copilot interprets comments as intent; when comments outline an algorithm's steps, it tends to suggest code that follows them. Comments also shape variable names and function implementations.","source":"https://learn.microsoft.com/en-us/training/modules/github-copilot-across-environments/2-code-completion-with-git-hub-copilot"},{"id":"p1m6-q05","module":"p1m6","domain":"features","q":"After renaming a parameter, a developer sees an arrow in the editor gutter pointing to a related line further down that also needs to change. Which Copilot feature is this, and how do they move to it?","options":["Next edit suggestions; press Tab to go to it, then Tab again to accept","Multiple suggestions pane; press Ctrl+Enter to open it in a new tab","Inline chat; press Ctrl+I to ask Copilot to explain the arrow","Code referencing; hover the arrow to view the matching public code"],"answer":0,"explain":"Next edit suggestions predict where and what edits may be needed based on your ongoing changes. A gutter arrow shows an available edit; Tab navigates to it and Tab again accepts.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m6-q06","module":"p1m6","domain":"productivity","q":"A pull request's CI check failed in GitHub Actions. A developer wants Copilot to read the failure and suggest how to fix it, directly from GitHub.com. What should they do?","options":["Re-run the workflow with debug logging and email the logs to Copilot","Use Explain error next to the failed check or on the workflow run page","Add @copilot to the workflow YAML and push a new commit to the branch","Open the repository's Insights tab and generate an Actions usage report"],"answer":1,"explain":"Clicking Explain error next to the failed check in the merge box (or at the top of the workflow run summary) opens Copilot Chat with the failure as context, and Copilot suggests how to resolve it.","source":"https://docs.github.com/en/actions/how-tos/troubleshoot-workflows"},{"id":"p1m6-q07","module":"p1m6","domain":"productivity","q":"A developer has already typed a few notes into a pull request description and then asks Copilot to generate a summary. The summary ignores their notes. Why, and what's the recommended practice?","options":["Copilot ignores existing description text, so start from a blank description","Copilot only reads notes written as Markdown checklists, so reformat the notes","Summaries only use the first commit message, so squash commits before generating","Copilot needs reviewer approval before reading notes, so request a review first"],"answer":0,"explain":"Copilot doesn't take existing content in the PR description into account, so starting with a blank description gives the best results. Always review the generated summary and add context before saving.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/copilot-for-github-tasks/create-a-pr-summary"},{"id":"p1m6-q08","module":"p1m6","domain":"features","q":"A Windows developer wants to install the current GitHub Copilot CLI. Which command is a supported installation method?","options":["gh extension install github/gh-copilot","winget install GitHub.Copilot","pip install github-copilot-cli","dotnet tool install -g copilot"],"answer":1,"explain":"Copilot CLI can be installed with WinGet (winget install GitHub.Copilot), npm (npm install -g @github/copilot), Homebrew, or an install script. The old gh-copilot extension is retired.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/install-copilot-cli"},{"id":"p1m6-q09","module":"p1m6","domain":"features","q":"A team wants a nightly script to run Copilot CLI with one prompt that summarizes the week's commits and then exits without user interaction. Which invocation fits best?","options":["copilot, then type the prompt and use /exit when it finishes","copilot -p \"Summarize this week's commits\" --allow-tool='shell(git)'","copilot --plan \"Summarize this week's commits\" and approve each step","gh copilot suggest \"Summarize this week's commits\" in the script"],"answer":1,"explain":"The -p/--prompt option runs Copilot programmatically: it completes the task and exits. Pre-approving the needed tool (here shell(git)) avoids an approval prompt that nobody is there to answer. Note: the Learn module calls `copilot -i` 'one-shot mode', but per the CLI reference -i starts an interactive session with that prompt; -p is the option that exits when done.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-q10","module":"p1m6","domain":"privacy","q":"During a Copilot CLI session, Copilot asks to run `rm ./build.log` and the developer chooses 'Yes, and approve TOOL for the rest of the running session'. What is the consequence?","options":["Copilot may delete only build.log again without asking during this session","Copilot can run any rm command, such as rm -rf ./*, without asking this session","Copilot will never ask to approve rm again, in this session or in any future session","Copilot must still ask for approval if the rm command targets another file"],"answer":1,"explain":"Option 2 approves the tool, not the exact command, for the rest of the running session, so Copilot can use any rm command without asking. Approval is requested again in new or resumed sessions.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-q11","module":"p1m6","domain":"privacy","q":"A developer wants Copilot CLI to run every tool without prompts except that it must never run `git push` or any `rm` command. Which command does this?","options":["copilot --yolo --allow-tool='shell' --allow-tool='write' --allow-url='github.com'","copilot --allow-all-tools --deny-tool='shell(rm)' --deny-tool='shell(git push)'","copilot --deny-tool='shell(rm)' then answer 'Yes' to every other prompt","copilot --allow-all-urls --available-tools='shell(git push),shell(rm)'"],"answer":1,"explain":"--deny-tool takes precedence over --allow-all-tools and --allow-tool, so combining them blocks rm and git push while auto-approving everything else. For git and gh, you can target a first-level subcommand like 'git push'.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli"},{"id":"p1m6-q12","module":"p1m6","domain":"features","q":"In an interactive Copilot CLI session, a developer wants Copilot to ask clarifying questions and build a structured plan before writing any code for a complex multi-step change. What should they do?","options":["Restart Copilot CLI with -p so it plans and then exits","Press Shift+Tab to switch to plan mode before giving the task","Run /compact so Copilot condenses the task description into a step-by-step plan","Run /context to see a breakdown of the planned steps"],"answer":1,"explain":"Shift+Tab cycles the interactive interface's modes (the CLI reference lists standard, plan, and autopilot). In plan mode Copilot asks clarifying questions and builds a plan before coding (you can also start with --plan or use /plan). /compact and /context manage context, and -p is non-interactive.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-q13","module":"p1m6","domain":"privacy","q":"A new Copilot CLI user plans to always launch `copilot` from their home directory so it can reach all their projects. What is the security guidance?","options":["Fine, because Copilot CLI can only read files and never runs commands","Avoid it; launch from a trusted project directory, not the home directory","Fine, as long as they choose to trust the folder for all future sessions","Avoid it, because Copilot CLI only works inside a cloned Git repository"],"answer":1,"explain":"Copilot CLI may read, modify, and execute files in and below the trusted directory, so you should only launch it from trusted directories and typically not from your home directory. Trusting a folder permanently increases, not reduces, the risk.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-q14","module":"p1m6","domain":"features","q":"A CI job must authenticate Copilot CLI without a browser. Which approach is supported?","options":["Set GITHUB_TOKEN to a classic personal access token with the repo and read:org scopes","Set COPILOT_GITHUB_TOKEN to a fine-grained PAT with the Copilot Requests permission","Run gh copilot auth with an organization-owned fine-grained token","Store the GitHub password in ~/.copilot/config.json before running"],"answer":1,"explain":"Copilot CLI accepts a fine-grained, user-owned PAT with the Copilot Requests permission from COPILOT_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN (in that order). Classic PATs aren't supported, and the permission isn't available on organization-owned tokens.","source":"https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-command-reference"},{"id":"p1m6-q15","module":"p1m6","domain":"privacy","q":"A developer wants to try an agent workflow on an unfamiliar repository without Copilot CLI using their laptop's resources, and wants to check in on it from GitHub Mobile later. What should they use?","options":["Start the session with copilot --cloud to run it in a cloud sandbox","Run /sandbox enable to restrict filesystem and network access locally","Start the session with --allow-all so it finishes without interruptions","Run copilot -p so the session runs in the background after exit"],"answer":0,"explain":"copilot --cloud runs the session in an isolated GitHub-hosted sandbox, so it doesn't use your machine and can be followed and steered from other Copilot clients. /sandbox enable restricts a local session but still runs on your machine.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli","recent":true},{"id":"p1m6-q16","module":"p1m6","domain":"features","q":"A developer wants to run three agent tasks on the same repository at once in the GitHub Copilot app without them overwriting each other's changes. How does the app support this?","options":["It locks the repository so only one session can write at a time","Each session can run in its own Git worktree and branch","It merges all three sessions' edits into one shared branch","It requires a separate clone of the repository for each task"],"answer":1,"explain":"The app runs isolated agent sessions in parallel, each with a dedicated Git worktree and branch, so they don't interfere. The app manages the worktrees for you.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/github-copilot-app"},{"id":"p1m6-q17","module":"p1m6","domain":"features","q":"In the GitHub Copilot app, a developer has a risky, multi-step refactor and wants to review and approve the agent's approach before it changes any code. Which session mode should they choose?","options":["Autopilot","Plan","Interactive","Chats"],"answer":1,"explain":"In Plan mode the agent creates a plan first and you review and approve it before execution. Autopilot works fully autonomously, Interactive collaborates step by step, and Chats is a conversation without a branch or workspace.","source":"https://docs.github.com/en/copilot/how-tos/github-copilot-app/agent-sessions"},{"id":"p1m6-q18","module":"p1m6","domain":"features","q":"A lead wants one place to pick up issues, run several agents in parallel, review diffs, check CI, and merge pull requests without switching between terminal, IDE, and browser. Which Copilot surface is designed for this?","options":["Copilot code completion in the IDE","The GitHub Copilot app","Copilot Chat on GitHub Mobile","Copilot inline chat in the terminal"],"answer":1,"explain":"The GitHub Copilot app is a desktop app for agent-driven development that brings parallel workstreams, GitHub integration, and PR lifecycle management into one place. It complements, not replaces, the IDE, CLI, and GitHub.com.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/github-copilot-app"},{"id":"p1m6-q19","module":"p1m6","domain":"privacy","q":"A developer is tired of approving every safe tool request in Copilot CLI but doesn't want to grant blanket permissions. Which option fits?","options":["Use /permissions assisted so a model auto-approves requests it judges safe","Use /yolo so all tools, paths, and URLs are approved for the session","Start Copilot CLI with --allow-all-tools and review the log afterwards","Use /reset-allowed-tools so prior approvals are applied automatically"],"answer":0,"explain":"Assisted permissions use a model to assess eligible requests and auto-approve those judged safe, while still prompting for other

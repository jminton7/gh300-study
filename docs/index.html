 only to Ruby model files under app/models. What is the right setup?","options":["An app/models/.github/copilot-instructions.md file holding the rules","A .github/instructions/models.instructions.md file with applyTo: \"app/models/**/*.rb\"","A README.md inside app/models that lists the review rules for those files","A branch ruleset that targets the app/models path for Copilot reviews"],"answer":1,"explain":"Path-specific instructions go in .github/instructions/**/*.instructions.md files. The applyTo frontmatter uses a glob to set which files they apply to, and Copilot applies them only when the changed files match. Repository-wide instructions are read only from .github/copilot-instructions.md at the repository root, not from a copy in a subfolder.","source":"https://learn.microsoft.com/en-us/training/modules/code-reviews-pull-requests-github-copilot/4-issues-early-automated-reviews-copilot"},{"id":"p2m4-q07","module":"p2m4","domain":"features","q":"A developer replies to one of Copilot's review comments on GitHub.com, asking it to explain the suggestion further. What happens?","options":["Copilot replies in the thread with a more detailed explanation","Copilot re-runs the whole review using the reply as additional context","The reply is visible to humans, but Copilot doesn't see it or reply","The reply is hidden from everyone except the pull request author"],"answer":2,"explain":"Copilot's review comments behave like human ones, so you can react, resolve, or reply. But comments you add to its review comments aren't visible to Copilot, and it won't reply.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q08","module":"p2m4","domain":"productivity","q":"A developer wants Copilot to catch style and security issues before anything reaches a pull request. What should they do?","options":["Request a Copilot review of their uncommitted changes in the IDE","Open a draft pull request and wait for a human reviewer","Assign the related issue to Copilot cloud agent instead","Add Copilot to CODEOWNERS for the files they are editing"],"answer":0,"explain":"Copilot code review also works in IDEs such as VS Code, Visual Studio, and JetBrains. In VS Code you can review a selection or all uncommitted changes, so issues get fixed before you push.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q09","module":"p2m4","domain":"features","q":"A pull request changes package.json and src/app.js. Copilot's review comments only on src/app.js. What is the most likely reason?","options":["Copilot only reviews files written in TypeScript","Dependency management files like package.json are excluded from review","package.json must be listed in copilot-instructions.md before it is reviewed","Copilot reviews only the first file in each pull request"],"answer":1,"explain":"Some file types are excluded from Copilot code review, including dependency management files such as package.json and Gemfile.lock, log files, and SVG files.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q10","module":"p2m4","domain":"prompt","q":"A pull request from my-feature-branch into main also edits .github/copilot-instructions.md. Which version of the instructions does Copilot code review use?","options":["The version on main, the base branch","The version on my-feature-branch, the head branch","Neither, because instructions only apply after merge","Whichever version was most recently edited"],"answer":1,"explain":"Copilot reads custom instructions, agent instructions, and skills from the head branch, the one with your changes. That lets you test changes to them in the same pull request.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q11","module":"p2m4","domain":"responsible","q":"How should a team position Copilot code review in its process?","options":["As a replacement for human reviewers on all pull requests","As an advisory reviewer that supports human review and sign-off","As the final authority on architecture and design trade-offs","As a substitute for CI tests and code scanning in the pipeline"],"answer":1,"explain":"Copilot isn't guaranteed to catch every problem, and it can make mistakes. Use it to catch issues early, alongside human review, tests, and scanning. Leave architectural decisions and final sign-off to people.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q12","module":"p2m4","domain":"features","q":"An organization on Copilot Business wants members who have no Copilot license to be able to request Copilot code reviews on GitHub.com. Is this possible?","options":["No, only users with a Copilot license can ever use Copilot code review","Yes, once an admin enables paid usage and the policy for unlicensed members","Yes, but only for reviews requested from inside a supported IDE such as VS Code","Yes, because it's enabled for every organization member by default"],"answer":1,"explain":"On Business and Enterprise, an admin can turn on AI credits paid usage and then the policy that lets members without a license use Copilot code review on GitHub.com. That policy is off by default, and the option isn't available in IDEs. (Older material calls the paid-usage setting premium requests paid usage.)","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q13","module":"p2m4","domain":"features","q":"Developers who get Copilot through their organization can't add Copilot as a reviewer on GitHub.com pull requests. What should the organization owner check?","options":["That the Copilot code review option is enabled in Copilot policies","That the MCP servers in Copilot policy is enabled","That every repository has a copilot-setup-steps.yml file","That the developers have also bought personal Pro plans"],"answer":0,"explain":"If you get Copilot from an organization, the organization must enable the Copilot code review option in its Copilot policy settings. This applies to reviews on GitHub.com and GitHub Mobile. The MCP policy controls something else.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q14","module":"p2m4","domain":"productivity","q":"Copilot code review left several useful suggestions on a pull request. Which is a supported way to act on them?","options":["Commit the suggestions, or use Fix with Copilot to have the cloud agent apply them","Thumbs-up each comment so Copilot code review commits the change itself","Close the pull request and open a new one so the suggestions apply automatically","Ask a reviewer to approve, after which the suggestions are committed automatically"],"answer":0,"explain":"You can commit one suggestion or a group of suggestions in a single commit. With Fix with Copilot, the cloud agent implements the feedback as a commit or a new pull request. Thumbs up/down only gives feedback on the comment; Copilot code review never commits changes by itself.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m5-q01","module":"p2m5","domain":"prompt","q":"In a JavaScript file, the comment `// Create an API endpoint` produces a suggestion that uses an unfamiliar framework and an unexpected payload. Which rewrite is most likely to get the code you want?","options":["// Create an API endpoint quickly, and make sure it is really good and works well","// Create an endpoint like the other ones that are somewhere in this project","// Create an Express POST /products endpoint that accepts JSON with name and price","// API endpoint here please, use whatever framework and fields you think best"],"answer":2,"explain":"Vague prompts give Copilot room to pick frameworks and data shapes you don't expect. A specific prompt that names the framework, method, route, and payload makes the goal and scope clear.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m5-q02","module":"p2m5","domain":"features","q":"Copilot shows an inline suggestion as gray ghost text while you type in a .js file. How do you accept the whole suggestion?","options":["Press Tab","Press Esc","Press F1","Press Shift+Delete"],"answer":0,"explain":"Pressing Tab accepts the suggestion, and Esc dismisses it. The docs also describe accepting just the next word, or showing other suggestions with keyboard shortcuts or the hover control.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p2m5-q03","module":"p2m5","domain":"prompt","q":"Inline suggestions in a React component keep ignoring the project's shared utility functions. What simple change is most likely to help?","options":["Open the relevant utility files and close unrelated ones","Rename the component file to use a .txt extension","Turn off syntax highlighting for the workspace","Move all the utility code into one very long comment at the top of the file"],"answer":0,"explain":"For code completions, Copilot uses your open files as extra context. Opening the relevant files and closing unrelated ones helps it understand what you want.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m5-q04","module":"p2m5","domain":"prompt","q":"You want Copilot to build an HTML form that POSTs to /generate and shows the response in a div. Which prompting approach does the module recommend?","options":["Write one very long prompt covering every edge case before writing any code at all","Start with a simple prompt for the form, then add specific prompts for behavior","Avoid prompts and rely only on Copilot guessing from the file name","Keep repeating the same short prompt until the output changes"],"answer":1,"explain":"The module suggests starting simple, for example \"create an HTML form with a text field and button\". Then you add more specific prompts, such as one for the event listener and the POST request. This matches GitHub's advice to start general and then get specific.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m5-q05","module":"p2m5","domain":"prompt","q":"You're not getting the JavaScript output you want from Copilot. Which action does the module recommend?","options":["Uninstall and reinstall the Copilot extension to reset its suggestions","Reword the prompt, or start writing code for Copilot to complete","Switch the file's language mode to plain text so Copilot stops guessing","Accept the suggestion anyway and plan to fix it before release"],"answer":1,"explain":"If you're stuck, reword the prompt or start writing code so Copilot has more to go on. Output quality depends a lot on how well you write the prompt.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m6-q01","module":"p2m6","domain":"prompt","q":"In a .py file, a developer types `# Create a web API using FastAPI with a route to products.` and pauses. What does Copilot do?","options":["Ignores it, because Copilot never uses code comments as prompts in .py files","Treats the comment as a prompt and suggests code you can accept or reject","Scaffolds a new FastAPI project in a separate repository on GitHub","Opens a pull request that contains the generated API and its tests"],"answer":1,"explain":"Copilot treats a natural-language comment in a code file as a prompt. It suggests code, such as a FastAPI app with a /products route, which you can accept or reject.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/2-what-is-github-copilot"},{"id":"p2m6-q02","module":"p2m6","domain":"prompt","q":"Which Python comment prompt is most likely to produce the endpoint a developer actually needs?","options":["# Create an API endpoint for the app that does what the frontend needs it to do","# Make a good endpoint here, using whichever framework and fields seem best","# FastAPI POST endpoint: accept JSON {\"text\": str}, return the text's checksum","# Endpoint please, handle the request and return something useful to the caller"],"answer":2,"explain":"A clear, specific prompt that names the framework, HTTP method, input shape, and expected output tells Copilot the goal and scope. Vague prompts may produce an unfamiliar framework or unexpected data.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/4-use-copilot-with-python"},{"id":"p2m6-q03","module":"p2m6","domain":"productivity","q":"A FastAPI endpoint generated by Copilot crashes on startup because the base64 and os modules aren't imported. What is an efficient fix that keeps the developer accountable?","options":["Ask Copilot Chat to add the missing imports, then review and test the change","Delete the endpoint, because generated code with errors can't be repaired","Ignore the crash, because Copilot will fix it in the next suggestion","Disable error reporting so the application starts and serves requests anyway"],"answer":0,"explain":"In the module exercise, you ask Copilot Chat to add the missing imports, then confirm the endpoint works at /docs. Generated code still needs reviewing and testing.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/5-exercise-python-web-api"},{"id":"p2m6-q04","module":"p2m6","domain":"prompt","q":"A developer wants a Python function that pulls dates in several formats out of a string. Which addition to the prompt will most improve the result?","options":["A request to make the function as short as possible","Example inputs and the exact output expected for each","A note that the code is going into production soon","A list of unrelated functions from elsewhere in the module"],"answer":1,"explain":"Examples help Copilot understand what you want. That includes sample input data, expected outputs, or unit tests written first. A request for short code or a note about production doesn't clarify the expected behavior.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m6-q05","module":"p2m6","domain":"responsible","q":"Copilot generates a Python data-processing function that looks correct at first glance. What should the developer do before relying on it?","options":["Commit it as is, because Copilot output is already validated","Review and test it as they would a colleague's code","Ask Copilot whether it is correct and trust its answer","Only check that the file still passes the formatter"],"answer":1,"explain":"Check AI-generated code the same way you'd check a colleague's work: assess it, test it, and confirm it's correct before relying on it. Asking Copilot to grade its own code isn't validation.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"extra-q01","module":"extra","domain":"features","q":"A developer gets a Copilot Business license from two organizations in the same enterprise. Org A enables Copilot CLI and Org B disables it. The enterprise delegated the policy with \"Let organizations decide\". What happens?","options":["Enabled: within one enterprise the least restrictive setting usually applies","Disabled, because the most restrictive setting wins within an enterprise","Whichever organization is billed for the user's seat that month decides, so access can change monthly","The user must choose a default organization in settings, and only that org's policy is applied"],"answer":0,"explain":"Within one enterprise, the least restrictive policy usually applies, and the policy-conflicts reference lists Copilot CLI as 'least restrictive organization'. 'Most restrictive' is the rule for licenses from multiple different enterprises, plus a few sensitive policies.","source":"https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts"},{"id":"extra-q02","module":"extra","domain":"features","q":"A contractor holds Copilot licenses from two different enterprises. Enterprise X disables Copilot Chat on GitHub.com; Enterprise Y enables it. What is the result for the contractor?","options":["Disabled: across different enterprises the most restrictive policy almost always applies","Enabled, because the least restrictive policy applies whenever a user holds more than one license","The enterprise that assigned its license first takes precedence until that license is removed","The contractor's personal Copilot settings decide, since the two enterprise policies cancel out"],"answer":0,"explain":"When a user has licenses from multiple different enterprises, the most restrictive policy almost always applies; the docs use exactly this Copilot Chat example. The listed exceptions are AI credit paid usage and GitHub Spark. 'Least restrictive' is the usual rule for organizations within one enterprise.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-q03","module":"extra","domain":"features","q":"An enterprise owner sets a Copilot feature policy to \"Disabled\" at the enterprise level. An organization owner wants the feature for one team. What can the organization owner do?","options":["Nothing at org level; an explicit enterprise setting can't be overridden by org owners","Override it in the organization's Copilot policies","Enable it for that one team only, because team-level overrides are allowed under enterprise policies","Commit a repository custom instructions file that re-enables the feature in that team's repositories"],"answer":0,"explain":"If the enterprise owner has explicitly enabled or disabled a policy, organization owners cannot override it. Organizations only control policies the enterprise set to 'Let organizations decide'. Custom instructions guide responses; they don't change policies.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-policies"},{"id":"extra-q04","module":"extra","domain":"features","q":"An enterprise assigns some Copilot licenses directly to users rather than through an organization. Several policies are set to \"Let organizations decide\". Which setting determines those policies for the directly assigned users?","options":["A separate \"Policies for enterprise-assigned users\" setting that sets them to enabled or disabled","The policy of whichever organization the user most recently joined, even if that org didn't grant the license","The user's personal Copilot settings","GitHub's built-in defaults for Copilot Free, since enterprise-assigned users have no organization policy"],"answer":0,"explain":"\"Let organizations decide\" doesn't cover users who get Copilot directly from the enterprise. A separate \"Policies for enterprise-assigned users\" setting decides whether those policies default to enabled or disabled for them.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-q05","module":"extra","domain":"features","q":"An enterprise wants newly released generally available Copilot features to reach users automatically, with organizations unable to switch them off. How should the \"Default policy for new features and clients\" policy be set?","options":["Enabled everywhere","Let organizations decide","Unconfigured","Enabled for selected organizations"],"answer":0,"explain":"With \"Enabled everywhere\", any unconfigured GA feature is turned on for all Copilot users and organizations cannot disable it. \"Let organizations decide\" hands the default to each organization's own setting.","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-q06","module":"extra","domain":"features","q":"An enterprise has enabled the default-availability policies for features and models. A new feature is released in public preview. Which statement is correct?","options":["That policy doesn't apply to features in preview, so it won't auto-enable this preview feature","It is enabled for all users automatically, because the default policy covers every newly released feature","It is enabled automatically, but only for organization owners until it reaches general availability","It is enabled in IDEs only, because preview features are never offered on GitHub.com"],"answer":0,"explain":"The \"Default policy for new features and clients\" applies to newly released and unconfigured generally available (GA) features. It does not apply to features in preview.","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-q07","module":"extra","domain":"features","q":"An admin sets \"Default availability for released models\" to Enabled. A model in pre-release (not GA) becomes available in Copilot. What is its default status for the enterprise?","options":["Disabled by default, because pre-GA models are outside the default availability policy","Enabled automatically, because the policy covers every model that is not explicitly configured","Enabled automatically, but only in Copilot Chat on GitHub.com and not in IDEs","Enabled for organization owners only, until an enterprise owner approves it"],"answer":0,"explain":"Pre-GA models are excluded from the default availability policy and are disabled by default whatever that policy says. The policy only affects GA models labeled \"Delegate to Default Policy\".","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-q08","module":"extra","domain":"features","q":"A security team asks whether disabling a Copilot feature by policy will also take effect in developers' IDEs and Copilot CLI, not just on GitHub.com. What is the accurate answer?","options":["They can apply on any surface where users sign in to Copilot, but not every policy covers every surface","Policies only apply on GitHub.com; IDE and CLI behavior must be set in each tool's local settings files","Every policy applies equally everywhere, so one disabled on GitHub.com is always disabled in IDEs and CLI","They apply to IDEs and GitHub.com, but Copilot CLI ignores organization policies because it runs locally"],"answer":0,"explain":"Policies can apply to IDEs, the GitHub website, and Copilot CLI, but not all policies apply to every surface. GitHub keeps a 'Supported surfaces for GitHub Copilot policies' reference for checking each policy.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-q09","module":"extra","domain":"features","q":"Two organizations in one enterprise license the same user. Org A allows members without a Copilot license to use Copilot code review on GitHub.com; Org B does not. How is this policy resolved?","options":["Most restrictive: one organization disabled it, so it's disabled for the user in all their organizations","Least restrictive: it's enabled, as with most Copilot policies, because one organization enabled it","The organization billed for the user's seat that month decides the setting for both orgs","The enterprise's default for code review applies, and both organization settings are ignored"],"answer":0,"explain":"Most policies resolve to the least restrictive organization, but 'Allow members without a Copilot license to use Copilot code review in GitHub.com' is one of the exceptions that resolve to the most restrictive. The general 'Copilot code review' policy is least restrictive.","source":"https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts"},{"id":"extra-q10","module":"extra","domain":"features","q":"A developer pays for a personal Copilot Pro plan and is then assigned a Copilot Business seat by their employer's organization. What happens to the personal plan?","options":["It's cancelled automatically with a prorated refund; the organization's policies then apply","It stays active, and the user switches between personal and organization policies per repository","It stays active, and its personal policies override the organization's wherever the two conflict","It's paused until the Business seat is removed, then resumes automatically, with no refund issued"],"answer":0,"explain":"When a user with Copilot Pro, Pro+, or Max is assigned a Business or Enterprise seat, the personal plan is cancelled automatically with a prorated refund. That's why personal policies can't conflict with organization or enterprise policies.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-q11","module":"extra","domain":"features","q":"A user is assigned a Copilot Business seat by Org A and a Copilot Enterprise seat by Org B, both in the same enterprise. How is the user billed?","options":["Only the Enterprise seat is billed, and the user gets Copilot Enterprise features","Both seats are billed separately, and the user gets the combined features of both plans","Only the Business seat is billed, because it was the first seat assigned to the user","Both seats are billed, but the user is limited to Copilot Business features until one is removed"],"answer":0,"explain":"If a user has Business and Enterprise seats from different organizations in the same enterprise, only the Enterprise seat is billed and the user gets Enterprise features. A unique user is billed only once per billing cycle within an enterprise.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-q12","module":"extra","domain":"features","q":"A compliance officer wants to know what the GitHub audit log records about Copilot in their enterprise. Which statement is accurate?","options":["Plan changes (policies, settings, licenses) and agent activity on GitHub, but not prompts sent in local clients","Every prompt and suggestion from IDEs and Copilot CLI, so admins can review exactly what each developer asked Copilot","Only billing events such as invoices; policy changes and seat assignments are visible only in the settings UI","Each accepted inline suggestion with its file and line, so admins can trace which code Copilot generated"],"answer":0,"explain":"The audit log covers changes to the Copilot plan (settings, policies, licenses) and agent activity on the GitHub website. It does not include client session data such as prompts sent locally; capturing those needs a custom solution such as hooks.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q13","module":"extra","domain":"features","q":"An enterprise owner wants to search the audit log for every event related to their Copilot plan. Which search term should they use?","options":["action:copilot","actor:Copilot","event:copilot_usage","repo:copilot-settings"],"answer":0,"explain":"The 'action:copilot' search shows all events related to the Copilot plan. 'actor:Copilot' is a different search: it shows activity performed by Copilot agents.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q14","module":"extra","domain":"features","q":"An admin needs to see what actions Copilot agents took on the GitHub website, such as pushes made by an agent. Which audit log search is intended for this?","options":["actor:Copilot","actor:agent","action:copilot.cfb_org_settings_changed","action:copilot.content_exclusion_changed"],"answer":0,"explain":"Use 'actor:Copilot' to view agent activity. The 'action:copilot.*' events record plan changes such as seat assignments, settings changes, and content exclusion updates, not actions taken by agents.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q15","module":"extra","domain":"privacy","q":"An organization owner changes the paths excluded from Copilot in the organization's content exclusion settings. Which audit log event records this?","options":["copilot.content_exclusion_changed","copilot.cfb_seat_management_changed","copilot.plan_changed","copilot.cfb_seat_assignment_refreshed"],"answer":0,"explain":"copilot.content_exclusion_changed is logged when the excluded paths for Copilot are updated, and it includes an excluded_paths field. cfb_seat_management_changed covers who gets Copilot access, not exclusions.","source":"https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise"},{"id":"extra-q16","module":"extra","domain":"features","q":"A user got a Copilot seat automatically after SCIM added them to a team that has Copilot access. Who is shown as the actor on the copilot.cfb_seat_added audit event?","options":["Whoever originally granted Copilot access to that team, not the account that added the new member","The account or integration that added the user to the team, such as the SCIM provisioning identity","The user who received the seat, since team-based seat creation is recorded as self-service","No actor; team-based seat events are logged as anonymous system events"],"answer":0,"explain":"For team-based assignments, copilot.cfb_seat_added credits whoever originally gave the team Copilot access. The actual membership change is recorded correctly on the team.add_member or org.add_member event.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-q17","module":"extra","domain":"features","q":"An enterprise must keep Copilot audit events for three years for compliance. What do GitHub's docs recommend?","options":["Stream the audit log to a SIEM, because the built-in audit log keeps events for 180 days","Increase the audit log retention setting to three years in the enterprise settings","Export the audit log once a year, because the built-in audit log keeps events for 400 days","Enable Copilot Memory, which stores audit events alongside repository facts"],"answer":0,"explain":"The audit log keeps events for the last 180 days. For long-term history and alerts, GitHub recommends streaming the audit log to a SIEM platform rather than relying on built-in retention. Copilot Memory has nothing to do with audit events.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q18","module":"extra","domain":"features","q":"An org owner wants a script that lists everyone the organization is currently billed for in Copilot Business, with each user's last activity. Which REST endpoint fits?","options":["GET /orgs/{org}/copilot/billing/seats","GET /orgs/{org}/copilot/billing","GET /orgs/{org}/members?filter=copilot","GET /orgs/{org}/copilot/metrics/reports/organization-28-day/latest"],"answer":0,"explain":"GET /orgs/{org}/copilot/billing/seats lists billed seats, including last_activity_at and last_activity_editor. GET /orgs/{org}/copilot/billing returns a seat breakdown and settings, not per-user seats.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q19","module":"extra","domain":"features","q":"During automated onboarding, a platform team wants to give Copilot Business seats to a list of specific users through the API. Which endpoint should they call?","options":["POST /orgs/{org}/copilot/billing/selected_users","PUT /orgs/{org}/members/{username}/copilot/seat","POST /orgs/{org}/copilot/billing/seats/bulk_assign","PATCH /orgs/{org}/copilot/billing"],"answer":0,"explain":"POST /orgs/{org}/copilot/billing/selected_users buys a seat for each user listed. The matching endpoint for teams is POST /orgs/{org}/copilot/billing/selected_teams.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q20","module":"extra","domain":"features","q":"An org owner calls DELETE /orgs/{org}/copilot/billing/selected_users for a user whose Copilot seat was assigned to them directly, not through a team. What happens?","options":["The seat is set to pending cancellation; the user keeps access until the billing cycle ends","The user loses Copilot access immediately, and the unused days are refunded to the organization","The seat is deleted at once, and the same call also removes the user from the organization","The request fails, because seats can only be removed on the organization's Copilot settings page"],"answer":0,"explain":"Removing users sets their seats to 'pending cancellation', and they lose access at the end of the current billing cycle (unless they keep access through team membership). If a user's seat was assigned via a team, this call returns a 422 error instead; remove the team with DELETE .../selected_teams.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q21","module":"extra","domain":"features","q":"A seat report shows last_activity_at as null for developers who use Copilot daily in their IDE. What is the most likely cause?","options":["IDE telemetry is turned off; IDE activity only appears in last_activity_at when telemetry is enabled","Their seats are pending cancellation, and pending seats stop reporting activity data until renewed","They use custom instructions, which stop Copilot from recording activity data for those sessions","Content exclusions are configured for their repos, which hides all activity for affected users"],"answer":0,"explain":"The seat endpoints note that users must have telemetry enabled in their IDE for Copilot IDE activity to show up in last_activity_at.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q22","module":"extra","domain":"features","q":"An enterprise analytics team calls the Copilot usage metrics REST endpoints and gets errors, although they have the right role. Which enterprise policy must be configured for these endpoints to work?","options":["The \"Copilot usage metrics\" policy must be set to Enabled everywhere","The \"Default policy for new features and clients\" must be set to Enabled everywhere","The \"Editor preview features\" policy must be enabled for all organizations","The \"Suggestions matching public code\" policy must be set to Allowed"],"answer":0,"explain":"The usage metrics endpoints require the enterprise's \"Copilot usage metrics\" policy to be set to Enabled everywhere. The other policies control feature availability or privacy, not metrics API access. Older material refers to a \"Copilot Metrics API\" access policy for the legacy metrics endpoints; either way it's the metrics policy, not a feature or privacy policy.","source":"https://docs.github.com/en/rest/copilot/copilot-metrics"},{"id":"extra-q23","module":"extra","domain":"features","q":"What does a Copilot usage metrics report endpoint, such as GET /enterprises/{enterprise}/copilot/metrics/reports/enterprise-28-day/latest, return?","options":["Signed, expiring download links to report files, plus the date range covered","A paginated JSON array of every prompt and response sent to Copilot during the period","A CSV of seat assignments with billing amounts for the current billing cycle, per user","A live stream of usage events for the enterprise over a WebSocket connection"],"answer":0,"explain":"The reports endpoints return download_links (signed URLs with a limited lifetime) to report files, plus report_start_day and report_end_day. They provide aggregated usage metrics, not prompts or billing amounts.","source":"https://docs.github.com/en/rest/copilot/copilot-metrics"},{"id":"extra-q24","module":"extra","domain":"prompt","q":"A team wants Copilot to always follow their repository's coding conventions automatically, and separately wants a reusable \"generate a React form\" task that developers run only when needed. What is the best combination?","options":["Conventions in .github/copilot-instructions.md; the task as a .prompt.md in .github/prompts","Put both in .github/copilot-instructions.md so they are automatically available in every chat","Conventions in a .prompt.md file; the task in .github/copilot-instructions.md, run on demand","Put both in AGENTS.md, since that file is only loaded when a developer invokes it manually"],"answer":0,"explain":"Custom instructions apply automatically within their scope. Prompt files (.prompt.md, usually in .github/prompts) are reusable templates you call for one interaction. AGENTS.md is also applied automatically; it isn't invoked on demand.","source":"https://docs.github.com/en/copilot/concepts/prompting-and-context/prompt-files"},{"id":"extra-q25","module":"extra","domain":"prompt","q":"A monorepo has backend Python and frontend TypeScript code with different conventions. The team doesn't want TypeScript guidance cluttering requests about Python files. What should they use?","options":["Path-specific .instructions.md files in .github/instructions with applyTo globs","A single .github/copilot-instructions.md file with separate headings for each language","Separate .prompt.md files that developers must remember to attach to every request","Personal custom instructions configured by each developer on GitHub.com"],"answer":0,"explain":"Path-specific instructions in .github/instructions/**/*.instructions.md use an applyTo glob, so they only apply to matching files. This keeps repository-wide instructions from filling up with guidance meant for other files.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"extra-q26","module":"extra","domain":"features","q":"A team wants a reusable \"security reviewer\" role that can read and search files but has no editing tools, and that they can pick or delegate to. What should they create?","options":["A custom agent profile in .github/agents with a restricted tools list in its frontmatter","An AGENTS.md file in the repository root that describes the reviewer role and lists its allowed tools","A path-specific instructions file with applyTo: \"**\" telling Copilot never to edit any files","A personal instruction on GitHub.com asking Copilot to always act as a security reviewer"],"answer":0,"explain":"Custom agents are Markdown profiles with YAML frontmatter that define a specialist role and can restrict its tools. AGENTS.md only provides instructions and is separate from agent definitions in .github/agents. An instruction saying 'don't edit' doesn't remove any tools.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-custom-agents"},{"id":"extra-q27","module":"extra","domain":"prompt","q":"In Copilot Chat on GitHub.com, a user's personal instructions say \"respond in French\" while the organization's custom instructions say \"respond in English\". Which instruction has higher precedence?","options":["Personal instructions, which rank above repository and organization instructions on GitHub.com","Organization instructions, which always override personal and repository instructions","Repository-wide instructions, which rank above both personal and organization instructions","Neither; Copilot Chat on GitHub.com ignores personal instructions when organization instructions exist"],"answer":0,"explain":"For Copilot Chat on GitHub.com, precedence from highest to lowest is: personal, then repository (path-specific, repository-wide, agent instructions), then organization. All relevant instructions are still provided to the model.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-q28","module":"extra","domain":"features","q":"An organization owner adds organization custom instructions requiring a security checklist. Developers report the instructions are ignored in local IDE chat sessions. Why?","options":["They're only supported on the GitHub website and in Copilot code review, not in local clients","They only take effect after each developer copies them into their own personal instructions","They only apply to members who get their Copilot license from that organization, not other orgs in the enterprise","They must also be committed as AGENTS.md in every repository before IDEs will load them"],"answer":0,"explain":"Organization custom instructions currently work in sessions on the GitHub website (cloud sandboxes or GitHub Actions) and in Copilot code review, not in local client sessions. They apply to all organization members, whichever organization gives them their license.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-q29","module":"extra","domain":"features","q":"During a long agent session, the main conversation is filling with intermediate research output. What is the main benefit of delegating that research to a subagent?","options":["It runs in its own context window and returns a focused result to the main agent","It shares the main agent's context window, so it can reuse the full history at no extra cost","It always uses fewer model requests than the main agent, so delegation lowers total usage","It permanently saves its findings as repository instructions"],"answer":0,"explain":"A subagent does delegated work in a separate context window, so its intermediate steps don't fill the main conversation. Delegation can increase model usage, because each agent makes its own model calls.","source":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"extra-q30","module":"extra","domain":"features","q":"In Copilot CLI, a developer wants the main agent to split a large task into independent subtasks and run them in parallel with subagents. Which slash command is designed for this?","options":["/fleet","/plan","/review","/delegate-all"],"answer":0,"explain":"/fleet has the main agent act as orchestrator: it breaks the work into subtasks and runs independent ones in parallel with subagents. /plan helps shape the breakdown first but doesn't run the subtasks in parallel itself.","source":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"extra-q31","module":"extra","domain":"features","q":"A developer is considering /fleet for a strictly sequential migration, where each step depends on the previous one. What is the most accurate advice?","options":["It may not help with sequential work, and multiple agents can consume more AI credits","It always finishes faster, because subagents share one context window and skip duplicate work","It is required for multi-step work, because the main agent can't carry out dependent steps itself","It reduces AI credit use, because subagents run on cheaper models by default"],"answer":0,"explain":"Parallel delegation helps most when tasks are independent. Each subagent calls the model separately, so /fleet can use more GitHub AI credits and may not help with sequential work.","source":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"extra-q32","module":"extra","domain":"features","q":"In VS Code with the Copilot harness, a developer wants to understand how authentication works in an unfamiliar codebase, with no risk of files being changed. Which built-in agent fits best?","options":["Ask, which only has read-only tools and can't edit files","Agent, with a prompt telling it \"do not change any files\" so it stays read-only","Plan, which edits files in small batches and asks for approval after each change","Autopilot, which works autonomously but skips file edits while it researches"],"answer":0,"explain":"Ask answers questions and researches the codebase with read-only tools only. Telling Agent not to change files guides the model but doesn't change its tools or permissions. Older material describes Ask, Edit and Agent modes; Ask is the read-only choice in both.","source":"https://code.visualstudio.com/docs/agents/run/agent-harnesses"},{"id":"extra-q33","module":"extra","domain":"features","q":"A developer wants Copilot in VS Code to research a cross-cutting change, ask clarifying questions, and produce an implementation plan to review before any code is written. What should they use?","options":["The Plan agent, for example by entering /plan followed by the goal and constraints","The Ask agent, then copy its answer into a prompt file to run later","Inline chat on the main file, since it edits code in place and shows a diff","The Agent agent with Autopilot, so it plans and implements in one step"],"answer":0,"explain":"The Plan agent (/plan) researches the project, asks clarifying questions, and presents a plan to review. You can then implement it, approve it, or reject it. Autopilot carries on autonomously, which skips the review checkpoint.","source":"https://code.visualstudio.com/docs/agents/run/planning"},{"id":"extra-q34","module":"extra","domain":"features","q":"A developer forks a VS Code agent conversation to try an alternative approach, assuming the fork keeps its file changes separate from the original. What is the risk?","options":["The fork shares the original workspace, so both can edit the same files unless worktrees are used","Forking drops the conversation history, so the fork must be re-prompted with every requirement from scratch","Forking automatically creates a new Git branch, so the fork's changes will need a merge back later","Forking makes the original conversation read-only until the fork is closed or merged back into it"],"answer":0,"explain":"A fork keeps the conversation up to the fork point but can share the original session and worktree. Forking isn't a Git branch or separate worktree, so use separate worktrees when changes must stay apart.","source":"https://code.visualstudio.com/docs/agents/concepts/sessions"},{"id":"extra-q35","module":"extra","domain":"features","q":"Copilot Memory stored the fact \"this repository uses Vitest for unit tests\". Who can benefit from this memory?","options":["Eligible users working in that repository; it isn't used in other repositories","Only the user whose session created it, because repository facts are private to their creator","Every member of the organization, across all of its repositories, including private ones","Anyone who forks the repository, because stored memories are copied into each fork"],"answer":0,"explain":"Repository-level facts are shared with eligible collaborators and only apply in that repository. They aren't pooled across an organization's repositories and aren't copied to forks.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-memory"},{"id":"extra-q36","module":"extra","domain":"features","q":"A tech lead wants a rule (\"never call the payment provider directly\") that Copilot applies consistently. Copilot Memory has already learned it. What does GitHub recommend?","options":["Put it in custom instructions; Copilot uses memories by judgment, so they aren't guaranteed","Rely on the memory, because stored repository facts are enforced as hard rules in every session","Ask Copilot to upvote the memory repeatedly until it becomes a permanent, enforced rule","Store it as a user-level preference instead, so it overrides repository settings everywhere"],"answer":0,"explain":"Copilot judges whether a stored fact is still accurate before using it, so a memory shouldn't be treated as a rule that is always followed. GitHub recommends custom instructions for consistent guidance.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-memory"}],"cards":[{"id":"p1m1-c01","module":"p1m1","domain":"responsible","front":"Microsoft/GitHub's six responsible AI principles","back":"Fairness; reliability and safety; privacy and security; inclusiveness; transparency; accountability.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-c02","module":"p1m1","domain":"responsible","front":"Fairness (responsible AI)","back":"AI should treat everyone fairly, giving consistent outcomes to similarly situated people. Ways to mitigate bias include reviewing training data, testing with balanced demographic samples, adversarial debiasing, and monitoring results across user segments.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c03","module":"p1m1","domain":"responsible","front":"Reliability and safety (responsible AI)","back":"AI should work as designed, respond safely to unexpected conditions, and resist harmful manipulation. Safety means minimizing physical, emotional, and financial harm; reliability means consistent behavior without unwanted variability.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c04","module":"p1m1","domain":"responsible","front":"Privacy and security practices from the module","back":"Get consent before collecting data, collect only what's needed, anonymize (pseudonymization or aggregation), and encrypt data in transit and at rest with protected keys (HSMs, secure vaults, envelope encryption).","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c05","module":"p1m1","domain":"responsible","front":"Inclusiveness (responsible AI)","back":"AI should empower and be accessible to everyone, regardless of disability, language, or infrastructure. Examples: screen readers, captions, voice control, regional dialect support, and offline or low-connectivity operation.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c06","module":"p1m1","domain":"responsible","front":"Transparency vs. accountability","back":"Transparency: AI should be understandable, with clear explanations, justified design choices, honesty about limitations, and logging and auditing. Accountability: people, not the AI, are responsible for how the system operates and its impact.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-c07","module":"p1m1","domain":"responsible","front":"Overreliance vs. hallucination","back":"Hallucination: the model produces plausible but false or made-up output. Overreliance: a user accepts incorrect or incomplete AI output, often because mistakes are hard to spot. Human review guards against both.","source":"https://docs.github.com/en/copilot/responsible-use/chat-in-your-ide"},{"id":"p1m1-c08","module":"p1m1","domain":"responsible","front":"Why Copilot quality varies by programming language","back":"Suggestion quality depends on how much varied training data exists for each language. Well-represented languages like JavaScript do best; less common languages may get lower-quality results.","source":"https://docs.github.com/en/copilot/responsible-use/copilot-code-completion"},{"id":"p1m2-c01","module":"p1m2","domain":"features","front":"Who can use Copilot Free?","back":"Individual developers who don't have Copilot access through an organization or enterprise. It offers limited monthly use of a selection of Copilot features, such as inline suggestions and chat, at no cost.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c02","module":"p1m2","domain":"features","front":"Free Copilot access for students, teachers, and OSS maintainers","back":"Verified students can get Copilot Student at no cost (older material says students get free Copilot Pro). Verified teachers and maintainers of popular open source projects may be eligible for free Copilot Pro.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c03","module":"p1m2","domain":"features","front":"Copilot Business vs. Copilot Enterprise","back":"Business: for organizations and enterprises, with centralized management, policy control, and content exclusion. Enterprise: for enterprises on GitHub Enterprise Cloud, with all Business features plus a larger monthly usage allowance (AI credits; older material: premium requests) and extra enterprise capabilities.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m2-c04","module":"p1m2","domain":"features","front":"Inline suggestion keys (VS Code, Windows)","back":"Tab = accept, Esc = reject, Alt+] / Alt+[ = next/previous alternative (Option on macOS), Ctrl+Enter = open a tab with multiple suggestions.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m2-c05","module":"p1m2","domain":"features","front":"Common Copilot Chat slash commands (VS Code)","back":"/explain (explain code), /fix (propose a fix), /tests (generate unit tests), /fixTestFailure, /new (new project), /clear (new chat session), /help. Type / to see what's available.","source":"https://docs.github.com/en/copilot/reference/chat-cheat-sheet"},{"id":"p1m2-c06","module":"p1m2","domain":"privacy","front":"Where to find Copilot logs in VS Code","back":"View > Output, then choose GitHub Copilot in the dropdown. Or run 'Developer: Open Extension Logs Folder' to collect files for support. For more detail, set the log level to Trace with 'Developer: Set Log Level'.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/view-logs"},{"id":"p1m2-c07","module":"p1m2","domain":"privacy","front":"Copilot proxy support limits","back":"Copilot uses its own proxy code. Proxy URLs starting with https:// aren't supported. Proxy authentication works with basic auth or Kerberos. Corporate proxies may also need company-level allowlisting.","source":"https://docs.github.com/en/copilot/how-tos/troubleshoot-copilot/troubleshoot-network-errors"},{"id":"p1m2-c08","module":"p1m2","domain":"privacy","front":"Code references for public-code matches (VS Code)","back":"If suggestions matching public code are allowed, accepting one adds an entry to the 'GitHub Copilot Log (Code References)' output, with the matching file URL and license (if found).","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/find-matching-code"},{"id":"p1m3-c01","module":"p1m3","domain":"prompt","front":"The 4 S's of prompt engineering","back":"Single (one well-defined task), Specific (explicit, detailed instructions), Short (concise), Surround (descriptive file names and related files open for context).","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c02","module":"p1m3","domain":"prompt","front":"Zero-shot vs. one-shot vs. few-shot","back":"Zero-shot: no examples, relies on the model's training (good for common patterns). One-shot: one example to copy conventions. Few-shot: several examples to handle multiple scenarios and edge cases.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c03","module":"p1m3","domain":"prompt","front":"Role prompting","back":"Tell Copilot to act as a specific expert (security, performance, testing) to bring domain expertise into the first draft, e.g. 'Act as a cybersecurity expert...'.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c04","module":"p1m3","domain":"prompt","front":"Managing chat history","back":"Long histories add irrelevant context and cost more to process. Start a new conversation for a new task, summarize the relevant context, and refer to earlier work briefly instead of repeating it.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/2-prompt-engineering-foundations-best-practices"},{"id":"p1m3-c05","module":"p1m3","domain":"prompt","front":"Where to put key requirements in a prompt","back":"Start with the broad goal, then list specifics with the most important first. Copilot gives extra weight to the beginning and end of a prompt.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p1m3-c06","module":"p1m3","domain":"data","front":"Inbound prompt flow (order)","back":"1) Prompt sent securely over HTTPS and context gathered (cursor code, file name and type, open tabs, project structure, languages, FIM). 2) Proxy filter. 3) Toxicity filter. 4) LLM generates code.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c07","module":"p1m3","domain":"data","front":"Proxy filter (Copilot prompt flow)","back":"A proxy server in a GitHub-owned Microsoft Azure tenant that filters traffic and blocks attempts to hack the prompt or extract details about how the model generates suggestions.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c08","module":"p1m3","domain":"data","front":"Toxicity filter and outbound post-processing","back":"The toxicity filter blocks hate speech, inappropriate content, and personal data. On the outbound side, it removes harmful generated content, then checks look for code quality and security problems (e.g. XSS, SQL injection) and apply the optional public-code filter. Failing output is truncated or discarded.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c09","module":"p1m3","domain":"data","front":"Fill-in-the-Middle (FIM)","back":"A pre-processing technique where Copilot considers code both before and after the cursor, so suggestions fit their surroundings.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/3-github-copilot-user-prompt-process-flow"},{"id":"p1m3-c10","module":"p1m3","domain":"data","front":"Fine-tuning vs. LoRA","back":"Fine-tuning adapts a pretrained model with a smaller task-specific dataset. LoRA (Low-Rank Adaptation) adds small trainable parts to each layer and leaves the original model unchanged, which saves time and resources.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/5-github-copilot-large-language-models"},{"id":"p1m3-c11","module":"p1m3","domain":"data","front":"Context window limits: what to do","back":"The model can only process a limited amount of code and text at once. Break complex problems into smaller, focused prompts and include only the relevant code snippets.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m4-c01","module":"p1m4","domain":"features","front":"Copilot Space","back":"A Copilot chat grounded in curated context you choose (repos, files, PRs, issues, notes, uploads, instructions). Gives more consistent answers on a tightly scoped topic than general chat.","source":"https://docs.github.com/en/copilot/concepts/context/spaces"},{"id":"p1m4-c02","module":"p1m4","domain":"features","front":"Two kinds of context in a Space","back":"Instructions (free text: focus, tasks, what to avoid) and Sources (files/folders/repos, linked PRs and issues, uploaded files, pasted text). The description doesn't affect responses.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-c03","module":"p1m4","domain":"data","front":"Space: attach a repository vs an individual file","back":"Repository: Copilot searches it and retrieves only the most relevant content (good for large docs sets). File: full contents loaded into context for every query (good for a must-use guide).","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/create-copilot-spaces"},{"id":"p1m4-c04","module":"p1m4","domain":"features","front":"Organization-owned Space roles","back":"Viewer: ask questions and view content. Editor: also change sources, name, description, instructions. Admin: also change sharing and delete. 'No access' hides the Space from org members.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/collaborate-with-others"},{"id":"p1m4-c05","module":"p1m4","domain":"privacy","front":"Spaces and permissions","back":"A Space never grants new access. Viewers only see sources they already have permission for. Public personal Spaces are view-only by default.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/copilot-spaces/collaborate-with-others"},{"id":"p1m4-c06","module":"p1m4","domain":"features","front":"Using a Space from your IDE","back":"Through the remote GitHub MCP server with the copilot_spaces toolset enabled, in agent mode only. Repository context and uploaded files aren't supported there.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/customize-copilot/extend-copilot-with-tools-and-context/use-copilot-spaces"},{"id":"p1m4-c07","module":"p1m4","domain":"features","front":"Space freshness","back":"GitHub-based sources update automatically and reflect the latest code on the main branch. For a branch-specific or historical view, narrow the files or add a text snapshot of the exact content.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/3-share-discover-govern"},{"id":"p1m4-c08","module":"p1m4","domain":"prompt","front":"Space governance best practices","back":"One job per Space, a clear purpose-driven name, a named owner, a 'How to use this Space' note, 1–3 canonical examples, and a regular review cadence. Split the Space when it sprawls.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-spaces/3-share-discover-govern"},{"id":"p1m4-c09","module":"p1m4","domain":"features","front":"Who can use Copilot Spaces, and where","back":"Anyone with a Copilot license, including Free. Use them in Copilot Chat on GitHub, or in the IDE through the GitHub MCP server. Questions count as Copilot Chat requests.","source":"https://docs.github.com/en/copilot/concepts/context/spaces"},{"id":"p1m5-c01","module":"p1m5","domain":"features","front":"Ghost text","back":"Copilot's greyed-out inline suggestion. Press Tab to accept, Esc to dismiss, or keep typing to ignore it.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/2-advanced-github-copilot-features"},{"id":"p1m5-c02","module":"p1m5","domain":"features","front":"Inline chat (VS Code)","back":"Ctrl+I (Cmd+I on macOS). Chat inside the editor, scoped to the active file or selection, with a diff you can Keep or Undo. Also works in the terminal for shell commands.","source":"https://code.visualstudio.com/docs/chat/inline-chat"},{"id":"p1m5-c03","module":"p1m5","domain":"prompt","front":"Slash commands","back":"Shortcuts that tell Copilot your intent for common tasks, so you need shorter prompts. Type / to see the commands available in your environment.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c04","module":"p1m5","domain":"productivity","front":"/explain, /fix, /tests","back":"/explain: explain how the selected or active code works. /fix: propose a fix for problems in the selection. /tests: generate unit tests for the selected code.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c05","module":"p1m5","domain":"productivity","front":"/doc and /optimize (Visual Studio)","back":"/doc adds a documentation comment for the symbol. /optimize analyzes and improves the running time of the selected code.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c06","module":"p1m5","domain":"features","front":"Chat participants (@)","back":"Domain experts invoked with @, such as @terminal (terminal shell), @vscode (VS Code features), @github (GitHub skills). Current VS Code docs mark them deprecated in the Copilot harness.","source":"https://docs.github.com/en/copilot/reference/cheat-sheet"},{"id":"p1m5-c07","module":"p1m5","domain":"prompt","front":"Chat variables / #-mentions","back":"Type # to add explicit context: #file, #selection, #codebase, terminal output, or tools such as #fetch.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m5-c08","module":"p1m5","domain":"prompt","front":"#codebase","back":"Requests a search of the workspace for relevant code. It does NOT load the whole codebase into the model context.","source":"https://code.visualstudio.com/docs/chat/copilot-chat-context"},{"id":"p1m5-c09","module":"p1m5","domain":"features","front":"/plan in VS Code chat","back":"Researches the task and proposes a plan before implementation. Other current VS Code slash commands include /compact (summarize context) and /fork (copy the conversation).","source":"https://code.visualstudio.com/docs/agents/reference/ai-features-cheat-sheet"},{"id":"p1m5-c10","module":"p1m5","domain":"prompt","front":"Implicit prompts","back":"Features like slash commands provide a precrafted prompt (for example, select code and use /fix in inline chat), so you get good results without writing a long prompt.","source":"https://learn.microsoft.com/en-us/training/modules/advanced-github-copilot/4-applied-copilot-techniques"},{"id":"p1m6-c01","module":"p1m6","domain":"features","front":"Alternative inline suggestions (VS Code)","back":"Alt+] next, Alt+[ previous (Option/Alt on macOS). Ctrl+Enter opens multiple suggestions in a new tab. Ctrl+Right Arrow accepts the next word.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p1m6-c02","module":"p1m6","domain":"features","front":"Installing Copilot CLI","back":"npm install -g @github/copilot (Node.js 22+), winget install GitHub.Copilot, brew install --cask copilot-cli, or the install script. Run with `copilot`; use /login on first launch.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/install-copilot-cli"},{"id":"p1m6-c03","module":"p1m6","domain":"features","front":"Copilot CLI: interactive vs programmatic","back":"`copilot` starts an interactive session. `copilot -p \"PROMPT\"` runs one prompt and exits; add approval flags such as --allow-tool so it can modify or execute files unattended. (`copilot -i \"PROMPT\"` starts an interactive session with that prompt; it does not exit.)","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-c04","module":"p1m6","domain":"features","front":"Copilot CLI plan mode","back":"Press Shift+Tab (or start with --plan, or use /plan). Copilot asks clarifying questions and builds a structured plan before writing any code.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m6-c05","module":"p1m6","domain":"privacy","front":"Copilot CLI tool approval flags","back":"--allow-all-tools, --allow-tool='shell(CMD)' / 'write' / 'MCP_SERVER(tool)', and --deny-tool, which always takes precedence. --allow-all (alias --yolo) also allows all paths and URLs.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli"},{"id":"p1m6-c06","module":"p1m6","domain":"privacy","front":"Copilot CLI trusted directories","back":"On launch you confirm trust for the current folder and everything below it, for this session or permanently. Launch only from trusted project folders, typically not your home directory.","source":"https://docs.github.com/en/copilot/how-tos/copilot-cli/set-up-copilot-cli/configure-copilot-cli"},{"id":"p1m6-c07","module":"p1m6","domain":"privacy","front":"Copilot CLI local vs cloud sandbox","back":"/sandbox enable restricts filesystem, network, and system access on your machine. copilot --cloud runs the whole session in an isolated GitHub-hosted environment you can steer from other clients.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli","recent":true},{"id":"p1m6-c08","module":"p1m6","domain":"features","front":"GitHub Copilot app","back":"A desktop app (macOS, Windows, Linux) built on Copilot CLI. It runs parallel agent sessions in their own worktrees and branches and handles the PR lifecycle. It has its own policy, separate from the CLI policy.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/github-copilot-app"},{"id":"p1m6-c09","module":"p1m6","domain":"features","front":"Copilot app session modes","back":"Interactive: collaborates and waits for your input. Plan: plans first, then you approve. Autopilot: works fully autonomously. Tool permissions are separate: Ask every time, Assisted, or Approve all.","source":"https://docs.github.com/en/copilot/how-tos/github-copilot-app/agent-sessions"},{"id":"p1m6-c10","module":"p1m6","domain":"productivity","front":"Explain error (GitHub Actions)","back":"On a failed check in the PR merge box or the workflow run page, click Explain error. Copilot Chat opens with the failure as context and suggests a fix.","source":"https://docs.github.com/en/actions/how-tos/troubleshoot-workflows"},{"id":"p1m6-c11","module":"p1m6","domain":"features","front":"Copilot CLI context management","back":"Copilot CLI auto-compacts history as you near the token limit. /compact compresses manually, and /context shows a token usage breakdown.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m7-c01","module":"p1m7","domain":"privacy","front":"Content exclusion: effects","back":"No inline suggestions in excluded files. Their content doesn't inform suggestions in other files or Copilot responses, and Copilot code review doesn't review them.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-c02","module":"p1m7","domain":"privacy","front":"Who can configure content exclusion?","back":"Repository administrators (their repos), organization owners (users with seats from that org), and enterprise owners (all Copilot users in the enterprise).","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-c03","module":"p1m7","domain":"privacy","front":"Content exclusion limitations","back":"It isn't a filesystem security boundary and isn't guaranteed for third-party MCP servers or clients. It doesn't apply to symlinks or remote filesystems, and the IDE may still pass semantic info such as types.","source":"https://docs.github.com/en/copilot/concepts/context/content-exclusion"},{"id":"p1m7-c04","module":"p1m7","domain":"privacy","front":"Content exclusion change not taking effect in the IDE","back":"It can take up to 30 minutes. To apply it now: in VS Code run Developer: Reload Window; in JetBrains or Visual Studio, close and reopen the app. Vim/Neovim fetches exclusions each time a file opens.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-c05","module":"p1m7","domain":"privacy","front":"Content exclusion path syntax","back":"fnmatch patterns that are case insensitive. Repo settings use - \"/path\". Org/enterprise settings use REPO-REFERENCE: plus paths, or \"*\": for files anywhere, including outside Git.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/exclude-content-from-copilot"},{"id":"p1m7-c06","module":"p1m7","domain":"privacy","front":"Auditing content exclusion changes","back":"Look for the copilot.content_exclusion_changed audit log action. The entry details show excluded_paths after the change.","source":"https://docs.github.com/en/copilot/how-tos/configure-content-exclusion/review-changes"},{"id":"p1m7-c07","module":"p1m7","domain":"privacy","front":"Public code filter (Block)","back":"Checks suggestions plus about 150 characters of surrounding code against public code on GitHub and hides matches or near matches. Org-assigned users inherit the setting.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m7-c08","module":"p1m7","domain":"privacy","front":"Code referencing","back":"When matches are allowed, Copilot shows matching public repos and licenses (in VS Code: Output > GitHub Copilot Log (Code References)). The index excludes private repos and code outside GitHub.","source":"https://docs.github.com/en/copilot/concepts/copilot-surfaces/copilot-in-ides"},{"id":"p1m7-c09","module":"p1m7","domain":"privacy","front":"Block mode and agents","back":"Copilot cloud agent and Copilot CLI may still generate code matching public code even when the policy is Block. The cloud agent shows matches in session logs.","source":"https://docs.github.com/en/copilot/responsible-use/agents"},{"id":"p1m7-c10","module":"p1m7","domain":"features","front":"Business/Enterprise-only management features","back":"Content exclusion, organization-wide policy management, and organization custom instructions. All plans can block suggestions matching public code.","source":"https://docs.github.com/en/copilot/get-started/plans"},{"id":"p1m7-c11","module":"p1m7","domain":"features","front":"Policy conflicts across licenses","back":"Same enterprise, several orgs: the least restrictive usually applies. Several enterprises: the most restrictive almost always applies. Orgs can't override an enterprise-selected policy.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"p1m7-c12","module":"p1m7","domain":"privacy","front":"Business/Enterprise data and model training","back":"GitHub doesn't use Copilot Business or Enterprise customer data to train AI models. It's protected under GitHub's Data Protection Agreement.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m7-c13","module":"p1m7","domain":"privacy","front":"\"Could not connect to server. Extension activation failed\"","back":"No Copilot plan, or the token request to the GitHub API failed. Sign out of Copilot in the IDE and sign back in.","source":"https://docs.github.com/en/copilot/troubleshooting-github-copilot/troubleshooting-common-issues-with-github-copilot"},{"id":"p1m8-c01","module":"p1m8","domain":"productivity","front":"Three Copilot usage metrics dashboards","back":"Usage metrics (adoption and engagement), code generation (code from users and agents), and impact (adoption depth vs. PR output and time to merge).","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c02","module":"p1m8","domain":"productivity","front":"Metric categories in Copilot usage metrics","back":"Adoption, engagement, acceptance rate, lines of code, and pull request lifecycle. Look at patterns together with developer feedback, not one number.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c03","module":"p1m8","domain":"productivity","front":"Usage metrics caveats","back":"Not a complete record of all activity. Don't add org totals together (users overlap). They measure activity, not licenses; use the user management API for seats.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c04","module":"p1m8","domain":"productivity","front":"Custom reporting on Copilot usage","back":"Use the Copilot usage metrics REST APIs and NDJSON exports for enterprise and org reports with repository- and user-level detail.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m8-c05","module":"p1m8","domain":"productivity","front":"Key Copilot limitations","back":"Possible bugs and insecure code, misread context, weaker results for niche or new technologies, bias from training data, and limited grasp of high-level architecture.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-c06","module":"p1m8","domain":"productivity","front":"Copilot across the SDLC","back":"Requirements: prototypes and API sketches. Development: boilerplate and patterns. Testing: tests, data, and edge cases. Deployment: config and scripts. Maintenance: bug fixes, refactoring, and explaining legacy code.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/4-ai-software-development-lifecycle"},{"id":"p1m8-c07","module":"p1m8","domain":"productivity","front":"Copilot developer survey: short vs long form","back":"Short-form: quick satisfaction and time-saved feedback, up to every two weeks. Long-form: deeper impact, no more than once every four weeks. Anonymize responses.","source":"https://learn.microsoft.com/en-us/training/modules/developer-use-cases-for-ai-with-github-copilot/5-understand-limitations-measure-impact"},{"id":"p1m8-c08","module":"p1m8","domain":"productivity","front":"Impact dashboard comparisons","back":"They show associations, not proof that adoption caused productivity changes. Team composition, complexity, and experience also affect results.","source":"https://docs.github.com/en/copilot/concepts/copilot-usage-metrics/copilot-metrics"},{"id":"p1m9-c01","module":"p1m9","domain":"productivity","front":"/tests vs /fixTestFailure vs /setupTests","back":"/tests: generate unit tests for selected code. /fixTestFailure: find and fix a failing test. /setupTests: recommend and configure a test framework.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/3-generate-unit-tests-chat-view"},{"id":"p1m9-c02","module":"p1m9","domain":"productivity","front":"Ask vs Plan vs Agent for testing","back":"Ask: read-only exploration of edge cases. Plan: reviewable multi-file test strategy. Agent: writes, runs, and iterates on tests autonomously.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/4-plan-automate-tests-using-agents"},{"id":"p1m9-c03","module":"p1m9","domain":"productivity","front":"Fix Test Failure in Test Explorer","back":"Hover over a failed test and select the sparkle button. Copilot proposes a fix to test or app code; review it and rerun the test.","source":"https://code.visualstudio.com/docs/agents/guides/test-code-with-ai"},{"id":"p1m9-c04","module":"p1m9","domain":"productivity","front":"Ghost text for tests","back":"Best for adding more cases to a test file that already shows the pattern. Start with a descriptive comment or test name, then press Tab to accept.","source":"https://learn.microsoft.com/en-us/training/modules/develop-unit-tests-using-github-copilot-tools/5-extend-fix-tests-using-github-copilot"},{"id":"p1m9-c05","module":"p1m9","domain":"productivity","front":"Rules for reviewing AI-generated tests","back":"Keep expected values independent of the code under test. Don't weaken assertions or skip tests jus

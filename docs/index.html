 only to Ruby model files under app/models. What is the right setup?","options":["An app/models/.github/copilot-instructions.md file holding the rules","A .github/instructions/models.instructions.md file with applyTo: \"app/models/**/*.rb\"","A README.md inside app/models that lists the review rules for those files","A branch ruleset that targets the app/models path for Copilot reviews"],"answer":1,"explain":"Path-specific instructions go in .github/instructions/**/*.instructions.md files. The applyTo frontmatter uses a glob to set which files they apply to, and Copilot applies them only when the changed files match. Repository-wide instructions are read only from .github/copilot-instructions.md at the repository root, not from a copy in a subfolder.","source":"https://learn.microsoft.com/en-us/training/modules/code-reviews-pull-requests-github-copilot/4-issues-early-automated-reviews-copilot"},{"id":"p2m4-q07","module":"p2m4","domain":"features","q":"A developer replies to one of Copilot's review comments on GitHub.com, asking it to explain the suggestion further. What happens?","options":["Copilot replies in the thread with a more detailed explanation","Copilot re-runs the whole review using the reply as additional context","The reply is visible to humans, but Copilot doesn't see it or reply","The reply is hidden from everyone except the pull request author"],"answer":2,"explain":"Copilot's review comments behave like human ones, so you can react, resolve, or reply. But comments you add to its review comments aren't visible to Copilot, and it won't reply.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q08","module":"p2m4","domain":"productivity","q":"A developer wants Copilot to catch style and security issues before anything reaches a pull request. What should they do?","options":["Request a Copilot review of their uncommitted changes in the IDE","Open a draft pull request and wait for a human reviewer","Assign the related issue to Copilot cloud agent instead","Add Copilot to CODEOWNERS for the files they are editing"],"answer":0,"explain":"Copilot code review also works in IDEs such as VS Code, Visual Studio, and JetBrains. In VS Code you can review a selection or all uncommitted changes, so issues get fixed before you push.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q09","module":"p2m4","domain":"features","q":"A pull request changes package.json and src/app.js. Copilot's review comments only on src/app.js. What is the most likely reason?","options":["Copilot only reviews files written in TypeScript","Dependency management files like package.json are excluded from review","package.json must be listed in copilot-instructions.md before it is reviewed","Copilot reviews only the first file in each pull request"],"answer":1,"explain":"Some file types are excluded from Copilot code review, including dependency management files such as package.json and Gemfile.lock, log files, and SVG files.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q10","module":"p2m4","domain":"prompt","q":"A pull request from my-feature-branch into main also edits .github/copilot-instructions.md. Which version of the instructions does Copilot code review use?","options":["The version on main, the base branch","The version on my-feature-branch, the head branch","Neither, because instructions only apply after merge","Whichever version was most recently edited"],"answer":1,"explain":"Copilot reads custom instructions, agent instructions, and skills from the head branch, the one with your changes. That lets you test changes to them in the same pull request.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m4-q11","module":"p2m4","domain":"responsible","q":"How should a team position Copilot code review in its process?","options":["As a replacement for human reviewers on all pull requests","As an advisory reviewer that supports human review and sign-off","As the final authority on architecture and design trade-offs","As a substitute for CI tests and code scanning in the pipeline"],"answer":1,"explain":"Copilot isn't guaranteed to catch every problem, and it can make mistakes. Use it to catch issues early, alongside human review, tests, and scanning. Leave architectural decisions and final sign-off to people.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q12","module":"p2m4","domain":"features","q":"An organization on Copilot Business wants members who have no Copilot license to be able to request Copilot code reviews on GitHub.com. Is this possible?","options":["No, only users with a Copilot license can ever use Copilot code review","Yes, once an admin enables paid usage and the policy for unlicensed members","Yes, but only for reviews requested from inside a supported IDE such as VS Code","Yes, because it's enabled for every organization member by default"],"answer":1,"explain":"On Business and Enterprise, an admin can turn on AI credits paid usage and then the policy that lets members without a license use Copilot code review on GitHub.com. That policy is off by default, and the option isn't available in IDEs. (Older material calls the paid-usage setting premium requests paid usage.)","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q13","module":"p2m4","domain":"features","q":"Developers who get Copilot through their organization can't add Copilot as a reviewer on GitHub.com pull requests. What should the organization owner check?","options":["That the Copilot code review option is enabled in Copilot policies","That the MCP servers in Copilot policy is enabled","That every repository has a copilot-setup-steps.yml file","That the developers have also bought personal Pro plans"],"answer":0,"explain":"If you get Copilot from an organization, the organization must enable the Copilot code review option in its Copilot policy settings. This applies to reviews on GitHub.com and GitHub Mobile. The MCP policy controls something else.","source":"https://docs.github.com/en/copilot/concepts/agents/code-review"},{"id":"p2m4-q14","module":"p2m4","domain":"productivity","q":"Copilot code review left several useful suggestions on a pull request. Which is a supported way to act on them?","options":["Commit the suggestions, or use Fix with Copilot to have the cloud agent apply them","Thumbs-up each comment so Copilot code review commits the change itself","Close the pull request and open a new one so the suggestions apply automatically","Ask a reviewer to approve, after which the suggestions are committed automatically"],"answer":0,"explain":"You can commit one suggestion or a group of suggestions in a single commit. With Fix with Copilot, the cloud agent implements the feedback as a commit or a new pull request. Thumbs up/down only gives feedback on the comment; Copilot code review never commits changes by itself.","source":"https://docs.github.com/en/copilot/how-tos/use-copilot-agents/request-a-code-review/use-code-review"},{"id":"p2m5-q01","module":"p2m5","domain":"prompt","q":"In a JavaScript file, the comment `// Create an API endpoint` produces a suggestion that uses an unfamiliar framework and an unexpected payload. Which rewrite is most likely to get the code you want?","options":["// Create an API endpoint quickly, and make sure it is really good and works well","// Create an endpoint like the other ones that are somewhere in this project","// Create an Express POST /products endpoint that accepts JSON with name and price","// API endpoint here please, use whatever framework and fields you think best"],"answer":2,"explain":"Vague prompts give Copilot room to pick frameworks and data shapes you don't expect. A specific prompt that names the framework, method, route, and payload makes the goal and scope clear.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m5-q02","module":"p2m5","domain":"features","q":"Copilot shows an inline suggestion as gray ghost text while you type in a .js file. How do you accept the whole suggestion?","options":["Press Tab","Press Esc","Press F1","Press Shift+Delete"],"answer":0,"explain":"Pressing Tab accepts the suggestion, and Esc dismisses it. The docs also describe accepting just the next word, or showing other suggestions with keyboard shortcuts or the hover control.","source":"https://docs.github.com/en/copilot/how-tos/copilot-in-your-ide/copilot-for-common-tasks/get-ide-code-suggestions"},{"id":"p2m5-q03","module":"p2m5","domain":"prompt","q":"Inline suggestions in a React component keep ignoring the project's shared utility functions. What simple change is most likely to help?","options":["Open the relevant utility files and close unrelated ones","Rename the component file to use a .txt extension","Turn off syntax highlighting for the workspace","Move all the utility code into one very long comment at the top of the file"],"answer":0,"explain":"For code completions, Copilot uses your open files as extra context. Opening the relevant files and closing unrelated ones helps it understand what you want.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m5-q04","module":"p2m5","domain":"prompt","q":"You want Copilot to build an HTML form that POSTs to /generate and shows the response in a div. Which prompting approach does the module recommend?","options":["Write one very long prompt covering every edge case before writing any code at all","Start with a simple prompt for the form, then add specific prompts for behavior","Avoid prompts and rely only on Copilot guessing from the file name","Keep repeating the same short prompt until the output changes"],"answer":1,"explain":"The module suggests starting simple, for example \"create an HTML form with a text field and button\". Then you add more specific prompts, such as one for the event listener and the POST request. This matches GitHub's advice to start general and then get specific.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m5-q05","module":"p2m5","domain":"prompt","q":"You're not getting the JavaScript output you want from Copilot. Which action does the module recommend?","options":["Uninstall and reinstall the Copilot extension to reset its suggestions","Reword the prompt, or start writing code for Copilot to complete","Switch the file's language mode to plain text so Copilot stops guessing","Accept the suggestion anyway and plan to fix it before release"],"answer":1,"explain":"If you're stuck, reword the prompt or start writing code so Copilot has more to go on. Output quality depends a lot on how well you write the prompt.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-javascript/4-use-copilot-with-javascript"},{"id":"p2m6-q01","module":"p2m6","domain":"prompt","q":"In a .py file, a developer types `# Create a web API using FastAPI with a route to products.` and pauses. What does Copilot do?","options":["Ignores it, because Copilot never uses code comments as prompts in .py files","Treats the comment as a prompt and suggests code you can accept or reject","Scaffolds a new FastAPI project in a separate repository on GitHub","Opens a pull request that contains the generated API and its tests"],"answer":1,"explain":"Copilot treats a natural-language comment in a code file as a prompt. It suggests code, such as a FastAPI app with a /products route, which you can accept or reject.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/2-what-is-github-copilot"},{"id":"p2m6-q02","module":"p2m6","domain":"prompt","q":"Which Python comment prompt is most likely to produce the endpoint a developer actually needs?","options":["# Create an API endpoint for the app that does what the frontend needs it to do","# Make a good endpoint here, using whichever framework and fields seem best","# FastAPI POST endpoint: accept JSON {\"text\": str}, return the text's checksum","# Endpoint please, handle the request and return something useful to the caller"],"answer":2,"explain":"A clear, specific prompt that names the framework, HTTP method, input shape, and expected output tells Copilot the goal and scope. Vague prompts may produce an unfamiliar framework or unexpected data.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/4-use-copilot-with-python"},{"id":"p2m6-q03","module":"p2m6","domain":"productivity","q":"A FastAPI endpoint generated by Copilot crashes on startup because the base64 and os modules aren't imported. What is an efficient fix that keeps the developer accountable?","options":["Ask Copilot Chat to add the missing imports, then review and test the change","Delete the endpoint, because generated code with errors can't be repaired","Ignore the crash, because Copilot will fix it in the next suggestion","Disable error reporting so the application starts and serves requests anyway"],"answer":0,"explain":"In the module exercise, you ask Copilot Chat to add the missing imports, then confirm the endpoint works at /docs. Generated code still needs reviewing and testing.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-copilot-python/5-exercise-python-web-api"},{"id":"p2m6-q04","module":"p2m6","domain":"prompt","q":"A developer wants a Python function that pulls dates in several formats out of a string. Which addition to the prompt will most improve the result?","options":["A request to make the function as short as possible","Example inputs and the exact output expected for each","A note that the code is going into production soon","A list of unrelated functions from elsewhere in the module"],"answer":1,"explain":"Examples help Copilot understand what you want. That includes sample input data, expected outputs, or unit tests written first. A request for short code or a note about production doesn't clarify the expected behavior.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"p2m6-q05","module":"p2m6","domain":"responsible","q":"Copilot generates a Python data-processing function that looks correct at first glance. What should the developer do before relying on it?","options":["Commit it as is, because Copilot output is already validated","Review and test it as they would a colleague's code","Ask Copilot whether it is correct and trust its answer","Only check that the file still passes the formatter"],"answer":1,"explain":"Check AI-generated code the same way you'd check a colleague's work: assess it, test it, and confirm it's correct before relying on it. Asking Copilot to grade its own code isn't validation.","source":"https://docs.github.com/en/copilot/concepts/prompting/prompt-engineering"},{"id":"extra-q01","module":"extra","domain":"features","q":"A developer gets a Copilot Business license from two organizations in the same enterprise. Org A enables Copilot CLI and Org B disables it. The enterprise delegated the policy with \"Let organizations decide\". What happens?","options":["Enabled: within one enterprise the least restrictive setting usually applies","Disabled, because the most restrictive setting wins within an enterprise","Whichever organization is billed for the user's seat that month decides, so access can change monthly","The user must choose a default organization in settings, and only that org's policy is applied"],"answer":0,"explain":"Within one enterprise, the least restrictive policy usually applies, and the policy-conflicts reference lists Copilot CLI as 'least restrictive organization'. 'Most restrictive' is the rule for licenses from multiple different enterprises, plus a few sensitive policies.","source":"https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts"},{"id":"extra-q02","module":"extra","domain":"features","q":"A contractor holds Copilot licenses from two different enterprises. Enterprise X disables Copilot Chat on GitHub.com; Enterprise Y enables it. What is the result for the contractor?","options":["Disabled: across different enterprises the most restrictive policy almost always applies","Enabled, because the least restrictive policy applies whenever a user holds more than one license","The enterprise that assigned its license first takes precedence until that license is removed","The contractor's personal Copilot settings decide, since the two enterprise policies cancel out"],"answer":0,"explain":"When a user has licenses from multiple different enterprises, the most restrictive policy almost always applies; the docs use exactly this Copilot Chat example. The listed exceptions are AI credit paid usage and GitHub Spark. 'Least restrictive' is the usual rule for organizations within one enterprise.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-q03","module":"extra","domain":"features","q":"An enterprise owner sets a Copilot feature policy to \"Disabled\" at the enterprise level. An organization owner wants the feature for one team. What can the organization owner do?","options":["Nothing at org level; an explicit enterprise setting can't be overridden by org owners","Override it in the organization's Copilot policies","Enable it for that one team only, because team-level overrides are allowed under enterprise policies","Commit a repository custom instructions file that re-enables the feature in that team's repositories"],"answer":0,"explain":"If the enterprise owner has explicitly enabled or disabled a policy, organization owners cannot override it. Organizations only control policies the enterprise set to 'Let organizations decide'. Custom instructions guide responses; they don't change policies.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/manage-policies"},{"id":"extra-q04","module":"extra","domain":"features","q":"An enterprise assigns some Copilot licenses directly to users rather than through an organization. Several policies are set to \"Let organizations decide\". Which setting determines those policies for the directly assigned users?","options":["A separate \"Policies for enterprise-assigned users\" setting that sets them to enabled or disabled","The policy of whichever organization the user most recently joined, even if that org didn't grant the license","The user's personal Copilot settings","GitHub's built-in defaults for Copilot Free, since enterprise-assigned users have no organization policy"],"answer":0,"explain":"\"Let organizations decide\" doesn't cover users who get Copilot directly from the enterprise. A separate \"Policies for enterprise-assigned users\" setting decides whether those policies default to enabled or disabled for them.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-q05","module":"extra","domain":"features","q":"An enterprise wants newly released generally available Copilot features to reach users automatically, with organizations unable to switch them off. How should the \"Default policy for new features and clients\" policy be set?","options":["Enabled everywhere","Let organizations decide","Unconfigured","Enabled for selected organizations"],"answer":0,"explain":"With \"Enabled everywhere\", any unconfigured GA feature is turned on for all Copilot users and organizations cannot disable it. \"Let organizations decide\" hands the default to each organization's own setting.","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-q06","module":"extra","domain":"features","q":"An enterprise has enabled the default-availability policies for features and models. A new feature is released in public preview. Which statement is correct?","options":["That policy doesn't apply to features in preview, so it won't auto-enable this preview feature","It is enabled for all users automatically, because the default policy covers every newly released feature","It is enabled automatically, but only for organization owners until it reaches general availability","It is enabled in IDEs only, because preview features are never offered on GitHub.com"],"answer":0,"explain":"The \"Default policy for new features and clients\" applies to newly released and unconfigured generally available (GA) features. It does not apply to features in preview.","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-q07","module":"extra","domain":"features","q":"An admin sets \"Default availability for released models\" to Enabled. A model in pre-release (not GA) becomes available in Copilot. What is its default status for the enterprise?","options":["Disabled by default, because pre-GA models are outside the default availability policy","Enabled automatically, because the policy covers every model that is not explicitly configured","Enabled automatically, but only in Copilot Chat on GitHub.com and not in IDEs","Enabled for organization owners only, until an enterprise owner approves it"],"answer":0,"explain":"Pre-GA models are excluded from the default availability policy and are disabled by default whatever that policy says. The policy only affects GA models labeled \"Delegate to Default Policy\".","source":"https://docs.github.com/en/copilot/concepts/enterprise/default-availability"},{"id":"extra-q08","module":"extra","domain":"features","q":"A security team asks whether disabling a Copilot feature by policy will also take effect in developers' IDEs and Copilot CLI, not just on GitHub.com. What is the accurate answer?","options":["They can apply on any surface where users sign in to Copilot, but not every policy covers every surface","Policies only apply on GitHub.com; IDE and CLI behavior must be set in each tool's local settings files","Every policy applies equally everywhere, so one disabled on GitHub.com is always disabled in IDEs and CLI","They apply to IDEs and GitHub.com, but Copilot CLI ignores organization policies because it runs locally"],"answer":0,"explain":"Policies can apply to IDEs, the GitHub website, and Copilot CLI, but not all policies apply to every surface. GitHub keeps a 'Supported surfaces for GitHub Copilot policies' reference for checking each policy.","source":"https://docs.github.com/en/copilot/concepts/policies"},{"id":"extra-q09","module":"extra","domain":"features","q":"Two organizations in one enterprise license the same user. Org A allows members without a Copilot license to use Copilot code review on GitHub.com; Org B does not. How is this policy resolved?","options":["Most restrictive: one organization disabled it, so it's disabled for the user in all their organizations","Least restrictive: it's enabled, as with most Copilot policies, because one organization enabled it","The organization billed for the user's seat that month decides the setting for both orgs","The enterprise's default for code review applies, and both organization settings are ignored"],"answer":0,"explain":"Most policies resolve to the least restrictive organization, but 'Allow members without a Copilot license to use Copilot code review in GitHub.com' is one of the exceptions that resolve to the most restrictive. The general 'Copilot code review' policy is least restrictive.","source":"https://docs.github.com/en/copilot/reference/enterprise-administrators/policy-conflicts"},{"id":"extra-q10","module":"extra","domain":"features","q":"A developer pays for a personal Copilot Pro plan and is then assigned a Copilot Business seat by their employer's organization. What happens to the personal plan?","options":["It's cancelled automatically with a prorated refund; the organization's policies then apply","It stays active, and the user switches between personal and organization policies per repository","It stays active, and its personal policies override the organization's wherever the two conflict","It's paused until the Business seat is removed, then resumes automatically, with no refund issued"],"answer":0,"explain":"When a user with Copilot Pro, Pro+, or Max is assigned a Business or Enterprise seat, the personal plan is cancelled automatically with a prorated refund. That's why personal policies can't conflict with organization or enterprise policies.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-q11","module":"extra","domain":"features","q":"A user is assigned a Copilot Business seat by Org A and a Copilot Enterprise seat by Org B, both in the same enterprise. How is the user billed?","options":["Only the Enterprise seat is billed, and the user gets Copilot Enterprise features","Both seats are billed separately, and the user gets the combined features of both plans","Only the Business seat is billed, because it was the first seat assigned to the user","Both seats are billed, but the user is limited to Copilot Business features until one is removed"],"answer":0,"explain":"If a user has Business and Enterprise seats from different organizations in the same enterprise, only the Enterprise seat is billed and the user gets Enterprise features. A unique user is billed only once per billing cycle within an enterprise.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-q12","module":"extra","domain":"features","q":"A compliance officer wants to know what the GitHub audit log records about Copilot in their enterprise. Which statement is accurate?","options":["Plan changes (policies, settings, licenses) and agent activity on GitHub, but not prompts sent in local clients","Every prompt and suggestion from IDEs and Copilot CLI, so admins can review exactly what each developer asked Copilot","Only billing events such as invoices; policy changes and seat assignments are visible only in the settings UI","Each accepted inline suggestion with its file and line, so admins can trace which code Copilot generated"],"answer":0,"explain":"The audit log covers changes to the Copilot plan (settings, policies, licenses) and agent activity on the GitHub website. It does not include client session data such as prompts sent locally; capturing those needs a custom solution such as hooks.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q13","module":"extra","domain":"features","q":"An enterprise owner wants to search the audit log for every event related to their Copilot plan. Which search term should they use?","options":["action:copilot","actor:Copilot","event:copilot_usage","repo:copilot-settings"],"answer":0,"explain":"The 'action:copilot' search shows all events related to the Copilot plan. 'actor:Copilot' is a different search: it shows activity performed by Copilot agents.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q14","module":"extra","domain":"features","q":"An admin needs to see what actions Copilot agents took on the GitHub website, such as pushes made by an agent. Which audit log search is intended for this?","options":["actor:Copilot","actor:agent","action:copilot.cfb_org_settings_changed","action:copilot.content_exclusion_changed"],"answer":0,"explain":"Use 'actor:Copilot' to view agent activity. The 'action:copilot.*' events record plan changes such as seat assignments, settings changes, and content exclusion updates, not actions taken by agents.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q15","module":"extra","domain":"privacy","q":"An organization owner changes the paths excluded from Copilot in the organization's content exclusion settings. Which audit log event records this?","options":["copilot.content_exclusion_changed","copilot.cfb_seat_management_changed","copilot.plan_changed","copilot.cfb_seat_assignment_refreshed"],"answer":0,"explain":"copilot.content_exclusion_changed is logged when the excluded paths for Copilot are updated, and it includes an excluded_paths field. cfb_seat_management_changed covers who gets Copilot access, not exclusions.","source":"https://docs.github.com/en/enterprise-cloud@latest/admin/monitoring-activity-in-your-enterprise/reviewing-audit-logs-for-your-enterprise/audit-log-events-for-your-enterprise"},{"id":"extra-q16","module":"extra","domain":"features","q":"A user got a Copilot seat automatically after SCIM added them to a team that has Copilot access. Who is shown as the actor on the copilot.cfb_seat_added audit event?","options":["Whoever originally granted Copilot access to that team, not the account that added the new member","The account or integration that added the user to the team, such as the SCIM provisioning identity","The user who received the seat, since team-based seat creation is recorded as self-service","No actor; team-based seat events are logged as anonymous system events"],"answer":0,"explain":"For team-based assignments, copilot.cfb_seat_added credits whoever originally gave the team Copilot access. The actual membership change is recorded correctly on the team.add_member or org.add_member event.","source":"https://docs.github.com/en/copilot/reference/copilot-billing/seat-assignment"},{"id":"extra-q17","module":"extra","domain":"features","q":"An enterprise must keep Copilot audit events for three years for compliance. What do GitHub's docs recommend?","options":["Stream the audit log to a SIEM, because the built-in audit log keeps events for 180 days","Increase the audit log retention setting to three years in the enterprise settings","Export the audit log once a year, because the built-in audit log keeps events for 400 days","Enable Copilot Memory, which stores audit events alongside repository facts"],"answer":0,"explain":"The audit log keeps events for the last 180 days. For long-term history and alerts, GitHub recommends streaming the audit log to a SIEM platform rather than relying on built-in retention. Copilot Memory has nothing to do with audit events.","source":"https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-for-organization/review-activity/review-audit-logs"},{"id":"extra-q18","module":"extra","domain":"features","q":"An org owner wants a script that lists everyone the organization is currently billed for in Copilot Business, with each user's last activity. Which REST endpoint fits?","options":["GET /orgs/{org}/copilot/billing/seats","GET /orgs/{org}/copilot/billing","GET /orgs/{org}/members?filter=copilot","GET /orgs/{org}/copilot/metrics/reports/organization-28-day/latest"],"answer":0,"explain":"GET /orgs/{org}/copilot/billing/seats lists billed seats, including last_activity_at and last_activity_editor. GET /orgs/{org}/copilot/billing returns a seat breakdown and settings, not per-user seats.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q19","module":"extra","domain":"features","q":"During automated onboarding, a platform team wants to give Copilot Business seats to a list of specific users through the API. Which endpoint should they call?","options":["POST /orgs/{org}/copilot/billing/selected_users","PUT /orgs/{org}/members/{username}/copilot/seat","POST /orgs/{org}/copilot/billing/seats/bulk_assign","PATCH /orgs/{org}/copilot/billing"],"answer":0,"explain":"POST /orgs/{org}/copilot/billing/selected_users buys a seat for each user listed. The matching endpoint for teams is POST /orgs/{org}/copilot/billing/selected_teams.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q20","module":"extra","domain":"features","q":"An org owner calls DELETE /orgs/{org}/copilot/billing/selected_users for a user whose Copilot seat was assigned to them directly, not through a team. What happens?","options":["The seat is set to pending cancellation; the user keeps access until the billing cycle ends","The user loses Copilot access immediately, and the unused days are refunded to the organization","The seat is deleted at once, and the same call also removes the user from the organization","The request fails, because seats can only be removed on the organization's Copilot settings page"],"answer":0,"explain":"Removing users sets their seats to 'pending cancellation', and they lose access at the end of the current billing cycle (unless they keep access through team membership). If a user's seat was assigned via a team, this call returns a 422 error instead; remove the team with DELETE .../selected_teams.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q21","module":"extra","domain":"features","q":"A seat report shows last_activity_at as null for developers who use Copilot daily in their IDE. What is the most likely cause?","options":["IDE telemetry is turned off; IDE activity only appears in last_activity_at when telemetry is enabled","Their seats are pending cancellation, and pending seats stop reporting activity data until renewed","They use custom instructions, which stop Copilot from recording activity data for those sessions","Content exclusions are configured for their repos, which hides all activity for affected users"],"answer":0,"explain":"The seat endpoints note that users must have telemetry enabled in their IDE for Copilot IDE activity to show up in last_activity_at.","source":"https://docs.github.com/en/rest/copilot/copilot-user-management"},{"id":"extra-q22","module":"extra","domain":"features","q":"An enterprise analytics team calls the Copilot usage metrics REST endpoints and gets errors, although they have the right role. Which enterprise policy must be configured for these endpoints to work?","options":["The \"Copilot usage metrics\" policy must be set to Enabled everywhere","The \"Default policy for new features and clients\" must be set to Enabled everywhere","The \"Editor preview features\" policy must be enabled for all organizations","The \"Suggestions matching public code\" policy must be set to Allowed"],"answer":0,"explain":"The usage metrics endpoints require the enterprise's \"Copilot usage metrics\" policy to be set to Enabled everywhere. The other policies control feature availability or privacy, not metrics API access. Older material refers to a \"Copilot Metrics API\" access policy for the legacy metrics endpoints; either way it's the metrics policy, not a feature or privacy policy.","source":"https://docs.github.com/en/rest/copilot/copilot-metrics"},{"id":"extra-q23","module":"extra","domain":"features","q":"What does a Copilot usage metrics report endpoint, such as GET /enterprises/{enterprise}/copilot/metrics/reports/enterprise-28-day/latest, return?","options":["Signed, expiring download links to report files, plus the date range covered","A paginated JSON array of every prompt and response sent to Copilot during the period","A CSV of seat assignments with billing amounts for the current billing cycle, per user","A live stream of usage events for the enterprise over a WebSocket connection"],"answer":0,"explain":"The reports endpoints return download_links (signed URLs with a limited lifetime) to report files, plus report_start_day and report_end_day. They provide aggregated usage metrics, not prompts or billing amounts.","source":"https://docs.github.com/en/rest/copilot/copilot-metrics"},{"id":"extra-q24","module":"extra","domain":"prompt","q":"A team wants Copilot to always follow their repository's coding conventions automatically, and separately wants a reusable \"generate a React form\" task that developers run only when needed. What is the best combination?","options":["Conventions in .github/copilot-instructions.md; the task as a .prompt.md in .github/prompts","Put both in .github/copilot-instructions.md so they are automatically available in every chat","Conventions in a .prompt.md file; the task in .github/copilot-instructions.md, run on demand","Put both in AGENTS.md, since that file is only loaded when a developer invokes it manually"],"answer":0,"explain":"Custom instructions apply automatically within their scope. Prompt files (.prompt.md, usually in .github/prompts) are reusable templates you call for one interaction. AGENTS.md is also applied automatically; it isn't invoked on demand.","source":"https://docs.github.com/en/copilot/concepts/prompting-and-context/prompt-files"},{"id":"extra-q25","module":"extra","domain":"prompt","q":"A monorepo has backend Python and frontend TypeScript code with different conventions. The team doesn't want TypeScript guidance cluttering requests about Python files. What should they use?","options":["Path-specific .instructions.md files in .github/instructions with applyTo globs","A single .github/copilot-instructions.md file with separate headings for each language","Separate .prompt.md files that developers must remember to attach to every request","Personal custom instructions configured by each developer on GitHub.com"],"answer":0,"explain":"Path-specific instructions in .github/instructions/**/*.instructions.md use an applyTo glob, so they only apply to matching files. This keeps repository-wide instructions from filling up with guidance meant for other files.","source":"https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/add-custom-instructions/add-repository-instructions"},{"id":"extra-q26","module":"extra","domain":"features","q":"A team wants a reusable \"security reviewer\" role that can read and search files but has no editing tools, and that they can pick or delegate to. What should they create?","options":["A custom agent profile in .github/agents with a restricted tools list in its frontmatter","An AGENTS.md file in the repository root that describes the reviewer role and lists its allowed tools","A path-specific instructions file with applyTo: \"**\" telling Copilot never to edit any files","A personal instruction on GitHub.com asking Copilot to always act as a security reviewer"],"answer":0,"explain":"Custom agents are Markdown profiles with YAML frontmatter that define a specialist role and can restrict its tools. AGENTS.md only provides instructions and is separate from agent definitions in .github/agents. An instruction saying 'don't edit' doesn't remove any tools.","source":"https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-custom-agents"},{"id":"extra-q27","module":"extra","domain":"prompt","q":"In Copilot Chat on GitHub.com, a user's personal instructions say \"respond in French\" while the organization's custom instructions say \"respond in English\". Which instruction has higher precedence?","options":["Personal instructions, which rank above repository and organization instructions on GitHub.com","Organization instructions, which always override personal and repository instructions","Repository-wide instructions, which rank above both personal and organization instructions","Neither; Copilot Chat on GitHub.com ignores personal instructions when organization instructions exist"],"answer":0,"explain":"For Copilot Chat on GitHub.com, precedence from highest to lowest is: personal, then repository (path-specific, repository-wide, agent instructions), then organization. All relevant instructions are still provided to the model.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-q28","module":"extra","domain":"features","q":"An organization owner adds organization custom instructions requiring a security checklist. Developers report the instructions are ignored in local IDE chat sessions. Why?","options":["They're only supported on the GitHub website and in Copilot code review, not in local clients","They only take effect after each developer copies them into their own personal instructions","They only apply to members who get their Copilot license from that organization, not other orgs in the enterprise","They must also be committed as AGENTS.md in every repository before IDEs will load them"],"answer":0,"explain":"Organization custom instructions currently work in sessions on the GitHub website (cloud sandboxes or GitHub Actions) and in Copilot code review, not in local client sessions. They apply to all organization members, whichever organization gives them their license.","source":"https://docs.github.com/en/copilot/concepts/prompting/response-customization"},{"id":"extra-q29","module":"extra","domain":"features","q":"During a long agent session, the main conversation is filling with intermediate research output. What is the main benefit of delegating that research to a subagent?","options":["It runs in its own context window and returns a focused result to the main agent","It shares the main agent's context window, so it can reuse the full history at no extra cost","It always uses fewer model requests than the main agent, so delegation lowers total usage","It permanently saves its findings as repository instructions"],"answer":0,"explain":"A subagent does delegated work in a separate context window, so its intermediate steps don't fill the main conversation. Delegation can increase model usage, because each agent makes its own model calls.","source":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"extra-q30","module":"extra","domain":"features","q":"In Copilot CLI, a developer wants the main agent to split a large task into independent subtasks and run them in parallel with subagents. Which slash command is designed for this?","options":["/fleet","/plan","/review","/delegate-all"],"answer":0,"explain":"/fleet has the main agent act as orchestrator: it breaks the work into subtasks and runs independent ones in parallel with subagents. /plan helps shape the breakdown first but doesn't run the subtasks in parallel itself.","source":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"extra-q31","module":"extra","domain":"features","q":"A developer is considering /fleet for a strictly sequential migration, where each step depends on the previous one. What is the most accurate advice?","options":["It may not help with sequential work, and multiple agents can consume more AI credits","It always finishes faster, because subagents share one context window and skip duplicate work","It is required for multi-step work, because the main agent can't carry out dependent steps itself","It reduces AI credit use, because subagents run on cheaper models by default"],"answer":0,"explain":"Parallel delegation helps most when tasks are independent. Each subagent calls the model separately, so /fleet can use more GitHub AI credits and may not help with sequential work.","source":"https://docs.github.com/en/copilot/concepts/agent-capabilities/choosing-and-delegating-agent-work/delegating-and-parallelizing-work-with-agents"},{"id":"extra-q32","module":"extra","domain":"features","q":"In VS Code with the Copilot harness, a developer wants to understand how authentication works in an unfamiliar codebase, with no risk of files being changed. Which built-in agent fits best?","options":["Ask, which only has read-only tools and can't edit files","Agent, with a prompt telling it \"do not change any files\" so it stays read-only","Plan, which edits files in small batches and asks for approval after each change","Autopilot, which works autonomously but skips file edits while it researches"],"answer":0,"explain":"Ask answers questions and researches the codebase with read-only tools only. Telling Agent not to change files guides the model but doesn't change its tools or permissions. Older material describes Ask, Edit and Agent modes; Ask is the read-only choice in both.","source":"https://code.visualstudio.com/docs/agents/run/agent-harnesses"},{"id":"extra-q33","module":"extra","domain":"features","q":"A developer wants Copilot in VS Code to research a cross-cutting change, ask clarifying questions, and produce an implementation plan to review before any code is written. What should they use?","options":["The Plan agent, for example by entering /plan followed by the goal and constraints","The Ask agent, then copy its answer into a prompt file to run later","Inline chat on the main file, since it edits code in place and shows a diff","The Agent agent with Autopilot, so it plans and implements in one step"],"answer":0,"explain":"The Plan agent (/plan) researches the project, asks clarifying questions, and presents a plan to review. You can then implement it, approve it, or reject it. Autopilot carries on autonomously, which skips the review checkpoint.","source":"https://code.visualstudio.com/docs/agents/run/planning"},{"id":"extra-q34","module":"extra","domain":"features","q":"A developer forks a VS Code agent conversation to try an alternative approach, assuming the fork keeps its file changes separate from the original. What is the risk?","options":["The fork shares the original workspace, so both can edit the same files unless worktrees are used","Forking drops the conversation history, so the fork must be re-prompted with every requirement from scratch","Forking automatically creates a new Git branch, so the fork's changes will need a merge back later","Forking makes the original conversation read-only until the fork is closed or merged back into it"],"answer":0,"explain":"A fork keeps the conversation up to the fork point but can share the original session and worktree. Forking isn't a Git branch or separate worktree, so use separate worktrees when changes must stay apart.","source":"https://code.visualstudio.com/docs/agents/concepts/sessions"},{"id":"extra-q35","module":"extra","domain":"features","q":"Copilot Memory stored the fact \"this repository uses Vitest for unit tests\". Who can benefit from this memory?","options":["Eligible users working in that repository; it isn't used in other repositories","Only the user whose session created it, because repository facts are private to their creator","Every member of the organization, across all of its repositories, including private ones","Anyone who forks the repository, because stored memories are copied into each fork"],"answer":0,"explain":"Repository-level facts are shared with eligible collaborators and only apply in that repository. They aren't pooled across an organization's repositories and aren't copied to forks.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-memory"},{"id":"extra-q36","module":"extra","domain":"features","q":"A tech lead wants a rule (\"never call the payment provider directly\") that Copilot applies consistently. Copilot Memory has already learned it. What does GitHub recommend?","options":["Put it in custom instructions; Copilot uses memories by judgment, so they aren't guaranteed","Rely on the memory, because stored repository facts are enforced as hard rules in every session","Ask Copilot to upvote the memory repeatedly until it becomes a permanent, enforced rule","Store it as a user-level preference instead, so it overrides repository settings everywhere"],"answer":0,"explain":"Copilot judges whether a stored fact is still accurate before using it, so a memory shouldn't be treated as a rule that is always followed. GitHub recommends custom instructions for consistent guidance.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-memory"},{"id":"p1m1-q20","module":"p1m1","domain":"responsible","q":"An AI-powered ticket-routing tool sends urgent security reports to the wrong queue. The manager responds: \"The model made that call, so it's on the vendor, not us.\" Which responsible AI principle does this attitude most directly conflict with?","options":["Accountability","Transparency","Inclusiveness","Privacy and security"],"answer":0,"explain":"Accountability says people should be accountable for AI systems. Companies that deploy AI must take responsibility for how it operates and keep monitoring and mitigating its risks, so blaming the model or the vendor shifts responsibility away from people. Transparency is about making the system understandable, not about who answers for it.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q21","module":"p1m1","domain":"responsible","q":"A bank's platform team is rolling out an internal AI assistant. Which practice most directly puts the accountability principle into action?","options":["Assign owners who continuously monitor it and act to mitigate its risks","Publish documentation explaining the design choices and known limitations","Test the assistant's outputs using demographically balanced sample data","Encrypt all prompts in transit and at rest using keys stored in a vault"],"answer":0,"explain":"The Learn module says AI creators are responsible for how their systems operate and need to continuously monitor performance and mitigate risks. Documenting design choices and limitations is transparency, balanced test data is fairness, and encryption is privacy and security.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q22","module":"p1m1","domain":"responsible","q":"A team is adding an AI feature that suggests replies to support tickets. A product manager also wants to log each customer's full browsing history \"in case it's useful later.\" Which practice from the privacy and security principle should the team apply?","options":["Collect only data the feature needs and drop sensitive data once used","Log the history but show it to the model only when customers complain","Log the history but encrypt it so the collection itself carries no risk","Log everything now and publish a transparency note describing the logs"],"answer":0,"explain":"The module's privacy guidance says to collect only the data needed for the AI to work, avoid gathering extra information, and remove sensitive data once the AI is in use. Encryption protects data you hold, but it doesn't justify collecting data you don't need.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q23","module":"p1m1","domain":"responsible","q":"To protect the training data behind an internal AI model, a team keeps encryption keys in hardware security modules, rotates the keys regularly, limits which employees can access the model, and runs regular security audits. Which responsible AI principle are they mainly applying?","options":["Privacy and security","Reliability and safety","Accountability","Transparency"],"answer":0,"explain":"The module lists these as privacy and security practices: secure key storage (HSMs, secure vaults, envelope encryption), regular key rotation, limited employee access to sensitive models and data, and regular security audits. Reliability and safety is about consistent, safe behavior, not data protection.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q24","module":"p1m1","domain":"responsible","q":"A startup is designing an AI feature that uses customer data. Which two practices match the privacy and security principle as the Responsible AI with GitHub Copilot module describes it? (Choose two.)","options":["Ask users for consent and clearly explain how the AI uses their data","Collect extra fields now in case future models can make use of them","Pseudonymize or aggregate personal data so individuals can't be identified","Keep raw personal data indefinitely so that every decision can be audited","Share model keys widely across the team so that no one is ever blocked"],"answer":[0,2],"explain":"The module says to get users' permission and explain how their data is used, and to anonymize personal data with methods like pseudonymization and aggregation. It also says to collect only the data needed, remove sensitive data once the AI is in use, and control who can access keys, which rules out the other three options.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q25","module":"p1m1","domain":"responsible","q":"While debugging a failing database connection, a developer is about to paste the full production connection string, including the password, into Copilot Chat. Which action best reflects the privacy and security principle?","options":["Replace the password with a placeholder and share only what's needed","Paste it, since encryption in transit makes sharing secrets risk-free","Paste it, then delete the chat thread as soon as the issue is resolved","Paste it into a new chat thread so it doesn't mix with other context"],"answer":0,"explain":"Privacy and security means sharing only the data a task actually needs. Copilot can debug a connection problem without the real password, so a placeholder is enough. Encrypting data in transit protects it on the way to the service, but it doesn't make it safe to share secrets you don't need to share, and deleting the thread afterwards doesn't undo the exposure.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q26","module":"p1m1","domain":"responsible","q":"A team uses Copilot to help build a model that ranks job applicants. Testing shows that candidates with similar qualifications get different scores depending on their age group. Which mitigation does the fairness principle call for?","options":["Monitor results by segment and add controls to override unfair scores","Publish a notice explaining that the scores are generated by an AI model","Encrypt the applicant data and restrict who can access the scoring model","Retrain only on the most recent hires so the model reflects current needs"],"answer":0,"explain":"The fairness techniques in the module include reviewing training data, testing with balanced demographic samples, adversarial debiasing, monitoring model performance across user segments, and adding controls to override unfair model scores. A notice is transparency and encryption is privacy. Retraining on a narrow set of recent hires can make the bias worse.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q27","module":"p1m1","domain":"responsible","q":"A company building an AI coding tutor invites developers from different countries, language backgrounds and disability communities to help shape its design, so it works with screen readers and in their languages. Which principle does this mainly reflect?","options":["Inclusiveness","Fairness","Transparency","Accountability"],"answer":0,"explain":"Microsoft's inclusiveness standard says AI should be accessible regardless of ability or language (for example, supporting screen readers and other languages), and that people from different backgrounds and communities should provide input into development. Fairness is about consistent outcomes for similarly situated people in decisions such as loans, treatment or hiring.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q28","module":"p1m1","domain":"responsible","q":"Developers distrust a new AI tool that blocks merges, because they can't tell why it flags some changes. Which action best applies the transparency principle?","options":["Document how it works and its limits, and log decisions for audit","Retrain it on a larger dataset so that it flags fewer changes overall","Run it only on repositories owned by teams that volunteer to use it","Have it flag changes for review instead of blocking the merge outright"],"answer":0,"explain":"Transparency means AI systems should be understandable. Creators should explain how the system operates, be honest about its capabilities and limitations, and support logging and auditing. Retraining or softening the tool might change its behavior, but it still wouldn't explain that behavior.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q29","module":"p1m1","domain":"responsible","q":"A company's AI policy says: (1) named people stay answerable for every AI-assisted outcome, and (2) users must be able to understand how the system reaches its outputs and what its limitations are. Which two responsible AI principles does the policy express? (Choose two.)","options":["Accountability","Transparency","Fairness","Inclusiveness","Reliability and safety"],"answer":[0,1],"explain":"\"People should be accountable for AI systems\" is accountability. \"AI systems should be understandable\", including honesty about limitations, is transparency. Neither statement is about equal treatment (fairness), accessibility (inclusiveness), or consistent, safe behavior (reliability and safety).","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q30","module":"p1m1","domain":"responsible","q":"A review finds that an AI budgeting assistant sometimes gives different answers to the same question, and that some of its advice could lead users into costly financial mistakes. Which principle covers both concerns?","options":["Reliability and safety","Fairness","Transparency","Privacy and security"],"answer":0,"explain":"In the module, reliability means performing consistently, without unwanted variability. Safety means minimizing unintended harm, including financial harm. Inconsistent answers and harmful advice therefore both fall under reliability and safety.","source":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-with-github-copilot/3-six-principles-of-responsible-ai"},{"id":"p1m1-q31","module":"p1m1","domain":"responsible","q":"A developer asks Copilot to generate sample user profiles for a demo. Every generated \"engineer\" is male and every \"nurse\" is female. What explains this, and what should the developer do?","options":["Training data biases can carry through; review and correct the output","The public code filter removed balanced examples; turn the filter off","Content exclusion hid the team's own data files; ask an admin to remove it","Copilot copies the most recent repository it indexed; reindex the project"],"answer":0,"explain":"GitHub lists potential biases as a limitation: Copilot's training data may contain biases and errors that the tool can perpetuate. Generated output therefore needs human review. The public code filter only blocks or annotates matches with public code. It doesn't shape demographics in generated data.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-q32","module":"p1m1","domain":"responsible","q":"A library released a new major version last month. Copilot keeps suggesting a function that the new version removed. What is the most likely reason, and what is the best response?","options":["Its training data may predate the release; check the current docs","The public code filter is hiding the new API; disable the filter","Copilot only suggests long-term-support versions; pin the old one","Content exclusion is blocking the library's files; ask an admin"],"answer":0,"explain":"Copilot's suggestions come from models trained on existing code, so very recent changes may be missing or underrepresented. That's why GitHub notes that web search (when enabled) can help with queries about recent events and new technologies. Either way, generated code must be reviewed and tested; the public code filter and content exclusion don't hide new APIs.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-q33","module":"p1m1","domain":"responsible","q":"Copilot suggests a login query that builds SQL by concatenating the username straight from the request. The code works in a quick manual test. What should the developer do?","options":["Rewrite it to use parameterized queries, then review and test it","Accept it; Copilot's content filters remove insecure code patterns","Accept it; a working quick test shows that the query is safe to use","Accept it, and enable the public code filter to block bad patterns"],"answer":0,"explain":"GitHub warns that generated code can be syntactically correct but still insecure. It tells developers to follow secure coding practices, such as avoiding SQL injection, and to review all generated code. Content filters reduce harmful or insecure output but don't guarantee it is secure, and the public code filter only deals with matches to public code.","source":"https://docs.github.com/en/copilot/responsible-use/inline-suggestions"},{"id":"p1m1-q34","module":"p1m1","domain":"responsible","q":"Copilot Chat in VS Code says a suggestion matches public code and links to a repository under a copyleft license. The team's product is closed source. Who must decide whether the license terms apply?","options":["The team using it; they must check and comply with any license","GitHub, which handles license compliance for all Copilot output","No one, since AI-generated code is exempt from license terms","The original author, who must file a claim before terms apply"],"answer":0,"explain":"GitHub's terms say output may be subject to third-party copyrights or open source licenses, and that you are responsible for deciding whether your use needs a license and for complying with it. Code referencing shows the match and its license details to help you make that decision. It doesn't make the decision for you.","source":"https://docs.github.com/en/site-policy/github-terms/github-terms-of-service#j-ai-features-training-and-your-data"},{"id":"p1m1-q35","module":"p1m1","domain":"responsible","q":"A startup's lawyer asks whether GitHub claims ownership of the code Copilot generates for the company's developers. What do GitHub's terms say?","options":["GitHub claims no ownership; users are responsible for how they use it","GitHub owns it but grants users a perpetual license to use and modify it","It is public domain because it was produced by an AI model, not a person","GitHub co-owns it until a developer has edited it substantially by hand"],"answer":0,"explain":"GitHub's terms state that GitHub does not claim ownership of your input or output. The same terms make you responsible for your use of the output, including legal compliance and not infringing third-party rights. Nothing in the terms makes output public domain or co-owned by GitHub.","source":"https://docs.github.com/en/site-policy/github-terms/github-terms-of-service#j-ai-features-training-and-your-data"},{"id":"p1m1-q36","module":"p1m1","domain":"responsible","q":"A team lead is preparing a briefing on the limitations that GitHub documents for Copilot. Which two belong on the list? (Choose two.)","options":["Suggestions can reproduce biases and errors found in training data","Generated code can look valid but be semantically or logically wrong","Inline suggestions are applied to files automatically after a pause","Suggestions are guaranteed original when the public code filter is on","Chat answers are equally good in every natural language it accepts"],"answer":[0,1],"explain":"GitHub lists potential biases and inaccurate code (valid-looking but incorrect) as limitations. Inline suggestions are only applied when you explicitly accept them. Agents can still produce public-code matches when the filter is set to Block. Chat is optimized primarily for English.","source":"https://docs.github.com/en/copilot/responsible-use/inline-suggestions"},{"id":"p1m1-q37","module":"p1m1","domain":"responsible","q":"After a team adopts Copilot, its defect rate rises. Reviews show developers accepted incorrect suggestions that looked plausible. GitHub calls this overreliance. What does its guidance give as the main reason overreliance happens?","options":["Mistakes in AI output can be hard for users to detect","AI tools produce output faster than users can type it","Users lack permission to edit the AI tool's suggestions","AI output is accepted automatically by default settings"],"answer":0,"explain":"GitHub defines overreliance as users accepting incorrect or incomplete AI output, \"mainly because mistakes in AI outputs may be hard to detect.\" Copilot suggestions are never accepted automatically. You can always edit them or reject them.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-q38","module":"p1m1","domain":"responsible","q":"Copilot code review comments that a function can throw a null reference error. However, the value is validated two lines earlier and can never be null. How should the author treat the comment?","options":["As a possible false positive: verify it, then resolve it if it's wrong","As a required fix, since Copilot review comments must all be resolved","As proof that the validation code is broken and should be rewritten","As a sign to stop using Copilot review until the model is replaced"],"answer":0,"explain":"GitHub warns that Copilot code review can hallucinate, flagging problems that don't exist or that come from misreading the code. Its comments should be carefully reviewed before acting on them. Copilot review supplements human judgment. It doesn't replace it.","source":"https://docs.github.com/en/copilot/responsible-use/agents"},{"id":"p1m1-q39","module":"p1m1","domain":"responsible","q":"A developer writes Copilot Chat prompts in Portuguese and gets weaker answers than a colleague who writes prompts in English. What is the documented explanation?","options":["Copilot Chat is optimized primarily for English","Non-English prompts are routed to a smaller model","Prompts are machine-translated before processing","Their organization's policy limits other languages"],"answer":0,"explain":"GitHub states that English is the primary supported language for Copilot Chat, which has been optimized mainly for English, so prompts in other languages may perform differently. There's no documented routing to a smaller model or forced translation.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-q40","module":"p1m1","domain":"responsible","q":"A team expects inline suggestions to catch design problems that span several services, such as two services duplicating the same responsibility. Why is this unrealistic?","options":["They're based on the code being written, not the overall architecture","Inline suggestions are disabled in repositories with multiple services","Design analysis is only available after an admin enables it as policy","Inline suggestions only work on files that were committed in the past day"],"answer":0,"explain":"GitHub notes that inline suggestions can only suggest code based on the context of the code being written, so they may miss larger design or architectural issues. Architectural review remains a human responsibility.","source":"https://docs.github.com/en/copilot/responsible-use/inline-suggestions"},{"id":"p1m1-q41","module":"p1m1","domain":"responsible","q":"Copilot generates a unit test suite for a new pricing function, and every test passes. A teammate says this proves the function is correct. What is the best response?","options":["Review the tests and add cases, since they may miss scenarios","Agree, because Copilot derives the tests from the requirements","Agree, as long as the tests were generated using agent mode","Regenerate the tests twice and merge if all three runs pass"],"answer":0,"explain":"GitHub says generated test cases may not cover all possible scenarios, so manual testing and code review are still necessary. Copilot builds tests from the code it can see, not from your business requirements. If the code is wrong, tests built from it can pass anyway.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-q42","module":"p1m1","domain":"responsible","q":"A developer generated a Copilot pull request summary, then pushed three more commits that change the approach. What should they do before asking for review?","options":["Request and review a new summary; it doesn't update on its own","Nothing; the summary refreshes automatically on each new commit","Nothing; reviewers are expected to ignore AI-written summaries","Delete the summary, because summaries can't be regenerated"],"answer":0,"explain":"PR summaries are only created on request and aren't refreshed when the pull request changes. You can request a new one, but you should review it carefully because it carries the same risk of inaccuracy. GitHub says summaries supplement your own context and don't replace it.","source":"https://docs.github.com/en/copilot/responsible-use/chat"},{"id":"p1m1-q43","module":"p1m1","domain":"responsible","q":"Copilot cloud agent (formerly coding agent) opens a pull request that changes payment logic. Which two actions are appropriate before merging? (Choose two.)","options":["Review every change as you would code that you didn't write yourself","Run the tests and security checks, and confirm it meets requirements","Merge it, because the agent's own CodeQL scan already cleared it","Merge it, because \"Verified\" commits prove the code is correct","Skip review, since the agent ran in a firewalled environment"],"answer":[0,1],"explain":"GitHub says to review and test agent output thoroughly before merging, with the same precautions as any code you didn't write. The agent's built-in scanning is an extra layer, not a sign-off. A Verified signature only shows the commit came from the agent and wasn't altered, and the firewall limits data exfiltration. Neither one shows the code is correct.","source":"https://docs.github.com/en/copilot/responsible-use/agents"},{"id":"p1m1-q44","module":"p1m1","domain":"responsible","q":"A team wants an automated layer of checks on Copilot-generated code, in addition to human review. Which approach matches GitHub's best practices?","options":["Run linting, code scanning, and IP scanning in the pipeline","Ask Copilot to grade its own output before each suggestion","Rely on Copilot's content filters to block any insecure code","Enable the public code filter and skip any further scanning"],"answer":0,"explain":"GitHub's best practices say to use automated tests and tooling, such as linting, code scanning, and IP scanning, to add another layer of security and accuracy checks. Content filters and the public code filter are useful safeguards, but they don't replace validation.","source":"https://docs.github.com/en/copilot/get-started/best-practices"},{"id":"p1m1-q45","module":"p1m1","domain":"responsible","q":"Copilot suggests a complex regular expression to validate email input. The developer doesn't fully understand it. What does GitHub recommend before using it?","options":["Ask Copilot Chat to explain it, then verify it with tests","Accept it, since regexes are one of Copilot's strengths","Accept it if no public code match is reported for it","Replace it with whatever the next suggestion offers"],"answer":0,"explain":"GitHub says to understand suggested code before implementing it, for example by asking Copilot Chat to explain it, and then to check it with tests and tooling. Generating regular expressions is listed as one of Copilot's strengths, but the output still needs to be validated.","source":"https://docs.github.com/en/copilot/get-started/best-practices"},{"id":"p1m1-q46","module":"p1m1","domain":"responsible","q":"A developer wants Copilot CLI to run a data-cleanup task against a production database unattended, using --allow-all-tools so it never asks for approval. What does GitHub's guidance suggest?","options":["Avoid blanket approval for destructive, hard-to-reverse actions","Proceed, since Copilot CLI won't run commands that delete data","Proceed, since GitHub is responsible for commands the CLI runs","Proceed, but launch the CLI from the home directory for access"],"answer":0,"explain":"GitHub warns that with an automatic approval option such as --allow-all-tools, Copilot can run any shell command you can run without asking first. You are ultimately responsible for the commands Copilot CLI executes, and GitHub urges extra caution where agent actions are irreversible. It also says you typically shouldn't launch the CLI from your home directory.","source":"https://docs.github.com/en/copilot/concepts/agents/copilot-cli/about-copilot-cli"},{"id":"p1m3-q30","module":"p1m3","domain":"data","q":"A developer with a Copilot Business seat asks Copilot Chat in VS Code to refactor a proprietary module. With default settings, what does GitHub do with that prompt and Copilot's response?","options":["It doesn't retain them; Chat in the editor keeps no prompts or responses","It retains them for up to 28 days for abuse monitoring, then deletes them","It keeps them for two years, together with the user engagement data","It stores them in the organization's audit log so admins can review them"],"answer":0,"explain":"For Copilot Business and Enterprise, Copilot Chat in the code editor doesn't retain prompts and suggestions by default. The 28-day default applies to Copilot on GitHub.com and GitHub Mobile, and two years is the retention for user engagement data, not prompts.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m3-q31","module":"p1m3","domain":"data","q":"A compliance officer at a Copilot Enterprise company asks how long prompts and suggestions from Copilot on GitHub.com and in GitHub Mobile are kept by default. Based on exam-era guidance, what is the answer?","options":["They aren't retained once the response has been returned","They're retained for up to 28 days by default","They're retained for two years, like engagement data","They're retained until the user deletes the conversation"],"answer":1,"explain":"Exam-era material (Learn and the Trust Center): Copilot in GitHub and GitHub Mobile keep prompts and suggestions for up to 28 days by default, while Chat in the IDE keeps none. Since an announcement on 28 Aug 2026 (after the exam outline), Copilot on github.com moves to the agent sessions model and keeps chat data for the life of the account.","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{"id":"p1m3-q32","module":"p1m3","domain":"data","q":"According to GitHub's Copilot FAQ, how long is user engagement data (for example, accepted or dismissed suggestions and error messages) kept by default for Copilot Business and Enterprise?","options":["Two years, regardless of which surface was used","Up to 28 days, then it's deleted on every surface","It isn't kept; it's discarded along with the prompt","Only for as long as the user's Copilot seat is active"],"answer":0,"explain":"GitHub's exam-era Copilot FAQ ('How long does GitHub retain Copilot data for Business and Enterprise customers?', mirrored in the Trust Center) lists user engagement data as kept for two years for both IDE access and all other Copilot access. The 'not retained' and '28 days' periods describe prompts and suggestions, not engagement data.","source":"https://web.archive.org/web/20260228173246/https://github.com/features/copilot"},{"id":"p1m3-q33","module":"p1m3","domain":"data","q":"A privacy reviewer is listing the categories of personal data that Copilot processes. Which item is an example of 'user engagement data'?","options":["Pseudonymous events such as accepted or dismissed completions and error logs","The code before and after the cursor that's sent to the model with a request","The generated code lines or chat answers that Copilot returns to the user","Thumbs-up or thumbs-down reactions and optional comments on a response"],"answer":0,"explain":"GitHub defines user engagement data as pseudonymous identifiers captured on interactions, such as accepted or dismissed completions, error messages, system logs and usage metrics. Code context is part of the prompt, generated code is a suggestion, and reactions with comments are feedback data.","source":"https://github.com/features/copilot#faq"},{"id":"p1m3-q34","module":"p1m3","domain":"data","q":"The legal team at a Copilot Enterprise customer asks whether GitHub uses their developers' Copilot prompts and code to train AI models. Which statement is accurate?","options":["No, GitHub doesn't use Business or Enterprise data to train models","Yes, but only once prompts are anonymized and the 28-day window ends","Only if an org owner leaves the 'model training' policy at its default","Only for code in public repositories that the organization owns"],"answer":0,"explain":"GitHub uses neither Copilot Business nor Enterprise data to train models; that data is protected under GitHub's Data Protection Agreement, so the model-training setting isn't even shown for these plans. Training on interaction data (with an opt-out) applies only to individual plans.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m3-q35","module":"p1m3","domain":"data","q":"A developer on Copilot Pro doesn't want their Copilot prompts, suggestions and code snippets used to train GitHub's AI models. What should they do?","options":["Opt out of AI model training in their personal Copilot settings on GitHub","Set 'Suggestions matching public code' to Block in their Copilot settings","Add each of their repositories to a .copilotignore file so prompts aren't kept","Turn off 'Copilot access to Bing' so no prompt data leaves the GitHub tenant"],"answer":0,"explain":"Individual subscribers can opt out in their personal Copilot settings (Learn: 'Individual subscribers can opt-out'; current docs: since 24 Apr 2026, Free/Pro/Pro+/Max interaction data may be used for training unless 'Allow GitHub to use my data for AI model training' is Disabled). The public-code setting and Bing access control other things.","source":"https://docs.github.com/en/copilot/how-tos/manage-your-account/manage-policies"},{"id":"p1m3-q36","module":"p1m3","domain":"data","q":"Under Copilot Business default settings, as described in exam-era material, which TWO statements about retention of prompts and suggestions are accurate? (Choose two.)","options":["Copilot Chat in the IDE doesn't retain prompts or suggestions","Copilot on GitHub.com retains them for up to 28 days","IDE code completions retain them for 28 days for debugging","Every surface retains them for two years with engagement data","GitHub Mobile doesn't retain them because it has no code context"],"answer":[0,1],"explain":"Exam-era defaults for Business/Enterprise: Chat in the code editor keeps nothing, while Copilot in GitHub and GitHub Mobile keep prompts and suggestions for up to 28 days. Two years applies to user engagement data. (Since 28 Aug 2026, github.com chat moves to life-of-account retention; that's after the exam outline.)","source":"https://learn.microsoft.com/en-us/training/modules/introduction-prompt-engineering-with-github-copilot/4-github-copilot-data"},{
